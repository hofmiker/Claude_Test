<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starship Launch</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#8ec9f0; }
  #sky { position:fixed; inset:0; background:linear-gradient(#8ec9f0,#cfe9ff); transition:none; z-index:0; }
  canvas { display:block; position:relative; z-index:1; }
  #glow {
    position:fixed; width:820px; height:820px; border-radius:50%;
    pointer-events:none; transform:translate(-50%,-50%); opacity:0;
    background:radial-gradient(circle, rgba(255,225,140,0.92) 0%, rgba(255,150,40,0.55) 26%, rgba(255,90,10,0) 66%);
    mix-blend-mode:screen; filter:blur(2px); z-index:2;
  }
  #fade { position:fixed; inset:0; background:#000; opacity:1; pointer-events:none; z-index:4; }
  #countdown {
    position:fixed; top:8%; left:50%; transform:translate(-50%,0);
    font-family: "Helvetica Neue", Arial, sans-serif; font-weight:700;
    font-size:min(18vw,180px); color:#ffffff;
    text-shadow: 0 0 30px rgba(255,150,30,0.6), 0 4px 10px rgba(0,0,0,0.35);
    letter-spacing:2px; opacity:0; user-select:none; z-index:3;
  }
  #skipBtn {
    position:fixed; right:20px; bottom:20px; z-index:5;
    padding:10px 18px; border-radius:24px; border:2px solid rgba(255,255,255,.6);
    background:rgba(20,20,25,.45); color:#fff; font-family:Arial,sans-serif; font-size:14px;
    font-weight:600; letter-spacing:.3px; cursor:pointer; user-select:none;
    -webkit-tap-highlight-color:transparent; backdrop-filter:blur(2px);
  }
  #skipBtn:active { background:rgba(255,255,255,.35); }
  #skipBtn svg { vertical-align:-1px; margin-left:2px; }
  #joystick {
    position:fixed; bottom:26px; left:26px; z-index:5; display:none;
    width:118px; height:118px; border-radius:50%;
    border:2px solid rgba(255,255,255,.45); background:rgba(20,20,25,.35);
    touch-action:none; user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #joystick-knob {
    position:absolute; top:50%; left:50%; width:50px; height:50px;
    margin:-25px 0 0 -25px; border-radius:50%;
    background:rgba(255,255,255,.32); border:2px solid rgba(255,255,255,.62);
    pointer-events:none;
  }
  #jumpBtn {
    position:fixed; bottom:28px; right:28px; z-index:5; display:none;
    width:70px; height:70px; background:rgba(255,210,0,.25); border:2px solid rgba(255,210,0,.75);
    border-radius:50%; align-items:center; justify-content:center;
    cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  #jumpBtn.on { background:rgba(255,210,0,.55); }
  #jumpBtn .ico {
    width:0; height:0; margin-top:-3px;
    border-left:10px solid transparent; border-right:10px solid transparent;
    border-bottom:16px solid #fff;
  }
  #actionBtn {
    position:fixed; bottom:110px; right:34px; z-index:5; display:none;
    width:56px; height:56px; background:rgba(150,215,255,.22); border:2px solid rgba(150,215,255,.75);
    border-radius:50%; align-items:center; justify-content:center;
    cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  #actionBtn.on { background:rgba(150,215,255,.5); }
  #actionBtn .ico {
    width:16px; height:16px; border:3px solid #fff; border-radius:3px; transform:rotate(45deg);
  }
  #actionBtn.holding .ico { background:#fff; }
  #enterHint, #pickupHint {
    position:fixed; left:50%; bottom:112px; transform:translateX(-50%);
    z-index:5; display:none; padding:7px 16px; border-radius:16px;
    background:rgba(20,20,25,.5); border:1px solid rgba(255,255,255,.4);
    color:#fff; font-family:Arial,sans-serif; font-size:13px; font-weight:600;
    letter-spacing:.2px; pointer-events:none; text-align:center;
  }
  #pickupHint { border-color:rgba(150,215,255,.6); bottom:172px; }
  #crystalHud {
    position:fixed; top:16px; left:16px; z-index:5; display:none;
    padding:7px 14px; border-radius:16px; background:rgba(20,20,25,.5);
    border:1px solid rgba(200,140,255,.5); align-items:center; gap:8px;
    color:#fff; font-family:Arial,sans-serif; font-size:14px; font-weight:600;
  }
  #crystalHud .ico {
    width:12px; height:16px; background:#c07bff; opacity:0.95;
    clip-path: polygon(50% 0%, 100% 30%, 78% 100%, 22% 100%, 0% 30%);
    box-shadow: 0 0 6px 1px rgba(192,123,255,.9);
  }
  #minimap {
    position:fixed; top:16px; right:16px; z-index:5; display:none;
    width:168px; height:168px; border-radius:50%;
    border:2px solid rgba(255,255,255,.45);
    background:rgba(10,12,20,.5);
  }
  @media (max-width:768px), (pointer:coarse) { #minimap { width:122px; height:122px; } }
</style>
</head>
<body>
<div id="sky"></div>
<div id="glow"></div>
<div id="countdown"></div>
<div id="fade"></div>
<div id="skipBtn">Überspringen <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg></div>
<canvas id="minimap" width="168" height="168"></canvas>
<div id="crystalHud"><span class="ico"></span><span id="crystalCount">0 / 10</span></div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }

<script type="module">
import * as THREE from "three";

/* ---------- helpers ---------- */
const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (x,a,b) => Math.min(b, Math.max(a,x));
const smoothstep = (a,b,x) => { const t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const lerp = (a,b,t) => a + (b-a)*t;

/* ---------- renderer / scene / camera ---------- */
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:"high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 6000);

const hemi = new THREE.HemisphereLight(0xbfe0ff, 0xd6d2bf, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4e0, 1.15);
sun.position.set(120, 220, 160);
scene.add(sun);
const fill = new THREE.AmbientLight(0x8899aa, 0.25);
scene.add(fill);

function resize(){
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

/* ---------- materials ---------- */
const MAT = {
  metal:     new THREE.MeshStandardMaterial({ color:0xd9dde2, flatShading:true, metalness:0.35, roughness:0.5 }),
  metalDark: new THREE.MeshStandardMaterial({ color:0x9195a0, flatShading:true, metalness:0.4,  roughness:0.5 }),
  engineDark:new THREE.MeshStandardMaterial({ color:0x24252a, flatShading:true, roughness:0.85 }),
  tower:     new THREE.MeshStandardMaterial({ color:0xb7bbc1, flatShading:true, roughness:0.75 }),
  towerDark: new THREE.MeshStandardMaterial({ color:0x6b6f76, flatShading:true, roughness:0.8 }),
  yellow:    new THREE.MeshStandardMaterial({ color:0xffcc00, flatShading:true, roughness:0.55 }),
  red:       new THREE.MeshStandardMaterial({ color:0xe0362b, flatShading:true, roughness:0.55 }),
  pad:       new THREE.MeshStandardMaterial({ color:0x585c62, flatShading:true, roughness:0.95 }),
  trench:    new THREE.MeshStandardMaterial({ color:0x18181b, flatShading:true, roughness:1 }),
  ground:    new THREE.MeshStandardMaterial({ color:0x4f9a48, flatShading:true, roughness:1 }),
  groundDark:new THREE.MeshStandardMaterial({ color:0x3f8440, flatShading:true, roughness:1 }),
  sea:       new THREE.MeshStandardMaterial({ color:0x1f7fae, flatShading:true, roughness:0.3, metalness:0.2 }),
  scrub:     new THREE.MeshStandardMaterial({ color:0x3f8a3a, flatShading:true, roughness:1 }),
  trunk:     new THREE.MeshStandardMaterial({ color:0x7a5738, flatShading:true, roughness:1 }),
  frond:     new THREE.MeshStandardMaterial({ color:0x3f9c46, flatShading:true, roughness:1 }),
  tank:      new THREE.MeshStandardMaterial({ color:0xe7e9ec, flatShading:true, roughness:0.6 }),
  concrete:  new THREE.MeshStandardMaterial({ color:0xb9b9ae, flatShading:true, roughness:0.9 }),
  asphalt:   new THREE.MeshStandardMaterial({ color:0x3a3a3e, flatShading:true, roughness:0.9 }),
  hangarWall:new THREE.MeshStandardMaterial({ color:0xe6e8ea, flatShading:true, roughness:0.75 }),
  hangarRoof:new THREE.MeshStandardMaterial({ color:0x8992a0, flatShading:true, roughness:0.7 }),
  moonGround:new THREE.MeshStandardMaterial({ color:0x9a9a9a, flatShading:true, roughness:1 }),
  moonRock:  new THREE.MeshStandardMaterial({ color:0x828282, flatShading:true, roughness:1 }),
  moonBase:  new THREE.MeshStandardMaterial({ color:0xd6d8db, flatShading:true, roughness:0.6, metalness:0.2 }),
  moonBaseDark: new THREE.MeshStandardMaterial({ color:0x53565c, flatShading:true, roughness:0.6, metalness:0.2 }),
  earth:     new THREE.MeshStandardMaterial({ color:0x2f7fe0, emissive:0x1f5fb0, emissiveIntensity:0.9, flatShading:true, roughness:0.6 }),
  earthCloud:new THREE.MeshStandardMaterial({ color:0xffffff, flatShading:true, transparent:true, opacity:0.5, roughness:1 }),
  roverBody: new THREE.MeshStandardMaterial({ color:0xe8e2d0, flatShading:true, roughness:0.7 }),
  roverDark: new THREE.MeshStandardMaterial({ color:0x3a3a3e, flatShading:true, roughness:0.8 }),
  roverGold: new THREE.MeshStandardMaterial({ color:0xd8a83c, flatShading:true, roughness:0.5, metalness:0.4 }),
  stationWall:new THREE.MeshStandardMaterial({ color:0xd2d5da, flatShading:true, roughness:0.55, metalness:0.2 }),
  stationDark:new THREE.MeshStandardMaterial({ color:0x585c64, flatShading:true, roughness:0.6, metalness:0.2 }),
  stationDome:new THREE.MeshStandardMaterial({ color:0x8fd0e8, flatShading:true, roughness:0.15, metalness:0.1, transparent:true, opacity:0.55 }),
  suitWhite: new THREE.MeshStandardMaterial({ color:0xf1f0ea, flatShading:true, roughness:0.65 }),
  suitDark:  new THREE.MeshStandardMaterial({ color:0x2b2c30, flatShading:true, roughness:0.6 }),
  visor:     new THREE.MeshStandardMaterial({ color:0x0a0c10, flatShading:true, roughness:0.25, metalness:0.6 }),
  suitAccent:new THREE.MeshStandardMaterial({ color:0xd8362c, flatShading:true, roughness:0.55 }),
  crystal:   new THREE.MeshStandardMaterial({ color:0xa855f7, emissive:0x9333ea, emissiveIntensity:1.4, flatShading:true, roughness:0.25, metalness:0.15, transparent:true, opacity:0.92 }),
};

const PAD_X = 0, PAD_TOP = 6;
const PLATFORM_H = 3;
const ROVER_SCALE = 0.3;

/* ---------- engine exhaust glow: one flame assembly per nozzle ---------- */
function buildFlame(scale){
  const core = new THREE.Mesh(new THREE.ConeGeometry(3.8*scale,20*scale,10), new THREE.MeshBasicMaterial({ color:0xfff6d0, toneMapped:false }));
  core.rotation.x = Math.PI; core.position.y = -8.5*scale;
  const mid = new THREE.Mesh(new THREE.ConeGeometry(5.6*scale,14*scale,10), new THREE.MeshBasicMaterial({ color:0xffa93c, transparent:true, opacity:0.88, blending:THREE.AdditiveBlending, toneMapped:false }));
  mid.rotation.x = Math.PI; mid.position.y = -4.5*scale;
  const halo = new THREE.Mesh(new THREE.SphereGeometry(11.5*scale,12,10), new THREE.MeshBasicMaterial({ color:0xff7a1a, transparent:true, opacity:0.52, blending:THREE.AdditiveBlending, toneMapped:false }));
  halo.position.y = -1.3*scale;
  const outer = new THREE.Mesh(new THREE.SphereGeometry(19*scale,12,10), new THREE.MeshBasicMaterial({ color:0xff5010, transparent:true, opacity:0.25, blending:THREE.AdditiveBlending, toneMapped:false }));
  const grp = new THREE.Group();
  grp.add(outer, halo, mid, core);
  return { grp, core, mid, halo, outer };
}
function buildEngineGlow(scale, offsets){
  const root = new THREE.Group();
  const flames = offsets.map(([ox,oz]) => {
    const f = buildFlame(scale);
    f.grp.position.set(ox,0,oz);
    root.add(f.grp);
    return f;
  });
  root.visible = false;
  root.userData = { flames };
  return root;
}
function pulseEngine(glow, tt, freq){
  glow.userData.flames.forEach((u,idx) => {
    const ph = idx*0.7;
    u.core.scale.setScalar(0.85+Math.sin(tt*freq+ph)*0.15);
    u.mid.scale.setScalar(0.9+Math.sin(tt*freq*0.8+1+ph)*0.2);
    u.mid.material.opacity = 0.78+Math.sin(tt*freq*1.3+ph)*0.15;
    u.halo.material.opacity = 0.46+Math.sin(tt*freq*0.9+2+ph)*0.16;
    u.outer.material.opacity = 0.2+Math.sin(tt*freq*0.6+ph)*0.08;
  });
}

/* ---------- rocket: booster + ship (separable stages) ---------- */
const boosterR = 8, boosterH = 80;
const shipRb = 7.6, shipRt = 6.4, shipH = 45, noseH = 15;

function buildBoosterPart(){
  const g = new THREE.Group();
  let y = 0;
  const skirt = new THREE.Mesh(new THREE.CylinderGeometry(boosterR*1.02, boosterR*1.1, 6, 8), MAT.engineDark);
  skirt.position.y = y + 3; g.add(skirt); y += 6;

  const raptors = new THREE.Group();
  for(let i=0;i<7;i++){
    const a = (i/7)*Math.PI*2;
    const r = i===0?0:boosterR*0.55;
    const m = new THREE.Mesh(new THREE.ConeGeometry(1.1,2.4,6), MAT.engineDark);
    m.position.set(Math.cos(a)*r, 4.4, Math.sin(a)*r);
    m.rotation.x = Math.PI;
    raptors.add(m);
  }
  g.add(raptors);

  const booster = new THREE.Mesh(new THREE.CylinderGeometry(boosterR, boosterR, boosterH, 8), MAT.metal);
  booster.position.y = y + boosterH/2; g.add(booster);

  for(let i=0;i<4;i++){
    const a = (i/4)*Math.PI*2 + Math.PI/4;
    const fin = new THREE.Mesh(new THREE.BoxGeometry(4.5,7,0.6), MAT.metalDark);
    fin.position.set(Math.cos(a)*(boosterR+1.6), y+boosterH-10, Math.sin(a)*(boosterR+1.6));
    fin.rotation.y = -a;
    fin.rotation.z = 0.18;
    g.add(fin);
  }

  const stripe = new THREE.Mesh(new THREE.CylinderGeometry(boosterR+0.05, boosterR+0.05, 3, 8), MAT.red);
  stripe.position.y = y + boosterH - 4; g.add(stripe);

  y += boosterH;

  const boosterFlameOffsets = Array.from({length:7}, (_,i) => {
    const a = (i/7)*Math.PI*2, r = i===0?0:boosterR*0.55;
    return [Math.cos(a)*r, Math.sin(a)*r];
  });
  const engineGlow = buildEngineGlow(0.95, boosterFlameOffsets);
  engineGlow.position.y = 2;
  g.add(engineGlow);

  g.userData = { topY: y, engineGlow };
  return g;
}

function buildShipPart(){
  const g = new THREE.Group();
  let y = 0;

  const interstage = new THREE.Mesh(new THREE.CylinderGeometry(boosterR*0.98, boosterR, 3, 8), MAT.metalDark);
  interstage.position.y = y + 1.5; g.add(interstage);
  y += 3;

  const ship = new THREE.Mesh(new THREE.CylinderGeometry(shipRt, shipRb, shipH, 8), MAT.metal);
  ship.position.y = y + shipH/2; g.add(ship);

  for(let i=0;i<2;i++){
    const s = i===0?1:-1;
    const aft = new THREE.Mesh(new THREE.BoxGeometry(0.6,14,7), MAT.metalDark);
    aft.position.set(0, y+9, s*(shipRb+2.6));
    aft.rotation.x = s*0.35;
    g.add(aft);
    const fwd = new THREE.Mesh(new THREE.BoxGeometry(0.5,9,5), MAT.metalDark);
    fwd.position.set(0, y+shipH-6, s*(shipRt+1.8));
    fwd.rotation.x = s*0.3;
    g.add(fwd);
  }

  const rcsOffsets = [];
  const rcsY = y + shipH*0.6;
  for(let i=0;i<4;i++){
    const a = (i/4)*Math.PI*2 + Math.PI/4;
    const nx = Math.cos(a)*(shipRb+1), nz = Math.sin(a)*(shipRb+1);
    const nozzle = new THREE.Mesh(new THREE.ConeGeometry(0.9,2.4,6), MAT.metalDark);
    nozzle.position.set(nx, rcsY, nz);
    nozzle.rotation.z = Math.PI/2;
    nozzle.rotation.y = -a;
    g.add(nozzle);
    rcsOffsets.push([nx, rcsY, nz]);
  }

  y += shipH;
  const nose = new THREE.Mesh(new THREE.ConeGeometry(shipRt, noseH, 8), MAT.metal);
  nose.position.y = y + noseH/2; g.add(nose);
  y += noseH;

  const shipFlameOffsets = Array.from({length:3}, (_,i) => {
    const a = (i/3)*Math.PI*2, r = shipRb*0.42;
    return [Math.cos(a)*r, Math.sin(a)*r];
  });
  const engineGlow = buildEngineGlow(0.8, shipFlameOffsets);
  engineGlow.position.y = 3;
  g.add(engineGlow);

  // ── hatch + ramp (used after moon landing) ─────────────────────────────
  const hatchY = 17, hatchR = 7.3, hatchW = 4.2, hatchH = 6.2;
  const hatchOpening = new THREE.Mesh(new THREE.PlaneGeometry(hatchW,hatchH), MAT.engineDark);
  hatchOpening.position.set(hatchR-0.08, hatchY, 0);
  hatchOpening.rotation.y = Math.PI/2;
  g.add(hatchOpening);

  const hatchPivot = new THREE.Group();
  hatchPivot.position.set(hatchR, hatchY, -hatchW/2);
  g.add(hatchPivot);
  const hatchDoor = new THREE.Mesh(new THREE.BoxGeometry(0.25, hatchH, hatchW), MAT.metal);
  hatchDoor.position.set(0, 0, hatchW/2);
  hatchPivot.add(hatchDoor);

  const rampRun = 32;
  g.userData = { topY: y, engineGlow, rcsOffsets, hatchPivot, hatchY, hatchR, hatchW, rampRun };
  return g;
}

// Mobile ramp rig, used after moon landing: unlike the hatch door (which
// stays hinged to the hull), the ramp is a separate ground vehicle/gangway
// that drives in from a distance and docks against the hatch -- it does not
// unfold away from the ship. Built once the ship's hatch geometry is known;
// added to moonScene once that group exists (see below).
function buildRampRig(hatchR, hatchY, rampRun){
  const rampRise = hatchY + PLATFORM_H;
  const rampLen = Math.hypot(rampRun, rampRise);
  const angle = -Math.atan2(rampRise, rampRun);
  const grp = new THREE.Group(); // origin = the end that docks against the hatch
  const rampBody = new THREE.Group();
  rampBody.rotation.z = angle;
  const ramp = new THREE.Mesh(new THREE.BoxGeometry(rampLen, 0.5, 4.6), MAT.moonBase);
  ramp.position.x = rampLen/2;
  rampBody.add(ramp);
  for(let s=-1;s<=1;s+=2){
    const rail = new THREE.Mesh(new THREE.BoxGeometry(rampLen, 0.9, 0.2), MAT.moonBaseDark);
    rail.position.set(rampLen/2, 0.6, s*2.25);
    rampBody.add(rail);
  }
  // Small drive wheels under the ground-contact end, so it visibly reads as
  // a self-propelled gangway vehicle rather than a static ramp. Positioned
  // in rampBody's local (pre-rotation) space -- rampBody's own rotation.z
  // carries them to the correct tilted, ground-touching spot automatically.
  for(let s=-1;s<=1;s+=2){
    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,0.7,10), MAT.roverDark);
    wheel.rotation.x = Math.PI/2;
    wheel.position.set(rampLen-1.5, -0.6, s*2.6);
    rampBody.add(wheel);
  }
  grp.add(rampBody);
  grp.visible = false;
  return grp;
}

const boosterPart = buildBoosterPart();
const shipPart = buildShipPart();
const rampRig = buildRampRig(shipPart.userData.hatchR, shipPart.userData.hatchY, shipPart.userData.rampRun);
const SHIP_LOCAL_Y = boosterPart.userData.topY; // where the ship sits on top of the booster

const rocketStack = new THREE.Group();

/* ---------- launch pad, tower, ground ---------- */
const launchScene = new THREE.Group();
scene.add(launchScene);

{
  const land = new THREE.Mesh(new THREE.PlaneGeometry(2600, 1500), MAT.ground);
  land.rotation.x = -Math.PI/2;
  land.position.set(0, 0, 500);
  launchScene.add(land);

  const sea = new THREE.Mesh(new THREE.PlaneGeometry(2600, 1100), MAT.sea);
  sea.rotation.x = -Math.PI/2;
  sea.position.set(0, -0.4, -670);
  launchScene.add(sea);

  const landSkirt = new THREE.Mesh(new THREE.CircleGeometry(2600, 64), MAT.sea);
  landSkirt.rotation.x = -Math.PI/2;
  landSkirt.position.y = -0.6;
  launchScene.add(landSkirt);

  function farEnough(x,z,minD){
    if (Math.hypot(x-PAD_X, z) < minD) return false;
    if (Math.hypot(x-TOWER_X_PREVIEW, z) < minD) return false;
    if (Math.hypot(x-59, z-50) < 30) return false;
    if (Math.hypot(x-INDUSTRIAL_X, z-INDUSTRIAL_Z) < 100) return false;
    return true;
  }
  const TOWER_X_PREVIEW = -46;
  const INDUSTRIAL_X = 170, INDUSTRIAL_Z = 95;

  for(let i=0;i<70;i++){
    let x,z,ok=false,tries=0;
    do { x = rand(-420,420); z = rand(20,340); ok = farEnough(x,z,55); tries++; } while(!ok && tries<15);
    const s = new THREE.Mesh(new THREE.IcosahedronGeometry(rand(1.2,3),0), MAT.scrub);
    s.position.set(x, 1, z);
    launchScene.add(s);
  }

  function makePalm(x,z){
    const grp = new THREE.Group();
    const trunkH = rand(14,22);
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(1,1.6,trunkH,6), MAT.trunk);
    trunk.position.y = trunkH/2;
    trunk.rotation.z = rand(-0.12,0.12);
    grp.add(trunk);

const cloudSphereGeo = new THREE.SphereGeometry(1, 10, 8);
function makeCloudLayer(altitude, clusterCount, spreadRadius, opacity, sizeRange){
  const transforms = [];
  for(let c=0;c<clusterCount;c++){
    const cx = rand(-spreadRadius, spreadRadius);
    const cz = rand(-spreadRadius, spreadRadius);
    const puffs = Math.floor(rand(2,4));
    for(let i=0;i<puffs;i++){
      const size = rand(sizeRange[0], sizeRange[1]);
      transforms.push({
        x: cx+rand(-size*1.15,size*1.15),
        y: altitude+rand(-8,8),
        z: cz+rand(-size*1.15,size*1.15),
        s: size,
      });
    }
  }
  const opaque = opacity >= 0.999;
  const mat = new THREE.MeshStandardMaterial({
    color:0xffffff, flatShading:false, roughness:0.85,
    transparent: !opaque, opacity, depthWrite:true,
    emissive:0x333333, emissiveIntensity:0.15,
  });
  const mesh = new THREE.InstancedMesh(cloudSphereGeo, mat, transforms.length);
  const dummy = new THREE.Object3D();
  transforms.forEach((tr,i) => {
    dummy.position.set(tr.x, tr.y, tr.z);
    dummy.scale.setScalar(tr.s);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  });
  mesh.instanceMatrix.needsUpdate = true;
  launchScene.add(mesh);
}

const moonCraters = [];

function moonCraterY(x,z){
  let y = 0;
  for(const c of moonCraters){
    const d = Math.hypot(x-c.x, z-c.z);
    if (d < c.r){
      const tt = d/c.r;
      const bowl = -c.depth*(1-tt*tt);
      if (bowl < y) y = bowl;
    }
  }
  return y;
}
function rockBumpY(x,z){
  let y = 0;
  for(const rk of moonRocksData){
    if (rk.held) continue;
    const d = Math.hypot(x-rk.x, z-rk.z);
    if (d < rk.r){
      const tt = d/rk.r;
      const bump = rk.h*(1-tt*tt);
      if (bump > y) y = bump;
    }
  }
  return y;
}
function getMoonSurfaceY(x,z){
  if (Math.hypot(x-PAD_X,z) < 27) return PLATFORM_H;
  // Bilinear-interpolate craters between the same 20-unit grid corners the
  // rendered terrain mesh uses, instead of sampling the exact analytic bowl
  // formula at (x,z) directly. The mesh is flat-shaded between coarse grid
  // vertices, so on a steep crater wall the true curve dips measurably below
  // the straight chord the GPU actually draws -- a raw analytic sample there
  // reads as several units *underground* relative to what's on screen,
  // causing the astronaut/rover to visibly sink. Reconstructing the same
  // interpolation the mesh does keeps physics and visuals in agreement.
  // Rocks are NOT baked into the terrain mesh (they're separate decorative
  // objects) and their bump radius is smaller than one grid cell, so they're
  // sampled directly instead -- grid-interpolating them would miss most
  // rocks entirely and make them unclimbable.
  const half = MOON_TERRAIN_SIZE/2;
  const gx = (x+half)/MOON_TERRAIN_CELL, gz = (z+half)/MOON_TERRAIN_CELL;
  const ix = Math.floor(gx), iz = Math.floor(gz);
  const fx = gx-ix, fz = gz-iz;
  const wx = (i) => i*MOON_TERRAIN_CELL - half;
  const h00 = moonCraterY(wx(ix),   wx(iz));
  const h10 = moonCraterY(wx(ix+1), wx(iz));
  const h01 = moonCraterY(wx(ix),   wx(iz+1));
  const h11 = moonCraterY(wx(ix+1), wx(iz+1));
  const craterY = lerp(lerp(h00,h10,fx), lerp(h01,h11,fx), fz);
  return craterY + rockBumpY(x,z);
}
// Approximates a long object (station module, tube) as a chain of overlapping
// circles along its local X axis, for cheap push-out collision.
function registerCapsuleCollider(obj, r, len, segments){
  const n = segments || Math.max(2, Math.round(len/6));
  const p = new THREE.Vector3();
  for (let i=0;i<n;i++){
    const tt = n===1 ? 0 : (i/(n-1) - 0.5);
    p.set(tt*len, 0, 0);
    obj.localToWorld(p);
    moonCollidables.push({ x:p.x, z:p.z, r });
  }
}
function resolvePush(x, z, radius, list){
  let rx = x, rz = z;
  for (const c of list){
    const dx = rx - c.x, dz = rz - c.z;
    const minD = radius + c.r;
    const d = Math.hypot(dx,dz);
    if (d < minD){
      if (d < 0.0001){ rx += minD; }
      else { const push = (minD-d)/d; rx += dx*push; rz += dz*push; }
    }
  }
  return { x:rx, z:rz };
}

  function modPos(i){ return [stationMods[i].position.x, stationMods[i].position.y, stationMods[i].position.z]; }
  stationGroup.add(buildConnector(modPos(0), modPos(1), 2.6));
  stationGroup.add(buildConnector(modPos(0), modPos(2), 2.5));
  stationGroup.add(buildConnector(modPos(2), modPos(3), 2.2));
  stationGroup.add(buildConnector(modPos(0), modPos(4), 2.2));
  stationGroup.add(buildConnector(modPos(0), modPos(5), 2.0));
  stationGroup.position.set(-95, 0, -55);
  stationGroup.rotation.y = 0.4;
  moonScene.add(stationGroup);
  stationGroup.updateMatrixWorld(true);
  stationMods.forEach((m,i) => registerCapsuleCollider(m, modDefs[i].r, modDefs[i].len));

  // Glow is a cheap additive-blended unlit halo mesh, not a THREE.PointLight --
  // adding 10 more dynamic lights forces a shader recompile for every material
  // in the scene and tanks frame rate (same lesson as the coin lights elsewhere
  // in this project: change intensity, never the light count, or avoid lights).
  function buildCrystal(){
    const grp = new THREE.Group();
    const gem = new THREE.Mesh(new THREE.OctahedronGeometry(1.3,0), MAT.crystal);
    gem.scale.set(1,1.7,1);
    grp.add(gem);
    const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.55,0), new THREE.MeshBasicMaterial({ color:0xe6ccff, toneMapped:false }));
    core.scale.set(1,1.7,1);
    grp.add(core);
    const halo = new THREE.Mesh(new THREE.SphereGeometry(2.2,8,6), new THREE.MeshBasicMaterial({
      color:0xb266ff, transparent:true, opacity:0.28, blending:THREE.AdditiveBlending, toneMapped:false,
    }));
    grp.add(halo);
    return grp;
  }
  for(let i=0;i<CRYSTAL_COUNT;i++){
    let cx=0, cz=0, ok=false, tries=0;
    do {
      const a = rand(0,Math.PI*2), d = rand(50,480);
      cx = Math.cos(a)*d; cz = Math.sin(a)*d;
      ok = Math.hypot(cx,cz) > 45 && Math.hypot(cx-(-95),cz-(-55)) > 70;
      tries++;
    } while(!ok && tries<30);
    const grp = buildCrystal();
    const gy = getMoonSurfaceY(cx,cz);
    grp.position.set(cx, gy+1.4, cz);
    moonScene.add(grp);
    crystals.push({ x:cx, z:cz, group:grp, collected:false });
  }

  const earth = new THREE.Mesh(new THREE.SphereGeometry(60,12,10), MAT.earth);
  // Low Y so the flat moon ground plane occludes the lower hemisphere in the
  // depth buffer -- reads as Earth "rising", cut off by the horizon.
  earth.position.set(-420, 16, -900);
  moonScene.add(earth);
  const earthClouds = new THREE.Mesh(new THREE.SphereGeometry(63,12,10), MAT.earthCloud);
  earthClouds.position.copy(earth.position);
  moonScene.add(earthClouds);

  const moonSun = new THREE.DirectionalLight(0xffffff,1.3);
  moonSun.position.set(-150,200,120);
  moonScene.add(moonSun);
  const moonAmb = new THREE.HemisphereLight(0x2a2a3a,0x111111,0.35);
  moonScene.add(moonAmb);
}

function astroIco(r, mat){

/* ---------- particle puffs (smoke / fire / dust) ---------- */
const puffGeo = new THREE.SphereGeometry(1,8,6);
const activePuffs = [];
function spawnPuff(pos, opts, targetGroup){
  const target = targetGroup || launchScene;
  const mat = new THREE.MeshStandardMaterial({
    color: opts.color, flatShading:false, roughness:1, transparent:true,
    opacity: opts.opacity ?? 0.85,
    emissive: opts.emissive ?? 0x000000,
    emissiveIntensity: opts.emissiveIntensity ?? 0,
  });
  const mesh = new THREE.Mesh(puffGeo, mat);
  mesh.position.copy(pos);
  const scale0 = opts.scale0 ?? 1.2;
  mesh.scale.setScalar(scale0);
  mesh.userData = {
    vel: opts.vel.clone(),
    growth: opts.growth ?? 6,
    life: 0, maxLife: opts.maxLife ?? 3.2,
    fadeFrom: opts.fadeFrom ?? 0.6,
    drag: opts.drag ?? 0.94,
    maxScale: opts.maxScale ?? 40,
  };
  target.add(mesh);
  activePuffs.push(mesh);
}
function updatePuffs(dt){
  for(let i=activePuffs.length-1;i>=0;i--){
    const p = activePuffs[i], d = p.userData;
    d.life += dt;
    p.position.addScaledVector(d.vel, dt);
    d.vel.multiplyScalar(d.drag);
    const grown = p.scale.x + d.growth*dt;
    p.scale.setScalar(Math.min(grown, d.maxScale));
    const lt = d.life/d.maxLife;
    p.material.opacity = lt < d.fadeFrom ? p.material.opacity : Math.max(0, p.material.opacity - dt*1.4);
    if (d.life > d.maxLife || p.material.opacity<=0.01){
      if (p.parent) p.parent.remove(p);
      p.material.dispose();
      activePuffs.splice(i,1);
    }
  }
}

let groundDustAccum = 0;
function spawnGroundDust(dt, x, z, groundY, strength, big){
  if (strength <= 0.02){ groundDustAccum = 0; return; }

/* ---------- audio: procedural sound effects (Web Audio API, no external assets) ---------- */
let audioCtx = null;
function ensureAudio(){
  if (!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    audioCtx = new Ctx();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq, dur, type, gainPeak, when){
  const ctx = ensureAudio();
  if (!ctx) return;
  const t0 = ctx.currentTime + (when||0);
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.linearRampToValueAtTime(gainPeak, t0+0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function playNoiseBurst(dur, gainPeak, filterFreq){
  const ctx = ensureAudio();
  if (!ctx) return;
  const n = Math.max(1, Math.floor(ctx.sampleRate*dur));
  const buffer = ctx.createBuffer(1, n, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i=0;i<n;i++) data[i] = (Math.random()*2-1) * (1 - i/n);
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.value = filterFreq || 1200;
  const gain = ctx.createGain();
  gain.gain.value = gainPeak;
  src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  src.start();
}
function playStep(){ playNoiseBurst(0.07, 0.14, 850); }
function playJump(){ playTone(340, 0.16, 'triangle', 0.20); playTone(560, 0.10, 'triangle', 0.10, 0.02); }
function playLand(){ playNoiseBurst(0.11, 0.20, 480); }
function playCollectChime(){
  playTone(660, 0.14, 'sine', 0.22);
  playTone(990, 0.16, 'sine', 0.16, 0.05);
  playTone(1320, 0.18, 'sine', 0.12, 0.10);
}
function playJetBoost(){
  playNoiseBurst(0.5, 0.22, 2200);
  const ctx = ensureAudio();
  if (!ctx) return;
  const t0 = ctx.currentTime;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(160, t0);
  osc.frequency.exponentialRampToValueAtTime(420, t0+0.45);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.linearRampToValueAtTime(0.22, t0+0.05);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.5);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+0.52);
}

let engineOsc = null, engineGain = null, engineFilter = null;
function startEngineSound(){
  const ctx = ensureAudio();
  if (!ctx || engineOsc) return;
  engineOsc = ctx.createOscillator();
  engineOsc.type = 'sawtooth';
  engineOsc.frequency.value = 55;
  engineFilter = ctx.createBiquadFilter();
  engineFilter.type = 'lowpass'; engineFilter.frequency.value = 350;
  engineGain = ctx.createGain();
  engineGain.gain.value = 0.001;
  engineOsc.connect(engineFilter); engineFilter.connect(engineGain); engineGain.connect(ctx.destination);
  engineOsc.start();
}
function stopEngineSound(){
  if (!engineOsc) return;
  const ctx = ensureAudio();
  engineGain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.15);
  engineOsc.stop(ctx.currentTime+0.2);
  engineOsc = null; engineGain = null; engineFilter = null;
}
function updateEngineSound(speedRatio){
  if (!engineOsc) return;
  const r = Math.abs(speedRatio);
  engineOsc.frequency.value = 55 + r*90;
  engineGain.gain.value = 0.05 + r*0.09;
  engineFilter.frequency.value = 300 + r*500;
}

function currentAltitude(tt){
  if (tt < T_LIFTOFF) return 0;
  const p = clamp((tt - T_LIFTOFF)/(T_ASCENT_END - T_LIFTOFF), 0, 1);
  return ASCENT_DIST * Math.pow(p, ASCENT_EXP);
}
function altitudeVelocity(tt){
  const h = 0.05;
  return (currentAltitude(tt+h) - currentAltitude(tt-h)) / (2*h);
}

        color:0xffb347, emissive:0xff5a10, emissiveIntensity:1.7,

    } else {

        vel:new THREE.Vector3((originX-centerX)*0.45+rand(-10,10), rand(5,11), originZ*0.45+rand(-10,10)),

// Virtual 360° joystick: analog direction, blended with keyboard each frame via curInput.
const touchMove = { forward:0, back:0, left:0, right:0 };
const curInput  = { fwd:0, back:0, left:0, right:0 };
function refreshInput(){
  curInput.fwd   = Math.max(keys.up?1:0,    touchMove.forward);
  curInput.back  = Math.max(keys.down?1:0,  touchMove.back);
  curInput.left  = Math.max(keys.left?1:0,  touchMove.left);
  curInput.right = Math.max(keys.right?1:0, touchMove.right);
}
const joyEl = document.getElementById('joystick');
const knobEl = document.getElementById('joystick-knob');
const JOY_RADIUS = 50;
let joyPointerId = null;
function setJoyFromPoint(clientX, clientY){
  const rect = joyEl.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  let dx = clientX-cx, dy = clientY-cy;
  const dist = Math.hypot(dx,dy);
  if (dist > JOY_RADIUS){ dx = dx/dist*JOY_RADIUS; dy = dy/dist*JOY_RADIUS; }
  knobEl.style.transform = `translate(${dx}px, ${dy}px)`;
  touchMove.left    = Math.max(0, -dx/JOY_RADIUS);
  touchMove.right   = Math.max(0,  dx/JOY_RADIUS);
  touchMove.forward = Math.max(0, -dy/JOY_RADIUS);
  touchMove.back    = Math.max(0,  dy/JOY_RADIUS);
}
function resetJoy(){
  knobEl.style.transform = '';
  touchMove.forward = touchMove.back = touchMove.left = touchMove.right = 0;
  joyPointerId = null;
}
joyEl.addEventListener('pointerdown', e => {
  ensureAudio();
  joyPointerId = e.pointerId;
  joyEl.setPointerCapture(e.pointerId);
  setJoyFromPoint(e.clientX, e.clientY);
  e.preventDefault();
});
joyEl.addEventListener('pointermove', e => {
  if (joyPointerId !== e.pointerId) return;
  setJoyFromPoint(e.clientX, e.clientY);
  e.preventDefault();
});
['pointerup','pointercancel','pointerleave'].forEach(evt => {
  joyEl.addEventListener(evt, e => { if (joyPointerId === e.pointerId) resetJoy(); });
});

/* ---------- minimap (ported concept from dhl-city/index.html drawMM) ---------- */
const mmCanvas = document.getElementById('minimap');
const mmCtx = mmCanvas.getContext('2d');
const STATION_MARK = { x:-95, z:-55 };
function drawMinimap(px, pz, pAngle){
  const w = mmCanvas.width, h = mmCanvas.height, cx = w/2, cy = h/2, sc = w/700;
  mmCtx.clearRect(0,0,w,h);
  mmCtx.save();
  mmCtx.beginPath(); mmCtx.arc(cx,cy,cx-1,0,Math.PI*2); mmCtx.clip();
  mmCtx.fillStyle = 'rgba(10,12,20,0.55)'; mmCtx.fillRect(0,0,w,h);
  mmCtx.translate(cx,cy);
  mmCtx.rotate(pAngle);
  const mx = x => -(x-px)*sc, mz = z => -(z-pz)*sc;
  mmCtx.fillStyle = '#8fd0ff';
  mmCtx.beginPath(); mmCtx.arc(mx(PAD_X), mz(0), 5, 0, Math.PI*2); mmCtx.fill();
  mmCtx.fillStyle = '#c9a6ff';
  mmCtx.beginPath(); mmCtx.arc(mx(STATION_MARK.x), mz(STATION_MARK.z), 4, 0, Math.PI*2); mmCtx.fill();
  if (!inVehicle){
    mmCtx.fillStyle = '#ffcc55';
    mmCtx.beginPath(); mmCtx.arc(mx(roverX), mz(roverZ), 4, 0, Math.PI*2); mmCtx.fill();
  }
  mmCtx.fillStyle = '#c07bff';
  for (const c of crystals){
    if (c.collected) continue;
    mmCtx.beginPath(); mmCtx.arc(mx(c.x), mz(c.z), 3, 0, Math.PI*2); mmCtx.fill();
  }
  mmCtx.restore();
  mmCtx.save();
  mmCtx.translate(cx,cy);
  mmCtx.fillStyle = inVehicle ? '#ffcc55' : '#ffffff';
  mmCtx.beginPath(); mmCtx.moveTo(0,-7); mmCtx.lineTo(-5,6); mmCtx.lineTo(0,3); mmCtx.lineTo(5,6); mmCtx.closePath(); mmCtx.fill();
  mmCtx.restore();
}

/* ---------- astronaut animation (ported from dhl-city/character.html) ---------- */
let animT = 0, charYaw = 0;
let headYawTgt = 0;
const JWALK = { NONE:0, WINDUP:1, AIR:2, LAND:3 };
const WINDUP_DUR = 0.22, LAND_DUR = 0.30;
let jumpState = JWALK.NONE, jumpTimer = 0;
let stepSign = 0;

function animateAstronaut(dt){
  const A = astro;
  const moving = (curInput.fwd > 0.02 || curInput.back > 0.02) && jumpState === JWALK.NONE;
  if (moving) animT += dt * 9.5;
  const s = Math.sin(animT);
  const eff = moving ? 1.0 : 0.0;
  const lLeg =  s * 0.68, rLeg = -s * 0.68;

  if (moving && onGround){
    const sign = s > 0.02 ? 1 : (s < -0.02 ? -1 : 0);
    if (sign !== 0 && stepSign !== 0 && sign !== stepSign) playStep();
    if (sign !== 0) stepSign = sign;
  } else {
    stepSign = 0;
  }

  headYawTgt = (curInput.left - curInput.right) * 0.38;
  A.headJoint.rotation.y = lerp(A.headJoint.rotation.y, headYawTgt, 0.06);

  if (jumpState === JWALK.WINDUP){
    const tt = Math.min(jumpTimer / WINDUP_DUR, 1.0);
    const sq = Math.sin(tt * Math.PI * 0.5);
    A.lHip.rotation.x = lerp(A.lHip.rotation.x, 0.52*sq, 0.32);
    A.rHip.rotation.x = lerp(A.rHip.rotation.x, 0.52*sq, 0.32);
    A.lKnee.rotation.x = lerp(A.lKnee.rotation.x, 0.78*sq, 0.32);
    A.rKnee.rotation.x = lerp(A.rKnee.rotation.x, 0.78*sq, 0.32);
    A.lAnkle.rotation.x = lerp(A.lAnkle.rotation.x, 0.20*sq, 0.32);
    A.rAnkle.rotation.x = lerp(A.rAnkle.rotation.x, 0.20*sq, 0.32);
    A.lShoulder.rotation.x = lerp(A.lShoulder.rotation.x, 0.32*sq, 0.25);
    A.rShoulder.rotation.x = lerp(A.rShoulder.rotation.x, 0.32*sq, 0.25);
    A.lElbow.rotation.x = lerp(A.lElbow.rotation.x, -0.55, 0.22);
    A.rElbow.rotation.x = lerp(A.rElbow.rotation.x, -0.55, 0.22);
    A.lShoulder.rotation.z = lerp(A.lShoulder.rotation.z, -0.10, 0.08);
    A.rShoulder.rotation.z = lerp(A.rShoulder.rotation.z,  0.10, 0.08);
    A.torso.position.y = lerp(A.torso.position.y, 1.26 - 0.14*sq, 0.32);
    A.torso.rotation.x = lerp(A.torso.rotation.x, -0.20*sq, 0.25);
    A.torso.rotation.y = 0;
    A.headJoint.rotation.x = lerp(A.headJoint.rotation.x, 0.10*sq, 0.20);
  } else if (jumpState === JWALK.AIR){
    A.lHip.rotation.x = lerp(A.lHip.rotation.x, -0.70, 0.17);
    A.rHip.rotation.x = lerp(A.rHip.rotation.x, -0.70, 0.17);
    A.lKnee.rotation.x = lerp(A.lKnee.rotation.x, 1.45, 0.17);
    A.rKnee.rotation.x = lerp(A.rKnee.rotation.x, 1.45, 0.17);
    A.lAnkle.rotation.x = lerp(A.lAnkle.rotation.x, -0.45, 0.17);
    A.rAnkle.rotation.x = lerp(A.rAnkle.rotation.x, -0.45, 0.17);
    A.lShoulder.rotation.x = lerp(A.lShoulder.rotation.x, -0.52, 0.14);
    A.rShoulder.rotation.x = lerp(A.rShoulder.rotation.x, -0.52, 0.14);
    A.lShoulder.rotation.z = lerp(A.lShoulder.rotation.z, -0.48, 0.10);
    A.rShoulder.rotation.z = lerp(A.rShoulder.rotation.z,  0.48, 0.10);
    A.lElbow.rotation.x = lerp(A.lElbow.rotation.x, -0.95, 0.15);
    A.rElbow.rotation.x = lerp(A.rElbow.rotation.x, -0.95, 0.15);
    A.torso.position.y = lerp(A.torso.position.y, 1.26, 0.15);
    A.torso.rotation.x = lerp(A.torso.rotation.x, 0.0, 0.10);
    A.torso.rotation.y = 0;
    A.headJoint.rotation.x = lerp(A.headJoint.rotation.x, 0.32, 0.14);
  } else if (jumpState === JWALK.LAND){
    const tt = Math.min(jumpTimer / LAND_DUR, 1.0);
    const sq = 1.0 - tt;
    A.lHip.rotation.x = lerp(A.lHip.rotation.x, 0.72*sq, 0.32);
    A.rHip.rotation.x = lerp(A.rHip.rotation.x, 0.72*sq, 0.32);
    A.lKnee.rotation.x = lerp(A.lKnee.rotation.x, 1.10*sq, 0.32);
    A.rKnee.rotation.x = lerp(A.rKnee.rotation.x, 1.10*sq, 0.32);
    A.lAnkle.rotation.x = lerp(A.lAnkle.rotation.x, 0.22*sq, 0.32);
    A.rAnkle.rotation.x = lerp(A.rAnkle.rotation.x, 0.22*sq, 0.32);
    A.lShoulder.rotation.x = lerp(A.lShoulder.rotation.x, 0.22*sq, 0.25);
    A.rShoulder.rotation.x = lerp(A.rShoulder.rotation.x, 0.22*sq, 0.25);
    A.lShoulder.rotation.z = lerp(A.lShoulder.rotation.z, -0.09, 0.08);
    A.rShoulder.rotation.z = lerp(A.rShoulder.rotation.z,  0.09, 0.08);
    A.lElbow.rotation.x = lerp(A.lElbow.rotation.x, -0.55*sq - 0.12, 0.25);
    A.rElbow.rotation.x = lerp(A.rElbow.rotation.x, -0.55*sq - 0.12, 0.25);
    A.torso.position.y = lerp(A.torso.position.y, 1.26 - 0.22*sq, 0.32);
    A.torso.rotation.x = lerp(A.torso.rotation.x, 0.0, 0.10);
    A.torso.rotation.y = 0;
    A.headJoint.rotation.x = lerp(A.headJoint.rotation.x, 0.0, 0.15);
  } else {
    if (heldRock){
      // Both hands are occupied cradling the carried stone -- hold a fixed
      // pose instead of the normal walk-swing, arms don't move while walking.
      A.rShoulder.rotation.x = lerp(A.rShoulder.rotation.x, -0.95, 0.20);
      A.rShoulder.rotation.z = lerp(A.rShoulder.rotation.z, 0.16, 0.15);
      A.rElbow.rotation.x = lerp(A.rElbow.rotation.x, -1.75, 0.20);
      A.lShoulder.rotation.x = lerp(A.lShoulder.rotation.x, -0.95, 0.20);
      A.lShoulder.rotation.z = lerp(A.lShoulder.rotation.z, -0.16, 0.15);
      A.lElbow.rotation.x = lerp(A.lElbow.rotation.x, -1.75, 0.20);
    } else {
      A.rShoulder.rotation.x = lerp(A.rShoulder.rotation.x, -rLeg*0.68*eff, 0.30);
      A.rShoulder.rotation.z = lerp(A.rShoulder.rotation.z,  0.09, 0.08);
      A.rElbow.rotation.x = lerp(A.rElbow.rotation.x, moving ? -1.22 : -0.12, 0.20);
      A.lShoulder.rotation.x = lerp(A.lShoulder.rotation.x, -lLeg*0.68*eff, 0.30);
      A.lShoulder.rotation.z = lerp(A.lShoulder.rotation.z, -0.09, 0.08);
      A.lElbow.rotation.x = lerp(A.lElbow.rotation.x, moving ? -1.22 : -0.12, 0.20);
    }
    const tc = 0.30;
    A.lHip.rotation.x = lerp(A.lHip.rotation.x, lLeg*0.88*eff, tc);
    A.rHip.rotation.x = lerp(A.rHip.rotation.x, rLeg*0.88*eff, tc);
    const lKT = (Math.max(0, lLeg)*1.00 + Math.max(0,-lLeg)*0.70) * eff;
    const rKT = (Math.max(0, rLeg)*1.00 + Math.max(0,-rLeg)*0.70) * eff;
    A.lKnee.rotation.x = lerp(A.lKnee.rotation.x, lKT, tc);
    A.rKnee.rotation.x = lerp(A.rKnee.rotation.x, rKT, tc);
    A.lAnkle.rotation.x = lerp(A.lAnkle.rotation.x, -lLeg*0.38*eff, tc);
    A.rAnkle.rotation.x = lerp(A.rAnkle.rotation.x, -rLeg*0.38*eff, tc);
    A.torso.rotation.y = lerp(A.torso.rotation.y, s*0.13*eff, 0.18);
    A.torso.rotation.x = lerp(A.torso.rotation.x, moving ? -0.10 : 0.0, 0.07);
    A.torso.rotation.z = lerp(A.torso.rotation.z, Math.cos(animT)*0.042*eff, 0.20);
    A.torso.position.y = lerp(A.torso.position.y, 1.26 + (moving ? Math.abs(s)*0.14 : 0), 0.28);
    A.headJoint.rotation.x = lerp(A.headJoint.rotation.x, moving ? Math.abs(s)*(-0.07) : 0, 0.18);
    A.headJoint.rotation.z = lerp(A.headJoint.rotation.z, 0, 0.10);
  }
}

/* ---------- action button: pick up / carry / drop a rock ---------- */
const PICKUP_RADIUS = 3.5;
let heldRock = null;

function dropHeldRock(){
  if (!heldRock) return;
  const fwdX = Math.sin(charYaw), fwdZ = Math.cos(charYaw);
  const dropDist = 1.6;
  const dx = astro.charRoot.position.x + fwdX*dropDist;
  const dz = astro.charRoot.position.z + fwdZ*dropDist;
  const gy = getMoonSurfaceY(dx,dz);
  heldRock.x = dx; heldRock.z = dz;
  heldRock.mesh.position.set(dx, gy+heldRock.embed, dz);
  heldRock.mesh.rotation.set(rand(0,6),rand(0,6),rand(0,6));
  heldRock.held = false;
  heldRock = null;
  actionEl.classList.remove('holding');
}
function nearestLiftableStone(px, pz){
  let best = null, bestD = Infinity;
  for (const rk of pickupStones){
    if (rk.held) continue;
    const dd = Math.hypot(px-rk.x, pz-rk.z);
    if (dd < PICKUP_RADIUS && dd < bestD){ bestD = dd; best = rk; }
  }
  return best;
}
function pickUpNearestRock(){
  if (heldRock) return;
  const best = nearestLiftableStone(astro.charRoot.position.x, astro.charRoot.position.z);
  if (best){ best.held = true; heldRock = best; actionEl.classList.add('holding'); }
}

function poseAstronautSeated(k){

  A.lShoulder.rotation.x = lerp(A.lShoulder.rotation.x, -0.35, k);
  A.lShoulder.rotation.z = lerp(A.lShoulder.rotation.z, 0.06, k);
  A.rShoulder.rotation.x = lerp(A.rShoulder.rotation.x, -0.35, k);
  A.rShoulder.rotation.z = lerp(A.rShoulder.rotation.z, -0.06, k);
  A.lElbow.rotation.x = lerp(A.lElbow.rotation.x, -1.05, k);
  A.rElbow.rotation.x = lerp(A.rElbow.rotation.x, -1.05, k);
  A.torso.rotation.x = lerp(A.torso.rotation.x, 0.05, k);
  A.torso.rotation.y = lerp(A.torso.rotation.y, 0, k);
  A.torso.rotation.z = lerp(A.torso.rotation.z, 0, k);

function exitVehicle(){
  inVehicle = false;
  const A = astro;
  const sideX = Math.cos(roverAngle), sideZ = -Math.sin(roverAngle);
  const exitDist = 3.2;
  const ex = roverX + sideX*exitDist, ez = roverZ + sideZ*exitDist;
  A.charRoot.position.set(ex, getMoonSurfaceY(ex,ez) + CHAR_BASE_Y, ez);
  charYaw = roverAngle;
  A.charRoot.rotation.y = charYaw;
  moveSpeed = 0; velY = 0; onGround = true; jumpState = JWALK.NONE;
  gameCamPos.copy(camera.position);
  actionEl.style.display = 'flex';
  stopEngineSound();
}

function updateRoverGameplay(dt){
  refreshInput();

  const gasIn = curInput.fwd, brakeIn = curInput.back;
  if (gasIn > brakeIn)        roverSpd = Math.min(roverSpd + ROVER_ACCEL*dt, ROVER_MAX_SPD*gasIn);
  else if (brakeIn > gasIn)   roverSpd = roverSpd > 0.05 ? Math.max(roverSpd - ROVER_BRAKE*dt, 0) : Math.max(roverSpd - ROVER_ACCEL*0.9*dt, -ROVER_MAX_SPD*ROVER_REVERSE_FRAC*brakeIn);
  else { const f = ROVER_FRICTION*dt; roverSpd = Math.abs(roverSpd) < f ? 0 : roverSpd - Math.sign(roverSpd)*f; }

  let steerTgt = 0;
  if (Math.abs(roverSpd) > 0.05){
    const turn = curInput.left - curInput.right;
    const sdir = roverSpd >= 0 ? 1 : -1;
    const sr = ROVER_STEER_RATE * (Math.abs(roverSpd)/ROVER_MAX_SPD);
    roverAngle += sr*dt*turn*sdir;
    steerTgt = turn*0.5*sdir;
  }
  roverSteerAng = lerp(roverSteerAng, steerTgt, 0.15);
  if (rover.userData.frontWheels) rover.userData.frontWheels.forEach(w => w.rotation.y = roverSteerAng);

  const fwdX = Math.sin(roverAngle), fwdZ = Math.cos(roverAngle);
  const nx = roverX + fwdX*roverSpd*dt, nz = roverZ + fwdZ*roverSpd*dt;
  const resolved = resolvePush(nx, nz, ROVER_COLLIDE_R, moonCollidables);
  if (Math.hypot(resolved.x-nx, resolved.z-nz) > 0.01) roverSpd *= 0.4;
  roverX = resolved.x; roverZ = resolved.z;
  const groundY = getMoonSurfaceY(roverX, roverZ);
  rover.position.set(roverX, groundY, roverZ);

  // Tilt with the slope: sample ground height at the front/back/left/right
  // of the footprint and lean the chassis to match, instead of always
  // sitting perfectly level regardless of terrain.
  const rightX = Math.cos(roverAngle), rightZ = -Math.sin(roverAngle);
  const yAhead  = getMoonSurfaceY(roverX+fwdX*ROVER_HALF_LEN,   roverZ+fwdZ*ROVER_HALF_LEN);
  const yBehind = getMoonSurfaceY(roverX-fwdX*ROVER_HALF_LEN,   roverZ-fwdZ*ROVER_HALF_LEN);
  const yRight  = getMoonSurfaceY(roverX+rightX*ROVER_HALF_WID, roverZ+rightZ*ROVER_HALF_WID);
  const yLeft   = getMoonSurfaceY(roverX-rightX*ROVER_HALF_WID, roverZ-rightZ*ROVER_HALF_WID);
  const pitchTarget = Math.atan2(yBehind-yAhead, ROVER_HALF_LEN*2);
  const rollTarget  = Math.atan2(yRight-yLeft, ROVER_HALF_WID*2);
  roverPitch = lerp(roverPitch, pitchTarget, 0.15);
  roverRoll  = lerp(roverRoll, rollTarget, 0.15);
  rover.rotation.set(roverPitch, roverAngle, roverRoll);
  rover.updateMatrixWorld(true);

  spawnGroundDust(dt, roverX - fwdX*2, roverZ - fwdZ*2, groundY, Math.min(1, Math.abs(roverSpd)/ROVER_MAX_SPD), true);
  updateEngineSound(roverSpd/ROVER_MAX_SPD);

  tmpSeat.copy(SEAT_LOCAL);
  rover.localToWorld(tmpSeat);
  const seatY = tmpSeat.y - SEAT_SIT_DROP;
  enterT = Math.min(enterT + dt/ENTER_ANIM_DUR, 1);
  const easeT = smoothstep(0, 1, enterT);
  astro.charRoot.position.set(
    lerp(enterFromPos.x, tmpSeat.x, easeT),
    lerp(enterFromPos.y, seatY, easeT),
    lerp(enterFromPos.z, tmpSeat.z, easeT)
  );
  let yawDiff = roverAngle - enterFromYaw;
  while (yawDiff > Math.PI) yawDiff -= Math.PI*2;
  while (yawDiff < -Math.PI) yawDiff += Math.PI*2;
  astro.charRoot.rotation.y = enterFromYaw + yawDiff*easeT;
  poseAstronautSeated(easeT);

  if (jumpBuf){ jumpBuf = false; exitVehicle(); return; }

  const baseVDist = 11.5 * (isMobile ? MOBILE_CAM_MULT : 1);
  vehicleCamDist = lerp(vehicleCamDist, baseVDist, dt*2.5);
  const tCam = new THREE.Vector3(roverX - fwdX*vehicleCamDist, groundY + 5.5, roverZ - fwdZ*vehicleCamDist);
  vehicleCamPos.lerp(tCam, 0.08);
  camera.position.copy(vehicleCamPos);
  camera.lookAt(roverX, groundY + 2.0, roverZ);
}

function updateAstronautGameplay(dt){
  const A = astro;
  refreshInput();

  charYaw += TURN_RATE * dt * (curInput.left - curInput.right);
  A.charRoot.rotation.y = charYaw;

  const fwdX = Math.sin(charYaw), fwdZ = Math.cos(charYaw);
  const mag = Math.max(curInput.fwd, curInput.back);
  if (mag > 0.02) moveSpeed = Math.min(moveSpeed + ACCEL_RATE*dt, SPEED_MAX*mag);
  else            moveSpeed = Math.max(moveSpeed - DECEL_RATE*dt, 0);
  let nx = A.charRoot.position.x, nz = A.charRoot.position.z;
  if (curInput.fwd  > curInput.back) { nx += fwdX*moveSpeed*dt; nz += fwdZ*moveSpeed*dt; }
  if (curInput.back > curInput.fwd)  { nx -= fwdX*moveSpeed*dt; nz -= fwdZ*moveSpeed*dt; }
  let resolvedPos = resolvePush(nx, nz, CHAR_RADIUS, moonCollidables);
  resolvedPos = resolvePush(resolvedPos.x, resolvedPos.z, CHAR_RADIUS, [{ x:roverX, z:roverZ, r:ROVER_COLLIDE_R }]);
  A.charRoot.position.x = resolvedPos.x;
  A.charRoot.position.z = resolvedPos.z;

  const distToRover = Math.hypot(A.charRoot.position.x - roverX, A.charRoot.position.z - roverZ);
  const nearRover = distToRover < VEHICLE_ENTER_RADIUS;
  enterHintEl.style.display = (nearRover && onGround) ? 'block' : 'none';
  if (jumpBuf && nearRover && onGround){
    jumpBuf = false;
    enterVehicle();
    return;
  }

  if (actionBuf){
    actionBuf = false;
    if (heldRock) dropHeldRock(); else pickUpNearestRock();
  }
  if (heldRock){
    heldRock.mesh.position.set(
      A.charRoot.position.x + fwdX*1.1,
      A.charRoot.position.y + 1.15,
      A.charRoot.position.z + fwdZ*1.1
    );
    pickupHintEl.style.display = 'none';
  } else {
    const nearStone = nearestLiftableStone(A.charRoot.position.x, A.charRoot.position.z);
    pickupHintEl.style.display = (nearStone && onGround) ? 'block' : 'none';
  }

  // Rocket boost: pressing jump again while already airborne (once per jump)
  // fires the backpack thruster for a much higher, farther second kick.
  if (jumpBuf && jumpState === JWALK.AIR && canBoost){
    jumpBuf = false;
    canBoost = false;
    jetBoosting = true;
    jetPulseT = 0;
    velY = JUMP_BOOST_VEL;
    moveSpeed = Math.min(moveSpeed * JUMP_BOOST_SPEED_MULT, SPEED_MAX * JUMP_BOOST_SPEED_MULT);
    A.jetFlame.grp.visible = true;
    playJetBoost();
    spawnPuff(new THREE.Vector3(A.charRoot.position.x, A.charRoot.position.y+0.9, A.charRoot.position.z), {
      color: 0xffa93c, opacity: 0.85, emissive: 0xff7a1a, emissiveIntensity: 1.4,
      vel: new THREE.Vector3(rand(-1,1), -3, rand(-1,1)), growth: 5, maxLife: 0.4, scale0: 0.4,
      fadeFrom: 0.15, drag: 0.9, maxScale: 2.2,
    }, moonScene);
  }

  if (jumpBuf && onGround && jumpState !== JWALK.WINDUP && jumpState !== JWALK.AIR){
    jumpState = JWALK.WINDUP; jumpTimer = 0; jumpBuf = false;
  }
  if (jumpState === JWALK.WINDUP){
    jumpTimer += dt;
    if (jumpTimer >= WINDUP_DUR){ velY = JUMP_VEL; onGround = false; jumpState = JWALK.AIR; jumpTimer = 0; playJump(); canBoost = true; }
  }
  if (jumpState === JWALK.LAND){
    jumpTimer += dt;
    if (jumpTimer >= LAND_DUR) jumpState = JWALK.NONE;
  }

  if (jetBoosting){
    jetPulseT += dt;
    pulseEngine(A.jetFlame.grp, jetPulseT, 55);
  }

  velY += GRAVITY * dt;
  A.charRoot.position.y += velY * dt;
  const surfY = getMoonSurfaceY(A.charRoot.position.x, A.charRoot.position.z) + CHAR_BASE_Y;
  if (A.charRoot.position.y <= surfY){
    if (velY < -1.5 && jumpState === JWALK.AIR){ jumpState = JWALK.LAND; jumpTimer = 0; playLand(); }
    else if (jumpState === JWALK.AIR){ jumpState = JWALK.NONE; }
    A.charRoot.position.y = surfY;
    velY = 0; onGround = true;
    canBoost = false; jetBoosting = false; A.jetFlame.grp.visible = false;
  } else {
    onGround = false;
    if (jumpState === JWALK.NONE) jumpState = JWALK.AIR;
  }

  animateAstronaut(dt);

  const moving = curInput.fwd > 0.02 || curInput.back > 0.02;
  if (onGround && moving) spawnGroundDust(dt, A.charRoot.position.x, A.charRoot.position.z, surfY, 1, false);
  const baseDist = (moving ? 7.0 : 4.0) * (isMobile ? MOBILE_CAM_MULT : 1);
  gameCamDist = lerp(gameCamDist, baseDist, dt*2.5);
  const tCam = new THREE.Vector3(
    A.charRoot.position.x - fwdX*gameCamDist,
    A.charRoot.position.y + 2.6,
    A.charRoot.position.z - fwdZ*gameCamDist
  );
  gameCamPos.lerp(tCam, 0.08);
  camera.position.copy(gameCamPos);
  camera.lookAt(A.charRoot.position.x, A.charRoot.position.y + 1.1, A.charRoot.position.z);
}

function enterGameMode(){
  gameMode = true;
  document.getElementById('joystick').style.display = 'block';
  document.getElementById('jumpBtn').style.display = 'flex';
  document.getElementById('actionBtn').style.display = 'flex';
  document.getElementById('minimap').style.display = 'block';
  document.getElementById('crystalHud').style.display = 'flex';
  document.getElementById('skipBtn').style.display = 'none';
  gameCamPos.copy(camera.position);
}

/* ---------- post-landing cutscene: ramp out, hatch opens, astronaut exits ---------- */
let walkPath = null;
let astroRevealed = false;

function computeWalkPath(){
  const su = shipPart.userData;
  const rampRise = su.hatchY + PLATFORM_H;
  const p0 = shipPart.localToWorld(new THREE.Vector3(su.hatchR-0.5, su.hatchY-3.0+CHAR_BASE_Y, 0));
  const p1 = shipPart.localToWorld(new THREE.Vector3(su.hatchR+su.rampRun, su.hatchY-rampRise+CHAR_BASE_Y, 0));
  const p2 = p1.clone().add(new THREE.Vector3(9,0,5));
  return [p0,p1,p2];
}
function scriptedWalk(wp){
  const [a,b,c] = walkPath;
  let from,to,localT;
  if (wp < 0.65){ from=a; to=b; localT=wp/0.65; }
  else { from=b; to=c; localT=(wp-0.65)/0.35; }
  const e = smoothstep(0,1,localT);
  astro.charRoot.position.lerpVectors(from, to, e);
  const dir = new THREE.Vector3().subVectors(to, from);
  if (dir.lengthSq() > 0.0001){
    charYaw = Math.atan2(dir.x, dir.z);
    astro.charRoot.rotation.y = charYaw;
  }
}
function hatchShotPos(hatchWorld){
  return new THREE.Vector3(hatchWorld.x+26, hatchWorld.y+9, hatchWorld.z+22);
}
function cameraCloseupOnHatch(){
  const su = shipPart.userData;
  const hatchWorld = shipPart.localToWorld(new THREE.Vector3(su.hatchR, su.hatchY, 0));
  const pos = hatchShotPos(hatchWorld);
  camera.position.copy(pos);
  camera.lookAt(hatchWorld.x, hatchWorld.y-0.5, hatchWorld.z);
}
function cameraSwingToGameplay(tt){
  const p = smoothstep(T_WALK_START, T_HANDOFF, tt);
  const su = shipPart.userData;
  const hatchWorld = shipPart.localToWorld(new THREE.Vector3(su.hatchR, su.hatchY, 0));
  const fromPos = hatchShotPos(hatchWorld);
  const A = astro;
  const behindPos = new THREE.Vector3(
    A.charRoot.position.x - Math.sin(charYaw)*7,
    A.charRoot.position.y + 2.6,
    A.charRoot.position.z - Math.cos(charYaw)*7
  );
  const pos = fromPos.clone().lerp(behindPos, p);
  camera.position.copy(pos);
  const lookTo = new THREE.Vector3(A.charRoot.position.x, A.charRoot.position.y+1.1, A.charRoot.position.z);
  const look = hatchWorld.clone().lerp(lookTo, p);
  camera.lookAt(look);
  if (p >= 1) gameCamPos.copy(pos);
}

const rampHatchWorld = new THREE.Vector3();
const rampStartWorld = new THREE.Vector3();
function updateCutscene(dt){
  const su = shipPart.userData;
  shipPart.position.y = PLATFORM_H;
  su.engineGlow.visible = false;

  // Ramp rig drives in from outside and docks at the hatch (not a panel
  // hinged to the hull unfolding away from the ship).
  const rampP = smoothstep(T_RAMP_START, T_RAMP_END, t);
  if (rampP > 0) rampRig.visible = true;
  rampHatchWorld.set(PAD_X + su.hatchR, PLATFORM_H + su.hatchY, 0);
  rampStartWorld.set(rampHatchWorld.x + 46, rampHatchWorld.y, rampHatchWorld.z);
  rampRig.position.lerpVectors(rampStartWorld, rampHatchWorld, rampP);

  const hatchP = smoothstep(T_HATCH_OPEN_START, T_HATCH_OPEN_END, t);
  su.hatchPivot.rotation.y = lerp(0, -1.9, hatchP);

  if (!astroRevealed && t >= T_HATCH_OPEN_START + 0.5){
    astroRevealed = true;
    walkPath = computeWalkPath();
    astro.charRoot.visible = true;
    astro.charRoot.position.copy(walkPath[0]);
    const dir = new THREE.Vector3().subVectors(walkPath[1], walkPath[0]);
    charYaw = Math.atan2(dir.x, dir.z);
    astro.charRoot.rotation.y = charYaw;
  }

  if (t < T_HATCH_CUT){
    updateCameraMoon(PLATFORM_H);
  } else if (t < T_WALK_START){
    cameraCloseupOnHatch();
  } else if (t < T_HANDOFF){
    // Start tracking as soon as the astronaut starts moving (not only after
    // they finish walking) so they stay in frame all the way down the ramp
    // instead of walking out of a camera that's still fixed on the hatch.
    cameraSwingToGameplay(t);
  }

  if (astroRevealed){
    if (t >= T_WALK_START && t < T_WALK_END){
      scriptedWalk(clamp((t-T_WALK_START)/(T_WALK_END-T_WALK_START),0,1));
      // animateAstronaut reads curInput (not the raw keys map) for its walk
      // cycle since the joystick input port -- drive it directly here so the
      // scripted walk actually plays the leg/arm animation instead of a
      // static slide.
      curInput.fwd = 1; curInput.back = 0; curInput.left = 0; curInput.right = 0;
      animateAstronaut(dt);
    } else {
      curInput.fwd = 0; curInput.back = 0;
      animateAstronaut(dt);
    }
  }

  if (t >= T_HANDOFF && !gameMode) enterGameMode();
}

/* ---------- skip button: jump straight into astronaut control ---------- */
function skipToAstronaut(){
  launchScene.visible = false;
  moonScene.visible = true;
  cdEl.style.display = 'none';
  fadeEl.style.display = 'none';
  glowEl.style.display = 'none';

  if (boosterPart.parent) boosterPart.parent.remove(boosterPart);
  if (shipPart.parent) shipPart.parent.remove(shipPart);
  moonScene.add(shipPart);
  shipPart.position.set(PAD_X, PLATFORM_H, 0);
  shipPart.rotation.set(0,0,0);
  shipPart.userData.engineGlow.visible = false;
  rampRig.position.set(PAD_X + shipPart.userData.hatchR, PLATFORM_H + shipPart.userData.hatchY, 0);
  rampRig.visible = true;
  shipPart.userData.hatchPivot.rotation.y = -1.9;

  walkPath = computeWalkPath();
  astro.charRoot.visible = true;
  astro.charRoot.position.copy(walkPath[2]);
  const dir = new THREE.Vector3().subVectors(walkPath[2], walkPath[1]);
  charYaw = Math.atan2(dir.x, dir.z);
  astro.charRoot.rotation.y = charYaw;

  const fwdX = Math.sin(charYaw), fwdZ = Math.cos(charYaw);
  gameCamPos.set(
    astro.charRoot.position.x - fwdX*7,
    astro.charRoot.position.y + 2.6,
    astro.charRoot.position.z - fwdZ*7
  );
  camera.position.copy(gameCamPos);
  camera.lookAt(astro.charRoot.position.x, astro.charRoot.position.y+1.1, astro.charRoot.position.z);

  stars.material.opacity = 1;
  skyEl.style.background = "linear-gradient(#03040c,#0a0c1c)";

  enterGameMode();
}
document.getElementById('skipBtn').addEventListener('click', () => { ensureAudio(); skipToAstronaut(); });

/* ---------- main loop ---------- */
const fadeEl = document.getElementById("fade");
let lastNow = performance.now();
let missionStart = lastNow;
const tmpV = new THREE.Vector3();

function overlayOpacity(tt){
  if (tt < 1.2) return 1 - smoothstep(0,1.2,tt);
  if (tt >= T_ASCENT_END && tt < T_MOON_IN){
    if (tt < T_BLACK) return smoothstep(T_ASCENT_END,T_BLACK,tt);
    return 1 - smoothstep(T_BLACK,T_MOON_IN,tt);
  }
  return 0;
}

function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastNow)/1000, 0.05);
  lastNow = now;

  if (gameMode){
    updatePuffs(dt);
    if (inVehicle) updateRoverGameplay(dt); else updateAstronautGameplay(dt);
    updateCrystals(dt, now/1000,
      inVehicle ? roverX : astro.charRoot.position.x,
      inVehicle ? roverZ : astro.charRoot.position.z
    );
    drawMinimap(
      inVehicle ? roverX : astro.charRoot.position.x,
      inVehicle ? roverZ : astro.charRoot.position.z,
      inVehicle ? roverAngle : charYaw
    );
    renderer.render(scene, camera);
    return;
  }

  t = (now - missionStart)/1000;

  updateCountdown(t);

  if (!state.moonSwapped){
    updateSky(t);
    const altitude = currentAltitude(t);

    const armProg = smoothstep(T_IGNITE-0.6, T_LIFTOFF-0.2, t);
    tower.userData.armPivot.rotation.z = -1.05*armProg;

    if (!state.separated){
      rocketStack.position.y = PAD_TOP + altitude;

      const bg = boosterPart.userData.engineGlow;
      if (t > T_IGNITE) bg.visible = true;
      if (bg.visible){
        pulseEngine(bg, t, 38);
        bg.getWorldPosition(tmpV);
        spawnEngineTrail(dt, tmpV, 1.15);
      }

      if (altitude < LOW_ALT_THRESHOLD){
        spawnLaunchSmoke(dt, rocketStack.position.x);
      }

      if (altitude > SEPARATION_ALT){
        state.separated = true;
        state.sepTime = t;
        state.sepVelY = altitudeVelocity(t);
        boosterPart.getWorldPosition(tmpV);
        state.sepX0 = tmpV.x; state.sepY0 = tmpV.y; state.sepZ0 = tmpV.z;
        launchScene.add(boosterPart);
        boosterPart.position.copy(tmpV);
        shipPart.getWorldPosition(tmpV);
        launchScene.add(shipPart);
        shipPart.position.copy(tmpV);
        bg.visible = false;
        shipPart.userData.engineGlow.visible = true;
      }
    } else {
      shipPart.position.y = PAD_TOP + altitude + SHIP_LOCAL_Y;

      const sg = shipPart.userData.engineGlow;
      if (t > T_ASCENT_END - 1) sg.visible = altitude < ASCENT_DIST*0.55;
      if (sg.visible){
        pulseEngine(sg, t, 38);
        sg.getWorldPosition(tmpV);
        spawnEngineTrail(dt, tmpV, 0.85);
      }

      const dtSep = t - state.sepTime;
      boosterPart.position.y = state.sepY0 + state.sepVelY*dtSep - 0.5*FALL_G*dtSep*dtSep;
      boosterPart.position.x = state.sepX0 + dtSep*18;
      boosterPart.position.z = state.sepZ0 + dtSep*7;
      boosterPart.rotation.x += dt*1.4;
      boosterPart.rotation.z += dt*0.8;
      if (boosterPart.position.y < -60) boosterPart.visible = false;
    }

    updatePuffs(dt);
    updateCameraLaunch(altitude, t);

    const activeGlow = state.separated ? shipPart.userData.engineGlow : boosterPart.userData.engineGlow;
    activeGlow.getWorldPosition(tmpV);
    const glowStrength = activeGlow.visible ? clamp(1 - altitude/260, 0.2, 1) : 0;
    updateGlow(tmpV, glowStrength*0.95);

    if (t >= T_BLACK && !state.moonSwapped){
      state.moonSwapped = true;
      launchScene.visible = false;
      moonScene.visible = false;
      launchScene.remove(shipPart);
      moonScene.add(shipPart);
      shipPart.position.set(PAD_X, MOON_START_Y, 0);
      shipPart.rotation.set(0,0,0);
      camState.y = 90 + MOON_START_Y*0.55 + 40;
    }
  } else {
    if (t >= T_MOON_IN && !moonScene.visible) moonScene.visible = true;

    const q = clamp((t - T_MOON_IN)/(T_MOON_TOUCHDOWN - T_MOON_IN), 0, 1);
    const y = MOON_START_Y * (1-q)*(1-q) + PLATFORM_H;
    shipPart.position.y = y;

    const sg = shipPart.userData.engineGlow;
    sg.visible = q > 0.02 && q < 1.0;
    if (sg.visible){
      pulseEngine(sg, t, 40);
    }

    const closeness = clamp(1 - (y-PLATFORM_H)/70, 0, 1);
    if (closeness > 0) spawnMoonDust(dt, shipPart.position, closeness);
    if (q > 0.04 && q < 0.94) spawnRCS(dt);
    updatePuffs(dt);

    if (q >= 1 && t >= T_RAMP_START){
      updateCutscene(dt);
    } else {
      updateCameraMoon(y);
    }

    sg.getWorldPosition(tmpV);
    updateGlow(tmpV, sg.visible ? 0.9 : 0);

    stars.material.opacity = 1;
    skyEl.style.background = "linear-gradient(#03040c,#0a0c1c)";
  }

  fadeEl.style.opacity = overlayOpacity(t);

  renderer.render(scene, camera);
}
animate();
