<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Starship Launch</title>
<style>
  html, body {
    margin:0; width:100%; height:100%; overflow:hidden; background:#8ec9f0;
    touch-action:none; overscroll-behavior:none;
    -webkit-text-size-adjust:100%; text-size-adjust:100%;
  }
  #sky { position:fixed; inset:0; background:linear-gradient(#8ec9f0,#cfe9ff); transition:none; z-index:0; }
  canvas { display:block; position:fixed; inset:0; width:100%; height:100%; z-index:1; }
  #glow {
    position:fixed; width:820px; height:820px; border-radius:50%;
    pointer-events:none; transform:translate(-50%,-50%); opacity:0;
    background:radial-gradient(circle, rgba(255,225,140,0.92) 0%, rgba(255,150,40,0.55) 26%, rgba(255,90,10,0) 66%);
    mix-blend-mode:screen; filter:blur(2px); z-index:2;
  }
  #fade { position:fixed; inset:0; background:#000; opacity:1; pointer-events:none; z-index:4; }
  #countdown {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Courier New", monospace;
    font-weight:800; font-style:italic;
    font-size:min(18vw,180px); color:#ffffff;
    text-shadow: 0 0 40px rgba(255,150,30,0.7), 0 0 90px rgba(255,120,20,0.35), 0 4px 10px rgba(0,0,0,0.4);
    letter-spacing:10px; opacity:0; user-select:none; z-index:3;
  }
  #skipBtn {
    position:fixed; right:20px; bottom:20px; z-index:5;
    padding:10px 18px; border-radius:24px; border:2px solid rgba(255,255,255,.6);
    background:rgba(20,20,25,.45); color:#fff; font-family:Arial,sans-serif; font-size:14px;
    font-weight:600; letter-spacing:.3px; cursor:pointer; user-select:none;
    -webkit-tap-highlight-color:transparent; backdrop-filter:blur(2px);
  }
  #skipBtn:active { background:rgba(255,255,255,.35); }
  #skipBtn svg { vertical-align:-1px; margin-left:2px; }
  #joystick {
    position:fixed; bottom:26px; left:26px; z-index:5; display:none;
    width:118px; height:118px; border-radius:50%;
    border:2px solid rgba(255,255,255,.45); background:rgba(20,20,25,.35);
    touch-action:none; user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #joystick-knob {
    position:absolute; top:50%; left:50%; width:50px; height:50px;
    margin:-25px 0 0 -25px; border-radius:50%;
    background:rgba(255,255,255,.32); border:2px solid rgba(255,255,255,.62);
    pointer-events:none;
  }
  /* Jump and action share one visual family (size, border weight, opacity
     steps, right-edge alignment) -- only their accent color differs, so
     they read as a deliberate pair instead of two unrelated buttons. */
  #jumpBtn, #actionBtn {
    position:fixed; right:30px; z-index:5; display:none;
    width:64px; height:64px; border-radius:50%;
    align-items:center; justify-content:center;
    border-width:2px; border-style:solid;
    cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  #jumpBtn {
    bottom:28px;
    background:rgba(255,210,0,.24); border-color:rgba(255,210,0,.75);
  }
  #jumpBtn.on { background:rgba(255,210,0,.5); }
  #jumpBtn .ico {
    width:0; height:0; margin-top:-3px;
    border-left:10px solid transparent; border-right:10px solid transparent;
    border-bottom:16px solid #fff;
  }
  #actionBtn {
    bottom:106px;
    background:rgba(150,215,255,.24); border-color:rgba(150,215,255,.75);
  }
  #actionBtn.on { background:rgba(150,215,255,.5); }
  #actionBtn .ico {
    width:16px; height:16px; border:3px solid #fff; border-radius:3px; transform:rotate(45deg);
  }
  #actionBtn.holding .ico { background:#fff; }
  #enterHint, #pickupHint {
    position:fixed; left:50%; bottom:112px; transform:translateX(-50%);
    z-index:5; display:none; padding:7px 16px; border-radius:16px;
    background:rgba(20,20,25,.5); border:1px solid rgba(255,255,255,.4);
    color:#fff; font-family:Arial,sans-serif; font-size:13px; font-weight:600;
    letter-spacing:.2px; pointer-events:none; text-align:center;
    max-width:min(78vw, 340px);
  }
  #pickupHint { border-color:rgba(150,215,255,.6); bottom:172px; }
  @media (max-width:400px) {
    #enterHint, #pickupHint { font-size:11px; padding:5px 10px; max-width:70vw; }
  }
  #speechCaption {
    position:fixed; left:50%; top:64px; transform:translateX(-50%);
    z-index:6; padding:8px 18px; border-radius:16px;
    background:rgba(20,20,25,.55); border:1px solid rgba(255,255,255,.4);
    color:#fff; font-family:Arial,sans-serif; font-size:13px; font-weight:600;
    letter-spacing:.2px; pointer-events:none; text-align:center;
    max-width:min(78vw, 340px);
    opacity:0; transition:opacity .25s ease;
  }
  #speechCaption.show { opacity:1; }
  @media (max-width:400px) {
    #speechCaption { font-size:11px; padding:5px 10px; max-width:70vw; top:56px; }
  }
  #crystalHud {
    position:fixed; top:16px; left:16px; z-index:5; display:none;
    padding:7px 14px; border-radius:16px; background:rgba(20,20,25,.5);
    border:1px solid rgba(200,140,255,.5); align-items:center; gap:8px;
    color:#fff; font-family:Arial,sans-serif; font-size:14px; font-weight:600;
  }
  #crystalHud .ico {
    width:12px; height:16px; background:#c07bff; opacity:0.95;
    clip-path: polygon(50% 0%, 100% 30%, 78% 100%, 22% 100%, 0% 30%);
    box-shadow: 0 0 6px 1px rgba(192,123,255,.9);
  }
  #minimap {
    /* The generic canvas{inset:0} rule above also sets left/bottom on this
       element (a <canvas>); since this rule only overrides top/right, those
       leak through and pin it to the left edge unless reset explicitly. */
    position:fixed; top:16px; right:16px; left:auto; bottom:auto; z-index:5; display:none;
    width:168px; height:168px; border-radius:50%;
    border:2px solid rgba(255,255,255,.45);
    background:rgba(10,12,20,.5);
  }
  @media (max-width:768px), (pointer:coarse) { #minimap { width:122px; height:122px; } }
  @media (max-height:340px) {
    #minimap { width:96px; height:96px; }
    #jumpBtn, #actionBtn { width:50px; height:50px; right:16px; }
    #jumpBtn { bottom:14px; }
    #actionBtn { bottom:76px; }
  }
  #fullscreenBtn {
    position:fixed; top:64px; left:16px; z-index:5;
    width:44px; height:44px; background:rgba(20,20,25,.45); border:2px solid rgba(255,255,255,.55);
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; backdrop-filter:blur(2px);
  }
  #fullscreenBtn:active { background:rgba(255,255,255,.25); }
  #fullscreenBtn .ico-compress { display:none; }
  #fullscreenBtn.on .ico-expand { display:none; }
  #fullscreenBtn.on .ico-compress { display:inline; }
</style>
</head>
<body>
<div id="sky"></div>
<div id="glow"></div>
<div id="countdown"></div>
<div id="fade"></div>
<div id="skipBtn">Überspringen <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg></div>
<canvas id="minimap" width="168" height="168"></canvas>
<div id="crystalHud"><span class="ico"></span><span id="crystalCount">0 / 10</span></div>
<div id="enterHint">Sprung-Taste zum Einsteigen</div>
<div id="pickupHint">Aktion-Taste zum Aufheben</div>
<div id="speechCaption"></div>
<div id="joystick"><div id="joystick-knob"></div></div>
<div id="jumpBtn"><span class="ico"></span></div>
<div id="actionBtn"><span class="ico"></span></div>
<div id="fullscreenBtn" title="Vollbild">
  <svg class="ico-expand" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
    <polyline points="8 3 3 3 3 8"/>
    <polyline points="16 3 21 3 21 8"/>
    <polyline points="8 21 3 21 3 16"/>
    <polyline points="16 21 21 21 21 16"/>
  </svg>
  <svg class="ico-compress" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
    <polyline points="3 8 8 8 8 3"/>
    <polyline points="21 8 16 8 16 3"/>
    <polyline points="3 16 8 16 8 21"/>
    <polyline points="21 16 16 16 16 21"/>
  </svg>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from "three";

/* ---------- helpers ---------- */
const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (x,a,b) => Math.min(b, Math.max(a,x));
const smoothstep = (a,b,x) => { const t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const lerp = (a,b,t) => a + (b-a)*t;

/* ---------- renderer / scene / camera ---------- */
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:"high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 6000);

const hemi = new THREE.HemisphereLight(0xbfe0ff, 0xd6d2bf, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4e0, 1.15);
sun.position.set(120, 220, 160);
scene.add(sun);
const fill = new THREE.AmbientLight(0x8899aa, 0.25);
scene.add(fill);

let zoomResetPending = false;
function resize(){
  const w = window.visualViewport ? window.visualViewport.width  : innerWidth;
  const h = window.visualViewport ? window.visualViewport.height : innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  // Defense in depth: the double-tap/pinch guards below cover every known
  // trigger, but if some interaction still slips past them and leaves the
  // page pinch/double-tap zoomed in, self-correct here instead of leaving
  // the player stuck with no in-game way back out (resetZoom is declared
  // further down but hoisted, so it's callable from here).
  if (window.visualViewport && Math.abs(window.visualViewport.scale - 1) > 0.02 && !zoomResetPending){
    zoomResetPending = true;
    resetZoom();
    setTimeout(() => { zoomResetPending = false; }, 400);
  }
}
let resizeQueued = false;
function scheduleResize(){
  if (resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => { resizeQueued = false; resize(); });
}
addEventListener("resize", scheduleResize);
if (window.visualViewport){
  visualViewport.addEventListener("resize", scheduleResize);
  visualViewport.addEventListener("scroll", scheduleResize);
}
resize();

/* ---------- prevent browser zoom (desktop ctrl+wheel / ctrl+plus/minus) ---------- */
addEventListener("wheel", e => { if (e.ctrlKey) e.preventDefault(); }, { passive:false });
addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && ["+","-","=","0"].includes(e.key)) e.preventDefault();
}, { passive:false });
["gesturestart","gesturechange"].forEach(evt =>
  addEventListener(evt, e => e.preventDefault(), { passive:false })
);
// gesturestart/gesturechange only cover pinch -- iOS Safari's double-tap-to-zoom
// is a separate gesture that touch-action:none doesn't reliably suppress on its
// own, so block it explicitly by swallowing the second tap of a fast double-tap.
// UI buttons that depend on synthetic click/touchend events are excluded so
// those keep working. jumpBtn/actionBtn/joystick are NOT excluded: all three
// are driven entirely by pointer events (which already call preventDefault
// themselves), so guarding them too costs nothing -- and leaving them
// unguarded was the actual bug: repeatedly tapping jump for the jetpack
// boost, or quick taps/drags on the joystick while steering, are exactly the
// fast-double-tap pattern that used to trigger Safari's native page zoom,
// leaving the whole game visibly zoomed in with no in-game way back out.
let lastTouchEnd = 0;
const NO_DBLTAP_GUARD = '#skipBtn,#fullscreenBtn';
addEventListener("touchend", e => {
  if (e.target.closest(NO_DBLTAP_GUARD)) return;
  const now = Date.now();
  if (now - lastTouchEnd <= 350) e.preventDefault();
  lastTouchEnd = now;
}, { passive:false });

/* ---------- materials ---------- */
const MAT = {
  metal:     new THREE.MeshStandardMaterial({ color:0xd9dde2, flatShading:true, metalness:0.35, roughness:0.5 }),
  metalDark: new THREE.MeshStandardMaterial({ color:0x9195a0, flatShading:true, metalness:0.4,  roughness:0.5 }),
  engineDark:new THREE.MeshStandardMaterial({ color:0x24252a, flatShading:true, roughness:0.85 }),
  tower:     new THREE.MeshStandardMaterial({ color:0xb7bbc1, flatShading:true, roughness:0.75 }),
  towerDark: new THREE.MeshStandardMaterial({ color:0x6b6f76, flatShading:true, roughness:0.8 }),
  yellow:    new THREE.MeshStandardMaterial({ color:0xffcc00, flatShading:true, roughness:0.55 }),
  red:       new THREE.MeshStandardMaterial({ color:0xe0362b, flatShading:true, roughness:0.55 }),
  pad:       new THREE.MeshStandardMaterial({ color:0x585c62, flatShading:true, roughness:0.95 }),
  trench:    new THREE.MeshStandardMaterial({ color:0x18181b, flatShading:true, roughness:1 }),
  ground:    new THREE.MeshStandardMaterial({ color:0x4f9a48, flatShading:true, roughness:1 }),
  groundDark:new THREE.MeshStandardMaterial({ color:0x3f8440, flatShading:true, roughness:1 }),
  sea:       new THREE.MeshStandardMaterial({ color:0x1f7fae, flatShading:true, roughness:0.3, metalness:0.2 }),
  scrub:     new THREE.MeshStandardMaterial({ color:0x3f8a3a, flatShading:true, roughness:1 }),
  trunk:     new THREE.MeshStandardMaterial({ color:0x7a5738, flatShading:true, roughness:1 }),
  frond:     new THREE.MeshStandardMaterial({ color:0x3f9c46, flatShading:true, roughness:1 }),
  tank:      new THREE.MeshStandardMaterial({ color:0xe7e9ec, flatShading:true, roughness:0.6 }),
  concrete:  new THREE.MeshStandardMaterial({ color:0xb9b9ae, flatShading:true, roughness:0.9 }),
  asphalt:   new THREE.MeshStandardMaterial({ color:0x3a3a3e, flatShading:true, roughness:0.9 }),
  hangarWall:new THREE.MeshStandardMaterial({ color:0xe6e8ea, flatShading:true, roughness:0.75 }),
  hangarRoof:new THREE.MeshStandardMaterial({ color:0x8992a0, flatShading:true, roughness:0.7 }),
  moonGround:new THREE.MeshStandardMaterial({ color:0x9a9a9a, flatShading:true, roughness:1 }),
  moonRock:  new THREE.MeshStandardMaterial({ color:0x828282, flatShading:true, roughness:1 }),
  moonBase:  new THREE.MeshStandardMaterial({ color:0xd6d8db, flatShading:true, roughness:0.6, metalness:0.2 }),
  moonBaseDark: new THREE.MeshStandardMaterial({ color:0x53565c, flatShading:true, roughness:0.6, metalness:0.2 }),
  roverBody: new THREE.MeshStandardMaterial({ color:0xe8e2d0, flatShading:true, roughness:0.7 }),
  roverDark: new THREE.MeshStandardMaterial({ color:0x3a3a3e, flatShading:true, roughness:0.8 }),
  roverGold: new THREE.MeshStandardMaterial({ color:0xd8a83c, flatShading:true, roughness:0.5, metalness:0.4 }),
  stationWall:new THREE.MeshStandardMaterial({ color:0xd2d5da, flatShading:true, roughness:0.55, metalness:0.2 }),
  stationDark:new THREE.MeshStandardMaterial({ color:0x585c64, flatShading:true, roughness:0.6, metalness:0.2 }),
  stationDome:new THREE.MeshStandardMaterial({ color:0x8fd0e8, flatShading:true, roughness:0.15, metalness:0.1, transparent:true, opacity:0.55 }),
  suitWhite: new THREE.MeshStandardMaterial({ color:0xf1f0ea, flatShading:true, roughness:0.65 }),
  suitDark:  new THREE.MeshStandardMaterial({ color:0x2b2c30, flatShading:true, roughness:0.6 }),
  visor:     new THREE.MeshStandardMaterial({ color:0x0a0c10, flatShading:true, roughness:0.25, metalness:0.6 }),
  suitAccent:new THREE.MeshStandardMaterial({ color:0xd8362c, flatShading:true, roughness:0.55 }),
  crystal:   new THREE.MeshStandardMaterial({ color:0xa855f7, emissive:0x9333ea, emissiveIntensity:1.4, flatShading:true, roughness:0.25, metalness:0.15, transparent:true, opacity:0.92 }),
  solarPanel:new THREE.MeshStandardMaterial({ color:0x14213d, flatShading:true, roughness:0.25, metalness:0.55 }),
  lampGlow:  new THREE.MeshBasicMaterial({ color:0xffe9b0, toneMapped:false }),
  rigHull:     new THREE.MeshStandardMaterial({ color:0xd8dbe0, flatShading:true, roughness:0.45, metalness:0.3 }),
  rigHullDark: new THREE.MeshStandardMaterial({ color:0x44474e, flatShading:true, roughness:0.5, metalness:0.3 }),
};

// A single flat MeshStandardMaterial color reads as an obviously fake,
// perfectly uniform lawn -- paint some mottled tonal variation onto a
// tiling canvas texture instead so the land plane looks like real grass.
function buildGrassTexture(){
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#4f9a48';
  ctx.fillRect(0,0,size,size);
  const shades = ['#3f8440','#457f3f','#5aa852','#5fae57','#3a7a3d','#549b4e'];
  for(let i=0;i<1100;i++){
    ctx.fillStyle = shades[Math.floor(Math.random()*shades.length)];
    ctx.globalAlpha = 0.25 + Math.random()*0.4;
    const x = Math.random()*size, y = Math.random()*size;
    const r = 1.5 + Math.random()*4.5;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(70, 40);
  return tex;
}
MAT.ground.map = buildGrassTexture();
MAT.ground.color.set(0xffffff);

const PAD_X = 0, PAD_TOP = 6;
const PLATFORM_H = 3;
const ROVER_SCALE = 0.3;

/* ---------- engine exhaust glow: one flame assembly per nozzle ---------- */
function buildFlame(scale){
  const core = new THREE.Mesh(new THREE.ConeGeometry(3.8*scale,20*scale,10), new THREE.MeshBasicMaterial({ color:0xfff6d0, toneMapped:false }));
  core.rotation.x = Math.PI; core.position.y = -8.5*scale;
  const mid = new THREE.Mesh(new THREE.ConeGeometry(5.6*scale,14*scale,10), new THREE.MeshBasicMaterial({ color:0xffa93c, transparent:true, opacity:0.88, blending:THREE.AdditiveBlending, toneMapped:false }));
  mid.rotation.x = Math.PI; mid.position.y = -4.5*scale;
  const halo = new THREE.Mesh(new THREE.SphereGeometry(11.5*scale,12,10), new THREE.MeshBasicMaterial({ color:0xff7a1a, transparent:true, opacity:0.52, blending:THREE.AdditiveBlending, toneMapped:false }));
  halo.position.y = -1.3*scale;
  const outer = new THREE.Mesh(new THREE.SphereGeometry(19*scale,12,10), new THREE.MeshBasicMaterial({ color:0xff5010, transparent:true, opacity:0.25, blending:THREE.AdditiveBlending, toneMapped:false }));
  const grp = new THREE.Group();
  grp.add(outer, halo, mid, core);
  return { grp, core, mid, halo, outer };
}
function buildEngineGlow(scale, offsets){
  const root = new THREE.Group();
  const flames = offsets.map(([ox,oz]) => {
    const f = buildFlame(scale);
    f.grp.position.set(ox,0,oz);
    root.add(f.grp);
    return f;
  });
  root.visible = false;
  root.userData = { flames };
  return root;
}
function pulseEngine(glow, tt, freq){
  glow.userData.flames.forEach((u,idx) => {
    const ph = idx*0.7;
    u.core.scale.setScalar(0.85+Math.sin(tt*freq+ph)*0.15);
    u.mid.scale.setScalar(0.9+Math.sin(tt*freq*0.8+1+ph)*0.2);
    u.mid.material.opacity = 0.78+Math.sin(tt*freq*1.3+ph)*0.15;
    u.halo.material.opacity = 0.46+Math.sin(tt*freq*0.9+2+ph)*0.16;
    u.outer.material.opacity = 0.2+Math.sin(tt*freq*0.6+ph)*0.08;
  });
}

/* ---------- rocket: booster + ship (separable stages) ---------- */
const boosterR = 8, boosterH = 80;
const shipRb = 7.6, shipRt = 6.4, shipH = 45, noseH = 15;

function buildBoosterPart(){
  const g = new THREE.Group();
  let y = 0;
  const skirt = new THREE.Mesh(new THREE.CylinderGeometry(boosterR*1.02, boosterR*1.1, 6, 8), MAT.engineDark);
  skirt.position.y = y + 3; g.add(skirt); y += 6;

  const raptors = new THREE.Group();
  for(let i=0;i<7;i++){
    const a = (i/7)*Math.PI*2;
    const r = i===0?0:boosterR*0.55;
    const m = new THREE.Mesh(new THREE.ConeGeometry(1.1,2.4,6), MAT.engineDark);
    m.position.set(Math.cos(a)*r, 4.4, Math.sin(a)*r);
    m.rotation.x = Math.PI;
    raptors.add(m);
  }
  g.add(raptors);

  const booster = new THREE.Mesh(new THREE.CylinderGeometry(boosterR, boosterR, boosterH, 8), MAT.metal);
  booster.position.y = y + boosterH/2; g.add(booster);

  for(let i=0;i<4;i++){
    const a = (i/4)*Math.PI*2 + Math.PI/4;
    const fin = new THREE.Mesh(new THREE.BoxGeometry(4.5,7,0.6), MAT.metalDark);
    fin.position.set(Math.cos(a)*(boosterR+1.6), y+boosterH-10, Math.sin(a)*(boosterR+1.6));
    fin.rotation.y = -a;
    fin.rotation.z = 0.18;
    g.add(fin);
  }

  const stripe = new THREE.Mesh(new THREE.CylinderGeometry(boosterR+0.05, boosterR+0.05, 3, 8), MAT.red);
  stripe.position.y = y + boosterH - 4; g.add(stripe);

  y += boosterH;

  const boosterFlameOffsets = Array.from({length:7}, (_,i) => {
    const a = (i/7)*Math.PI*2, r = i===0?0:boosterR*0.55;
    return [Math.cos(a)*r, Math.sin(a)*r];
  });
  const engineGlow = buildEngineGlow(0.95, boosterFlameOffsets);
  engineGlow.position.y = 2;
  g.add(engineGlow);

  g.userData = { topY: y, engineGlow };
  return g;
}

function buildShipPart(){
  const g = new THREE.Group();
  let y = 0;

  const interstage = new THREE.Mesh(new THREE.CylinderGeometry(boosterR*0.98, boosterR, 3, 8), MAT.metalDark);
  interstage.position.y = y + 1.5; g.add(interstage);
  y += 3;

  const ship = new THREE.Mesh(new THREE.CylinderGeometry(shipRt, shipRb, shipH, 8), MAT.metal);
  ship.position.y = y + shipH/2; g.add(ship);

// Mobile ramp rig, used after moon landing: unlike the hatch door (which
// stays hinged to the hull), the ramp is a separate ground vehicle/gangway
// that drives in from a distance and docks against the hatch -- it does not
// unfold away from the ship. Built once the ship's hatch geometry is known;
// added to moonScene once that group exists (see below).
function buildRampRig(hatchR, hatchY, rampRun){
  const rampRise = hatchY + PLATFORM_H;
  const rampLen = Math.hypot(rampRun, rampRise);
  const angle = -Math.atan2(rampRise, rampRun);
  const grp = new THREE.Group(); // origin = the end that docks against the hatch
  const rampBody = new THREE.Group();
  rampBody.rotation.z = angle;
  const ramp = new THREE.Mesh(new THREE.BoxGeometry(rampLen, 0.5, 4.6), MAT.moonBase);
  ramp.position.x = rampLen/2;
  rampBody.add(ramp);
  for(let s=-1;s<=1;s+=2){
    const rail = new THREE.Mesh(new THREE.BoxGeometry(rampLen, 0.9, 0.2), MAT.moonBaseDark);
    rail.position.set(rampLen/2, 0.6, s*2.25);
    rampBody.add(rail);
  }
  // Small drive wheels under the ground-contact end, so it visibly reads as
  // a self-propelled gangway vehicle rather than a static ramp. Positioned
  // in rampBody's local (pre-rotation) space -- rampBody's own rotation.z
  // carries them to the correct tilted, ground-touching spot automatically.
  for(let s=-1;s<=1;s+=2){
    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,0.7,10), MAT.roverDark);
    wheel.rotation.x = Math.PI/2;
    wheel.position.set(rampLen-1.5, -0.6, s*2.6);
    rampBody.add(wheel);
  }
  grp.add(rampBody);
  grp.visible = false;
  return grp;
}

const MOON_TERRAIN_SIZE = 4000, MOON_TERRAIN_SEGS = 200;
const MOON_TERRAIN_CELL = MOON_TERRAIN_SIZE / MOON_TERRAIN_SEGS;
const moonCraters = [];
const moonHills = [];
const towerPlatforms = [];  // flat climbable landings on the comms tower
const towerStairZones = []; // linear ramps connecting them
const moonRocksData = [];
const pickupStones = []; // small hand-liftable stones, separate from the big climbable decorative rocks

// Road network: an array of straight [ [x0,z0], [x1,z1] ] segments, populated
// during moon-scene setup below. Declared at true top level (not inside that
// setup's own block scope) so vehicle gameplay code later in the file can
// also query "am I on a road" for the speed bonus.
const ROAD_SEGMENTS = [];
function distToSegment(px,pz, from, to){
  const dx = to[0]-from[0], dz = to[1]-from[1];
  const len2 = dx*dx+dz*dz;
  const t = clamp(((px-from[0])*dx + (pz-from[1])*dz) / len2, 0, 1);
  return Math.hypot(px-(from[0]+dx*t), pz-(from[1]+dz*t));
}
function distToRoad(px,pz){
  let best = Infinity;
  for (const seg of ROAD_SEGMENTS) best = Math.min(best, distToSegment(px,pz,seg[0],seg[1]));
  return best;
}
const ROAD_HALF_WIDTH = 5; // "on the road" threshold for the vehicle speed bonus (visual road is 7 wide)
const crystals = [];
const CRYSTAL_COUNT = 10;

function moonCraterY(x,z){
  let y = 0;
  for(const c of moonCraters){
    const d = Math.hypot(x-c.x, z-c.z);
    if (d < c.r){
      const tt = d/c.r;
      const bowl = -c.depth*(1-tt*tt);
      if (bowl < y) y = bowl;
    }
  }
  return y;
}
// Gentle rolling hills -- same inverted-bowl shape as craters but domed
// upward, with a much larger radius relative to height so they read as
// subtle terrain variation rather than climbable bumps (compare rockBumpY's
// much smaller/steeper radius-to-height ratio).
function moonHillY(x,z){
  let y = 0;
  for(const h of moonHills){
    const d = Math.hypot(x-h.x, z-h.z);
    if (d < h.r){
      const tt = d/h.r;
      const dome = h.height*(1-tt*tt);
      if (dome > y) y = dome;
    }
  }
  return y;
}
// A single straight ramp between two known (x,y,z) points -- returns the
// interpolated Y if (x,z) falls within the ramp's length and half-width,
// otherwise null. Each stair flight on the tower is offset to a different
// side of the tower per level (see the tower-building code), so flights
// never overlap each other in (x,z) and the height field stays single-valued
// despite representing a multi-story structure.
function stairZoneY(x,z,zone){
  const dx = zone.x1-zone.x0, dz = zone.z1-zone.z0;
  const len2 = dx*dx+dz*dz;
  const t = ((x-zone.x0)*dx + (z-zone.z0)*dz) / len2;
  if (t < 0 || t > 1) return null;
  const projX = zone.x0+dx*t, projZ = zone.z0+dz*t;
  if (Math.hypot(x-projX, z-projZ) > zone.halfWidth) return null;
  return lerp(zone.yLow, zone.yHigh, t);
}
function getTowerY(x,z){
  for (const p of towerPlatforms){
    if (Math.abs(x-p.x) < p.half && Math.abs(z-p.z) < p.half) return p.y;
  }
  for (const s of towerStairZones){
    const y = stairZoneY(x,z,s);
    if (y !== null) return y;
  }
  return null;
}
function rockBumpY(x,z){
  let y = 0;
  for(const rk of moonRocksData){
    if (rk.held) continue;
    const d = Math.hypot(x-rk.x, z-rk.z);
    if (d < rk.r){
      const tt = d/rk.r;
      const bump = rk.h*(1-tt*tt);
      if (bump > y) y = bump;
    }
  }
  return y;
}
function getMoonSurfaceY(x,z){
  if (Math.hypot(x-PAD_X,z) < 27) return PLATFORM_H;
  const towerY = getTowerY(x,z);
  if (towerY !== null) return towerY;
  // Bilinear-interpolate craters between the same 20-unit grid corners the
  // rendered terrain mesh uses, instead of sampling the exact analytic bowl
  // formula at (x,z) directly. The mesh is flat-shaded between coarse grid
  // vertices, so on a steep crater wall the true curve dips measurably below
  // the straight chord the GPU actually draws -- a raw analytic sample there
  // reads as several units *underground* relative to what's on screen,
  // causing the astronaut/rover to visibly sink. Reconstructing the same
  // interpolation the mesh does keeps physics and visuals in agreement.
  // Rocks are NOT baked into the terrain mesh (they're separate decorative
  // objects) and their bump radius is smaller than one grid cell, so they're
  // sampled directly instead -- grid-interpolating them would miss most
  // rocks entirely and make them unclimbable.
  const half = MOON_TERRAIN_SIZE/2;
  const gx = (x+half)/MOON_TERRAIN_CELL, gz = (z+half)/MOON_TERRAIN_CELL;
  const ix = Math.floor(gx), iz = Math.floor(gz);
  const fx = gx-ix, fz = gz-iz;
  const wx = (i) => i*MOON_TERRAIN_CELL - half;
  const cornerY = (i,j) => moonCraterY(wx(i),wx(j)) + moonHillY(wx(i),wx(j));
  const h00 = cornerY(ix,iz);
  const h10 = cornerY(ix+1,iz);
  const h01 = cornerY(ix,iz+1);
  const h11 = cornerY(ix+1,iz+1);
  const terrainY = lerp(lerp(h00,h10,fx), lerp(h01,h11,fx), fz);
  return terrainY + rockBumpY(x,z);
}
// Approximates a long object (station module, tube) as a chain of overlapping
// circles along its local X axis, for cheap push-out collision.
function registerCapsuleCollider(obj, r, len, segments){
  const n = segments || Math.max(2, Math.round(len/6));
  const p = new THREE.Vector3();
  for (let i=0;i<n;i++){
    const tt = n===1 ? 0 : (i/(n-1) - 0.5);
    p.set(tt*len, 0, 0);
    obj.localToWorld(p);
    moonCollidables.push({ x:p.x, z:p.z, r });
  }
}
// Resolves circle-vs-circle collision for a moving entity. Naively snapping
// the proposed new position back out to the collider's edge cancels ALL of
// the attempted movement whenever the collider center happens to sit roughly
// behind the new position -- feels like slamming into a dead wall even on a
// glancing approach. Instead, only the component of the attempted movement
// pointing INTO the collider is removed; the tangential component survives,
// so walking/driving past a station module at an angle glides along its
// curve instead of stopping outright.
// A canvas-generated radial-gradient blue disc, used as a billboarded sprite
// (always faces the camera, no per-frame lookAt needed) so Earth reads as a
// distant sky object rather than a reachable ball sitting on the ground.
function buildEarthSprite(){

  canvas.width = canvas.height = size;

  const grad = ctx.createRadialGradient(size/2,size/2,0, size/2,size/2,size/2);
  grad.addColorStop(0, 'rgba(90,160,235,1)');

  const mat = new THREE.SpriteMaterial({ map: tex, transparent:true, depthWrite:false, toneMapped:false });

  sprite.scale.set(140,140,1);
  return sprite;
}

function resolveSlide(oldX, oldZ, x, z, radius, list){
  let rx = x, rz = z;
  for (const c of list){
    const dx = rx - c.x, dz = rz - c.z;
    const minD = radius + c.r;
    const d = Math.hypot(dx,dz);
    if (d < minD){
      if (d < 0.0001){ rx = oldX; rz = oldZ; continue; }
      const nxAxis = dx/d, nzAxis = dz/d; // outward normal at the proposed position
      const moveX = rx - oldX, moveZ = rz - oldZ;
      const inward = -(moveX*nxAxis + moveZ*nzAxis); // >0 = moving into the collider
      if (inward > 0){ rx += nxAxis*inward; rz += nzAxis*inward; }
      const dx2 = rx - c.x, dz2 = rz - c.z;
      const d2 = Math.hypot(dx2, dz2);
      if (d2 < minD){
        if (d2 < 0.0001){ rx = oldX; rz = oldZ; continue; }
        const push = (minD-d2)/d2;
        rx += dx2*push; rz += dz2*push;
      }
    }
  }
  return { x:rx, z:rz };
}

    const dx = to[0]-from[0], dz = to[2]-from[2];
    const len = Math.hypot(dx,dz);
    const seg = new THREE.Mesh(new THREE.BoxGeometry(width, thickness, len), MAT.asphalt);
    seg.position.set((from[0]+to[0])/2, (from[1]+to[1])/2, (from[2]+to[2])/2);
    seg.rotation.y = Math.atan2(dx, dz);
    return seg;
  }
  const roadGroup = new THREE.Group();
  roadGroup.userData.tapLabel = 'road';
  function buildRoadPath(from, to, segCount){
    let prevRoadPt = [from[0], getMoonSurfaceY(from[0], from[1]) + 0.08, from[1]];
    for (let i=1;i<=segCount;i++){
      const t = i/segCount;
      const px = lerp(from[0], to[0], t), pz = lerp(from[1], to[1], t);
      const py = getMoonSurfaceY(px,pz) + 0.08;
      roadGroup.add(buildRoadSegment(prevRoadPt, [px,py,pz], 7, 0.3));
      prevRoadPt = [px,py,pz];
    }
  }
  buildRoadPath(roadStart, roadEnd, 6);
  buildRoadPath(roadEnd, [TOWER_X, TOWER_Z], 10);
  buildRoadPath(roadEnd, [SOLAR_X, SOLAR_Z], 10);
  moonScene.add(roadGroup);
  const plaza = new THREE.Mesh(new THREE.CylinderGeometry(20,20,0.3,20), MAT.asphalt);
  plaza.position.set(roadEnd[0], getMoonSurfaceY(roadEnd[0], roadEnd[1]) + 0.08, roadEnd[1]);
  moonScene.add(plaza);

  // Small lamps ringing the landing pad.
  function buildLamp(){
    const grp = new THREE.Group();
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.18,2.4,6), MAT.moonBaseDark);
    pole.position.y = 1.2;
    grp.add(pole);
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.35,8,6), MAT.lampGlow);
    bulb.position.y = 2.5;
    grp.add(bulb);
    return grp;
  }
  const LAMP_COUNT = 10;
  for (let i=0;i<LAMP_COUNT;i++){
    const a = (i/LAMP_COUNT)*Math.PI*2;
    const lamp = buildLamp();
    lamp.position.set(PAD_X+Math.cos(a)*25, PLATFORM_H, Math.sin(a)*25);
    moonScene.add(lamp);
  }

  /* ---------- solar panel field ---------- */
  function buildSolarPanel(){
    const grp = new THREE.Group();
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.28,1.5,6), MAT.stationDark);
    pole.position.y = 0.75;
    grp.add(pole);
    // Pivot group sits at the pole top; the panel mesh is offset so it
    // hinges from its near edge instead of its center, so tilting it up
    // doesn't dip the near edge underground.
    const tiltGrp = new THREE.Group();
    tiltGrp.position.y = 1.5;
    tiltGrp.rotation.x = -0.62;
    grp.add(tiltGrp);
    const panel = new THREE.Mesh(new THREE.BoxGeometry(6,0.2,6), MAT.solarPanel);
    panel.position.z = 3;
    tiltGrp.add(panel);
    const frame = new THREE.Mesh(new THREE.BoxGeometry(6.2,0.12,6.2), MAT.stationDark);
    frame.position.set(0,-0.02,3);
    tiltGrp.add(frame);
    return grp;
  }
  const SOLAR_ROWS = 7, SOLAR_COLS = 7, SOLAR_SPACING = 16;
  const solarHalf = (SOLAR_ROWS-1)*SOLAR_SPACING/2;
  const solarGroup = new THREE.Group();
  solarGroup.userData.tapLabel = 'solar';
  moonScene.add(solarGroup);
  for (let row=0; row<SOLAR_ROWS; row++){
    for (let col=0; col<SOLAR_COLS; col++){
      const px = SOLAR_X + col*SOLAR_SPACING - solarHalf;
      const pz = SOLAR_Z + row*SOLAR_SPACING - solarHalf;
      const panel = buildSolarPanel();
      panel.position.set(px, getMoonSurfaceY(px,pz), pz);
      solarGroup.add(panel);
    }
  }

  /* ---------- comms tower: taller than the rocket, climbable via a
     rotating stair sequence -- each platform/flight is offset to a
     different side per level (never stacking directly above each other
     in x/z), so the single-valued height field stays unambiguous despite
     representing a multi-story structure. Offsets are kept just large
     enough to clear the core lattice collider below (see its reduced
     radius further down) so platforms nestle between the corner legs
     instead of reading as balconies bolted far off to one side. ---------- */
  const TOWER_LEVELS = [
    { y: 38,  ox: 11, oz: 0   },
    { y: 78,  ox: 0,  oz: 11  },
    { y: 118, ox: -11,oz: 0   },
    { y: 158, ox: 0,  oz: -11 },
  ];
  const TOWER_PLATFORM_HALF = 5;
  const towerGroup = new THREE.Group();
  towerGroup.userData.tapLabel = 'tower';
  towerGroup.position.set(TOWER_X, 0, TOWER_Z);
  moonScene.add(towerGroup);

  const towerTopY = TOWER_LEVELS[TOWER_LEVELS.length-1].y + 6;
  [[7,7],[7,-7],[-7,7],[-7,-7]].forEach(([lx,lz]) => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.7,towerTopY,6), MAT.tower);
    leg.position.set(lx, towerTopY/2, lz);
    towerGroup.add(leg);
  });
  for (let h=15; h<towerTopY; h+=20){
    const brace = new THREE.Mesh(new THREE.TorusGeometry(9.5,0.25,5,4), MAT.towerDark);
    brace.rotation.x = Math.PI/2;
    brace.rotation.y = Math.PI/4;
    brace.position.y = h;
    towerGroup.add(brace);
  }

  function buildTowerPlatform(){
    const grp = new THREE.Group();
    const deck = new THREE.Mesh(new THREE.BoxGeometry(TOWER_PLATFORM_HALF*2, 0.6, TOWER_PLATFORM_HALF*2), MAT.stationWall);
    grp.add(deck);
    const railH = 1.1;
    [[TOWER_PLATFORM_HALF,0],[-TOWER_PLATFORM_HALF,0],[0,TOWER_PLATFORM_HALF],[0,-TOWER_PLATFORM_HALF]].forEach(([rx,rz]) => {
      const rail = new THREE.Mesh(new THREE.BoxGeometry(rx?0.2:TOWER_PLATFORM_HALF*2, railH, rz?0.2:TOWER_PLATFORM_HALF*2), MAT.towerDark);
      rail.position.set(rx, railH/2+0.3, rz);
      grp.add(rail);
    });
    return grp;
  }

  // Ground-level start of the first flight, offset outside the core
  // lattice's (shrunk) collision radius rather than the tower's true
  // center -- otherwise the flight would begin inside a collider the
  // player can never actually reach.
  let prevTowerLevel = { y: 0, ox: 9, oz: 11 };
  TOWER_LEVELS.forEach((lvl) => {
    const platform = buildTowerPlatform();
    platform.position.set(lvl.ox, lvl.y, lvl.oz);
    towerGroup.add(platform);
    towerPlatforms.push({ x: TOWER_X+lvl.ox, z: TOWER_Z+lvl.oz, y: lvl.y, half: TOWER_PLATFORM_HALF });

    const fromX = TOWER_X+prevTowerLevel.ox, fromZ = TOWER_Z+prevTowerLevel.oz;
    const toX = TOWER_X+lvl.ox, toZ = TOWER_Z+lvl.oz;
    towerStairZones.push({ x0:fromX, z0:fromZ, x1:toX, z1:toZ, yLow: prevTowerLevel.y, yHigh: lvl.y, halfWidth: 3 });

    const stepDx = toX-fromX, stepDz = toZ-fromZ, stepDy = lvl.y-prevTowerLevel.y;
    const stepLen = Math.hypot(stepDx,stepDz,stepDy);
    const ramp = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.4, stepLen), MAT.towerDark);
    ramp.position.set((fromX+toX)/2, (prevTowerLevel.y+lvl.y)/2, (fromZ+toZ)/2);
    ramp.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), new THREE.Vector3(stepDx,stepDy,stepDz).normalize());
    moonScene.add(ramp);

    prevTowerLevel = lvl;
  });

  const topLvl = TOWER_LEVELS[TOWER_LEVELS.length-1];
  const antennaGroup = new THREE.Group();
  antennaGroup.position.set(topLvl.ox, topLvl.y+0.3, topLvl.oz);
  towerGroup.add(antennaGroup);
  [[3,3],[-3,3],[3,-3],[-3,-3]].forEach(([ax,az]) => {
    const mastH = rand(4,7);
    const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,mastH,5), MAT.towerDark);
    mast.position.set(ax, mastH/2, az);
    antennaGroup.add(mast);
  });
  const bigDish = new THREE.Mesh(new THREE.CylinderGeometry(5,5,0.8,12), MAT.moonBaseDark);
  bigDish.rotation.z = 0.55;
  bigDish.position.set(0, 4.5, 0);
  antennaGroup.add(bigDish);

  // Small central-shaft collider -- kept well under the diagonal stairs'
  // closest approach to the tower axis (~7.8 units, offset/sqrt2) so the
  // spiral staircase between platforms is never blocked by it.
  moonCollidables.push({ x: TOWER_X, z: TOWER_Z, r: 6 }); // tower core lattice
  // Vehicles may never drive onto the tower's stairs/platforms; the astronaut
  // still can (climbing is handled purely via getMoonSurfaceY's height field).
  // Single enclosing circle covers the full stacked-platform/stair footprint
  // (farthest reach is the ground-level flight start, ~14 units out).
  vehicleOnlyCollidables.push({ x: TOWER_X, z: TOWER_Z, r: 20 });

  // Glow is a cheap additive-blended unlit halo mesh, not a THREE.PointLight --
  // adding 10 more dynamic lights forces a shader recompile for every material
  // in the scene and tanks frame rate (same lesson as the coin lights elsewhere
  // in this project: change intensity, never the light count, or avoid lights).
  function buildCrystal(){
    const grp = new THREE.Group();
    const gem = new THREE.Mesh(new THREE.OctahedronGeometry(1.3,0), MAT.crystal);
    gem.scale.set(1,1.7,1);
    grp.add(gem);
    const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.55,0), new THREE.MeshBasicMaterial({ color:0xe6ccff, toneMapped:false }));
    core.scale.set(1,1.7,1);
    grp.add(core);
    const halo = new THREE.Mesh(new THREE.SphereGeometry(2.2,8,6), new THREE.MeshBasicMaterial({
      color:0xb266ff, transparent:true, opacity:0.28, blending:THREE.AdditiveBlending, toneMapped:false,
    }));
    grp.add(halo);
    return grp;
  }
  for(let i=0;i<CRYSTAL_COUNT;i++){
    let cx=0, cz=0, ok=false, tries=0;
    do {
      const a = rand(0,Math.PI*2), d = rand(50,480);
      cx = Math.cos(a)*d; cz = Math.sin(a)*d;
      ok = Math.hypot(cx,cz) > 45 && Math.hypot(cx-(-95),cz-(-55)) > 70 && !nearLandmark(cx,cz);
      tries++;
    } while(!ok && tries<30);
    const grp = buildCrystal();
    const gy = getMoonSurfaceY(cx,cz);
    grp.position.set(cx, gy+1.4, cz);
    grp.userData.tapLabel = 'crystal';
    moonScene.add(grp);
    crystals.push({ x:cx, z:cz, group:grp, collected:false });
  }

  // A billboarded sprite instead of a lit sphere -- a 3D globe read as an
  // object "lying on the ground" out near the horizon; a flat glowing disc,
  // high in the sky, unambiguously reads as a distant, unreachable body.
  const earth = buildEarthSprite();
  earth.position.set(-420, 140, -900);
  earth.userData.tapLabel = 'earth';
  moonScene.add(earth);

  const moonSun = new THREE.DirectionalLight(0xffffff,1.3);
  moonSun.position.set(-150,200,120);
  moonScene.add(moonSun);
  const moonAmb = new THREE.HemisphereLight(0x2a2a3a,0x111111,0.35);
  moonScene.add(moonAmb);
}

/* ---------- astronaut: rig ported from dhl-city/character.html, restyled as a spacesuit ---------- */
function astroCyl(rT, rB, h, mat){
  return new THREE.Mesh(new THREE.CylinderGeometry(rT, rB, h, 6), mat);
}
function astroIco(r, mat){
  return new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), mat);
}
function astroBone(parent, px, py, pz, rT, rB, h, mat){
  const j = new THREE.Group();
  j.position.set(px, py, pz);
  parent.add(j);
  const b = astroCyl(rT, rB, h, mat);
  b.position.y = -h/2;
  j.add(b);
  return j;
}
function buildAstronaut(){
  const charRoot = new THREE.Group();
  charRoot.position.y = 0.10;

  const torso = new THREE.Group();
  torso.position.y = 1.26;
  charRoot.add(torso);
  torso.add(astroCyl(0.22, 0.27, 0.62, MAT.suitWhite));
  const chestPatch = new THREE.Mesh(new THREE.BoxGeometry(0.13,0.13,0.02), MAT.suitAccent);
  chestPatch.position.set(0.09,0.10,0.24); torso.add(chestPatch);
  const backpack = new THREE.Mesh(new THREE.BoxGeometry(0.34,0.48,0.20), MAT.suitDark);
  backpack.position.set(0,0.05,-0.25); torso.add(backpack);
  const backpackTube = astroCyl(0.03,0.03,0.30,MAT.suitDark);
  backpackTube.rotation.x = 0.5; backpackTube.position.set(0,0.32,-0.10); torso.add(backpackTube);

  // Jetpack boost flame -- reuses the same multi-layer engine-glow look as
  // the rocket's own engines, just scaled down to backpack size.
  const jetFlame = buildFlame(0.022);
  jetFlame.grp.position.set(0, -0.16, -0.25);
  jetFlame.grp.visible = false;
  jetFlame.grp.userData = { flames: [jetFlame] };
  torso.add(jetFlame.grp);

  const neckJoint = astroBone(torso, 0, 0.40, 0, 0.085, 0.09, 0.11, MAT.suitWhite);
  const headJoint = new THREE.Group();
  headJoint.position.y = 0.17;
  neckJoint.add(headJoint);

  const helmet = astroIco(0.185, MAT.suitWhite);
  helmet.scale.set(1.0, 1.06, 1.0);
  headJoint.add(helmet);
  const visor = new THREE.Mesh(new THREE.SphereGeometry(0.145,10,8), MAT.visor);
  visor.scale.set(1.0, 0.68, 0.62);
  visor.position.set(0, -0.015, 0.105);
  headJoint.add(visor);
  const antenna = astroCyl(0.008,0.008,0.14,MAT.suitDark);
  antenna.rotation.z = 0.35;
  antenna.position.set(0.11,0.19,-0.03);
  headJoint.add(antenna);

  function makeGlove(elbowJoint){
    const g = new THREE.Group(); g.position.y = -0.27; elbowJoint.add(g);
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.072, 6, 5), MAT.suitDark);
    m.scale.set(1.0, 0.62, 0.92); g.add(m);
  }
  function makeShoulderCap(shoulderJoint){
    const cap = astroIco(0.09, MAT.suitWhite);
    cap.scale.set(1.05, 0.90, 1.05); shoulderJoint.add(cap);
  }

  const lShoulder = astroBone(torso, -0.24, 0.22, 0, 0.075, 0.065, 0.30, MAT.suitWhite);
  makeShoulderCap(lShoulder);
  const lElbow = astroBone(lShoulder, 0, -0.30, 0, 0.065, 0.055, 0.27, MAT.suitWhite);
  makeGlove(lElbow);

  const rShoulder = astroBone(torso, 0.24, 0.22, 0, 0.075, 0.065, 0.30, MAT.suitWhite);
  makeShoulderCap(rShoulder);
  const rElbow = astroBone(rShoulder, 0, -0.30, 0, 0.065, 0.055, 0.27, MAT.suitWhite);
  makeGlove(rElbow);

  const hipsGrp = new THREE.Group();
  hipsGrp.position.y = -0.34;
  torso.add(hipsGrp);
  hipsGrp.add(astroCyl(0.24, 0.22, 0.19, MAT.suitWhite));

  function makeBoot(ankleJoint){
    const fg = new THREE.Group(); fg.position.y = -0.12; ankleJoint.add(fg);
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.09, 0.24), MAT.suitDark);
    m.position.set(0,-0.04,0.075); fg.add(m);
  }
  const lHip   = astroBone(hipsGrp, -0.13, -0.095, 0, 0.105, 0.09, 0.38, MAT.suitWhite);
  const lKnee  = astroBone(lHip,      0,   -0.38,  0, 0.09, 0.078, 0.35, MAT.suitWhite);
  const lAnkle = astroBone(lKnee,     0,   -0.35,  0, 0.078, 0.068, 0.12, MAT.suitWhite);
  makeBoot(lAnkle);

  const rHip   = astroBone(hipsGrp,  0.13, -0.095, 0, 0.105, 0.09, 0.38, MAT.suitWhite);
  const rKnee  = astroBone(rHip,      0,   -0.38,  0, 0.09, 0.078, 0.35, MAT.suitWhite);
  const rAnkle = astroBone(rKnee,     0,   -0.35,  0, 0.078, 0.068, 0.12, MAT.suitWhite);
  makeBoot(rAnkle);

  return { charRoot, torso, headJoint, lShoulder, rShoulder, lElbow, rElbow, hipsGrp, lHip, rHip, lKnee, rKnee, lAnkle, rAnkle, jetFlame };
}

/* ---------- particle puffs (smoke / fire / dust) ---------- */
const puffGeo = new THREE.SphereGeometry(1,8,6);
const activePuffs = [];
function spawnPuff(pos, opts, targetGroup){
  const target = targetGroup || launchScene;
  const mat = new THREE.MeshStandardMaterial({
    color: opts.color, flatShading:false, roughness:1, transparent:true,
    opacity: opts.opacity ?? 0.85,
    emissive: opts.emissive ?? 0x000000,
    emissiveIntensity: opts.emissiveIntensity ?? 0,
  });
  const mesh = new THREE.Mesh(puffGeo, mat);
  mesh.position.copy(pos);
  const scale0 = opts.scale0 ?? 1.2;
  mesh.scale.setScalar(scale0);
  mesh.userData = {
    vel: opts.vel.clone(),
    growth: opts.growth ?? 6,
    life: 0, maxLife: opts.maxLife ?? 3.2,
    fadeFrom: opts.fadeFrom ?? 0.6,
    drag: opts.drag ?? 0.94,
    maxScale: opts.maxScale ?? 40,
  };
  target.add(mesh);
  activePuffs.push(mesh);
}
// Bright, additive-blended burst particle (same look as the main engine
// flames' MeshBasicMaterial+toneMapped:false treatment) instead of the
// matte MeshStandardMaterial smoke/dust puffs above -- for short-lived fire
// effects like the RCS thrusters rather than billowing smoke.
function spawnFlamePuff(pos, opts, targetGroup){
  const target = targetGroup || launchScene;
  const mat = new THREE.MeshBasicMaterial({
    color: opts.color, transparent:true, opacity: opts.opacity ?? 0.9,
    blending: THREE.AdditiveBlending, toneMapped:false,
  });
  const mesh = new THREE.Mesh(puffGeo, mat);
  mesh.position.copy(pos);
  const scale0 = opts.scale0 ?? 1.0;
  mesh.scale.setScalar(scale0);
  mesh.userData = {
    vel: opts.vel.clone(),
    growth: opts.growth ?? 2,
    life: 0, maxLife: opts.maxLife ?? 0.3,
    fadeFrom: opts.fadeFrom ?? 0.1,
    drag: opts.drag ?? 0.85,
    maxScale: opts.maxScale ?? 2,
  };
  target.add(mesh);
  activePuffs.push(mesh);
}
function updatePuffs(dt){
  for(let i=activePuffs.length-1;i>=0;i--){
    const p = activePuffs[i], d = p.userData;
    d.life += dt;
    p.position.addScaledVector(d.vel, dt);
    d.vel.multiplyScalar(d.drag);
    const grown = p.scale.x + d.growth*dt;
    p.scale.setScalar(Math.min(grown, d.maxScale));
    const lt = d.life/d.maxLife;
    p.material.opacity = lt < d.fadeFrom ? p.material.opacity : Math.max(0, p.material.opacity - dt*1.4);
    if (d.life > d.maxLife || p.material.opacity<=0.01){
      if (p.parent) p.parent.remove(p);
      p.material.dispose();
      activePuffs.splice(i,1);
    }
  }
}

let groundDustAccum = 0;
function spawnGroundDust(dt, x, z, groundY, strength, big){
  if (strength <= 0.02){ groundDustAccum = 0; return; }
  groundDustAccum += dt;
  const rate = big ? 10 : 5;
  const interval = 1/(rate*strength + 0.5);
  while (groundDustAccum > interval){
    groundDustAccum -= interval;
    const spread = big ? 1.2 : 0.35;
    spawnPuff(new THREE.Vector3(x+rand(-spread,spread), groundY+0.1, z+rand(-spread,spread)), {
      color: 0xb9ad95, opacity: rand(0.3,0.5) * (big?1.1:1),
      vel: new THREE.Vector3(rand(-1,1)*(big?3:1), rand(0.6,1.6)*(big?1.6:1), rand(-1,1)*(big?3:1)),
      growth: rand(1,1.8)*(big?1.8:1), maxLife: rand(0.5,0.9), scale0: rand(0.2,0.4)*(big?2:1),
      fadeFrom: 0.3, drag: 0.9, maxScale: big ? 3.4 : 1.4,
    }, moonScene);
  }
}

const crystalCountEl = document.getElementById('crystalCount');
function updateCrystals(dt, tt, px, pz){
  for (const c of crystals){
    if (c.collected) continue;
    c.group.rotation.y += dt*0.8;
    c.group.position.y = getMoonSurfaceY(c.x,c.z) + 1.4 + Math.sin(tt*1.6 + c.x)*0.15;
    const dd = Math.hypot(px-c.x, pz-c.z);
    if (dd < 3.0){
      c.collected = true;
      c.group.visible = false;
      crystalsCollected++;
      crystalCountEl.textContent = `${crystalsCollected} / ${CRYSTAL_COUNT}`;
      playCollectChime();
      spawnPuff(new THREE.Vector3(c.x, c.group.position.y, c.z), {
        color: 0xc07bff, opacity: 0.9, emissive: 0xc07bff, emissiveIntensity: 1.2,
        vel: new THREE.Vector3(0,3,0), growth: 8, maxLife: 0.5, scale0: 0.3,
        fadeFrom: 0.2, drag: 0.9, maxScale: 3,
      }, moonScene);
    }
  }
}

/* ---------- audio: procedural sound effects (Web Audio API, no external assets) ---------- */
let audioCtx = null;
let masterGain = null;
function ensureAudio(){
  if (!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    audioCtx = new Ctx();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 1;
    const compressor = audioCtx.createDynamicsCompressor();
    masterGain.connect(compressor);
    compressor.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq, dur, type, gainPeak, when){
  const ctx = ensureAudio();
  if (!ctx) return;
  const t0 = ctx.currentTime + (when||0);
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.linearRampToValueAtTime(gainPeak, t0+0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(gain); gain.connect(masterGain);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function playNoiseBurst(dur, gainPeak, filterFreq){
  const ctx = ensureAudio();
  if (!ctx) return;
  const n = Math.max(1, Math.floor(ctx.sampleRate*dur));
  const buffer = ctx.createBuffer(1, n, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i=0;i<n;i++) data[i] = (Math.random()*2-1) * (1 - i/n);
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.value = filterFreq || 1200;
  const gain = ctx.createGain();
  gain.gain.value = gainPeak;
  src.connect(filter); filter.connect(gain); gain.connect(masterGain);
  src.start();
}

function playJetBoost(){
  playNoiseBurst(0.5, 0.22, 2200);

  if (!ctx) return;
  const t0 = ctx.currentTime;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(160, t0);
  osc.frequency.exponentialRampToValueAtTime(420, t0+0.45);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.linearRampToValueAtTime(0.22, t0+0.05);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.5);
  osc.connect(gain); gain.connect(masterGain);

// Driving no longer has an engine hum -- just a sparse, quiet crackle

function updateEngineSound(dt, speedRatio){

// Rocket launch rumble: two detuned low sawtooths pushed through a slow LFO
// for a "grumble" texture, plus a one-shot ignition crack -- there was no
// audio at all for launch before this, only a camera shake.
let rumbleNodes = null;
function startLaunchRumble(){
  const ctx = ensureAudio();
  if (!ctx || rumbleNodes) return;
  const osc1 = ctx.createOscillator(); osc1.type = 'sawtooth'; osc1.frequency.value = 45;
  const osc2 = ctx.createOscillator(); osc2.type = 'sawtooth'; osc2.frequency.value = 62;
  const lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 5.5;
  const lfoGain = ctx.createGain(); lfoGain.gain.value = 18;
  lfo.connect(lfoGain); lfoGain.connect(osc1.frequency); lfoGain.connect(osc2.frequency);
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.value = 150;
  const gain = ctx.createGain();
  gain.gain.value = 0.0001;
  osc1.connect(filter); osc2.connect(filter); filter.connect(gain); gain.connect(masterGain);
  osc1.start(); osc2.start(); lfo.start();
  rumbleNodes = { osc1, osc2, lfo, filter, gain };
}
function updateLaunchRumble(intensity){
  if (!rumbleNodes) return;
  const ctx = ensureAudio();
  rumbleNodes.gain.gain.linearRampToValueAtTime(0.05 + intensity*0.22, ctx.currentTime+0.08);
  rumbleNodes.filter.frequency.value = 150 + intensity*300;
}
function stopLaunchRumble(){
  if (!rumbleNodes) return;
  const ctx = ensureAudio();
  rumbleNodes.gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+1.2);
  const nodes = rumbleNodes;
  rumbleNodes = null;
  setTimeout(() => { nodes.osc1.stop(); nodes.osc2.stop(); nodes.lfo.stop(); }, 1300);
}

// Faint, unobtrusive atmospheric drone -- started once gameplay begins and
// left running (root/fifth/octave sines, each independently detuned for slow
// movement) at a deliberately low target gain.
let ambientNodes = null;
function startAmbientMusic(){
  const ctx = ensureAudio();
  if (!ctx || ambientNodes) return;
  const freqs = [55, 82.5, 110];
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.value = 500;
  const master = ctx.createGain();
  master.gain.value = 0.0001;
  filter.connect(master); master.connect(masterGain);
  const oscs = [];
  freqs.forEach((f,i) => {
    const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = f;
    const detune = ctx.createOscillator(); detune.type = 'sine'; detune.frequency.value = 0.05 + i*0.02;
    const detuneGain = ctx.createGain(); detuneGain.gain.value = 2.5;
    detune.connect(detuneGain); detuneGain.connect(osc.detune);
    const g = ctx.createGain(); g.gain.value = 0.28/(i+1);
    osc.connect(g); g.connect(filter);
    osc.start(); detune.start();
    oscs.push(osc, detune);
  });
  master.gain.linearRampToValueAtTime(0.035, ctx.currentTime+3.0);
  ambientNodes = { oscs, master, filter };
}

  const offsets = shipPart.userData.rcsOffsets;
  // Randomized, but never the same nozzle twice in a row -- reads as the
  // thrusters taking turns firing instead of one flickering repeatedly
  // while its neighbors stay dark.
  let idx = Math.floor(Math.random()*offsets.length);
  if (offsets.length > 1 && idx === rcsLastIdx) idx = (idx+1) % offsets.length;
  rcsLastIdx = idx;
  const off = offsets[idx];
  const local = new THREE.Vector3(off[0], off[1], off[2]);
  const worldPos = shipPart.localToWorld(local.clone());
  const outDir = new THREE.Vector3(off[0], 0, off[2]).normalize();
  for(let i=0;i<4;i++){
    spawnFlamePuff(worldPos.clone().addScaledVector(outDir, i*0.35), {
      color: RCS_FLAME_COLORS[Math.min(i, RCS_FLAME_COLORS.length-1)],

// A billboarded moon, fixed in the launch sky, visible once the sky has
// darkened. The late-ascent camera (below) holds framing on it instead of
// endlessly chasing the ship upward, so the still-climbing upper stage
// visibly flies up out of frame past it rather than the camera keeping it
// perfectly centered forever.
function buildLaunchMoonSprite(){
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(size/2,size/2,0, size/2,size/2,size/2);
  grad.addColorStop(0, 'rgba(230,228,222,1)');
  grad.addColorStop(0.75, 'rgba(190,188,182,1)');
  grad.addColorStop(0.92, 'rgba(150,148,144,0.9)');
  grad.addColorStop(1, 'rgba(150,148,144,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(size/2,size/2,size/2,0,Math.PI*2); ctx.fill();
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent:true, depthWrite:false, toneMapped:false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(90,90,1);
  return sprite;
}
const launchMoon = buildLaunchMoonSprite();
launchMoon.position.set(PAD_X - 150, 520, -350);

const HOLD_CAM_Y = 340;

function updateCameraLaunch(altitude, tt){
  const targetY = 70 + altitude;
  camState.y = lerp(camState.y, targetY, 0.06);
  let shakeX=0, shakeY=0;
  if (tt > T_IGNITE-0.4 && tt < T_LIFTOFF+1.2){
    const amt = smoothstep(T_IGNITE-0.4,T_IGNITE+0.4,tt) * (1-smoothstep(T_LIFTOFF+0.4,T_LIFTOFF+1.2,tt));
    shakeX = Math.sin(tt*47)*amt*1.4;
    shakeY = Math.cos(tt*53)*amt*1.1;
  }
  // In the final stretch before the cut to black, stop chasing the ship's
  // rise and hold on the moon instead -- the ship keeps climbing at full
  // thrust and visibly flies up out of frame past it.
  const holdBlend = smoothstep(T_BLACK-10, T_BLACK-3, tt);
  const camY = lerp(camState.y, HOLD_CAM_Y, holdBlend);
  const lookX = lerp(PAD_X, launchMoon.position.x, holdBlend);
  const lookY = lerp(camState.y-5, launchMoon.position.y, holdBlend);
  const lookZ = lerp(0, launchMoon.position.z, holdBlend);
  camera.position.set(215+shakeX, camY+shakeY, 265);
  camera.lookAt(lookX, lookY, lookZ);
}

function setJoyFromPoint(clientX, clientY){
  const rect = joyEl.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  let dx = clientX-cx, dy = clientY-cy;
  const dist = Math.hypot(dx,dy);
  if (dist > JOY_RADIUS){ dx = dx/dist*JOY_RADIUS; dy = dy/dist*JOY_RADIUS; }
  knobEl.style.transform = `translate(${dx}px, ${dy}px)`;
  touchMove.left    = Math.max(0, -dx/JOY_RADIUS);
  touchMove.right   = Math.max(0,  dx/JOY_RADIUS);
  touchMove.forward = Math.max(0, -dy/JOY_RADIUS);
  touchMove.back    = Math.max(0,  dy/JOY_RADIUS);
}

  knobEl.style.transform = '';

  joyPointerId = null;

const fsBtn = document.getElementById('fullscreenBtn');
function isFullscreen(){ return !!document.fullscreenElement; }
// Forces any lingering pinch/double-tap browser zoom back to 1.0 -- rewriting
// the viewport meta tag to the SAME value is a no-op, so this briefly swaps
// it to a plain value and restores the original on the next frame, which is
// enough to make mobile Safari snap the effective zoom back to normal.
function resetZoom(){
  const meta = document.querySelector('meta[name="viewport"]');
  if (meta){
    const original = meta.getAttribute('content');
    meta.setAttribute('content', 'width=device-width, initial-scale=1.0');
    requestAnimationFrame(() => {
      meta.setAttribute('content', original);
      scheduleResize();
    });
  }
  window.scrollTo(0, 0);
}
function toggleFullscreen(){
  resetZoom();
  ensureAudio();
  if (!isFullscreen()) document.documentElement.requestFullscreen?.().catch(() => {});
  else document.exitFullscreen?.();
}
if (!document.documentElement.requestFullscreen){
  fsBtn.style.display = 'none';
} else {
  fsBtn.addEventListener('click', toggleFullscreen);
  document.addEventListener('fullscreenchange', () => fsBtn.classList.toggle('on', isFullscreen()));
}

let captionTimer = null;
function showSpeechCaption(text){
  speechCaptionEl.textContent = text;
  speechCaptionEl.classList.add('show');

const tapRaycaster = new THREE.Raycaster();
function handleWorldTap(clientX, clientY){
  if (!gameMode) return;
  const rect = renderer.domElement.getBoundingClientRect();
  const ndcX = ((clientX - rect.left) / rect.width) * 2 - 1;
  const ndcY = -((clientY - rect.top) / rect.height) * 2 + 1;
  tapRaycaster.setFromCamera({ x: ndcX, y: ndcY }, camera);
  const hits = tapRaycaster.intersectObjects(moonScene.children, true);
  for (const hit of hits){
    let obj = hit.object;
    while (obj){
      const label = obj.userData && obj.userData.tapLabel;
      if (label){
        const lines = TAP_LINES[label];
        if (lines) showSpeechCaption(lines[Math.floor(Math.random()*lines.length)]);
        return;
      }
      obj = obj.parent;
    }
  }
}

if (isMobile){
  let lookPointerId = null, lookLastX = 0, lookLastY = 0, lookDragDist = 0;
  renderer.domElement.addEventListener('pointerdown', e => {
    lookPointerId = e.pointerId;
    lookLastX = e.clientX; lookLastY = e.clientY;
    lookDragDist = 0;
    renderer.domElement.setPointerCapture(e.pointerId);
  });
  renderer.domElement.addEventListener('pointermove', e => {
    if (lookPointerId !== e.pointerId) return;
    const dx = e.clientX - lookLastX, dy = e.clientY - lookLastY;
    lookLastX = e.clientX; lookLastY = e.clientY;
    lookDragDist += Math.hypot(dx,dy);
    camYawOffset -= dx * 0.006;
    camPitchOffset = clamp(camPitchOffset + dy * 0.004, -0.5, 0.5);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(evt => {
    renderer.domElement.addEventListener(evt, e => {
      if (lookPointerId !== e.pointerId) return;
      // Barely-moved pointer-up reads as a tap on an object, not a look-drag.
      if (evt === 'pointerup' && lookDragDist < 12) handleWorldTap(e.clientX, e.clientY);
      lookPointerId = null;
    });
  });
}

/* ---------- minimap (ported concept from dhl-city/index.html drawMM) ---------- */
const mmCanvas = document.getElementById('minimap');
const mmCtx = mmCanvas.getContext('2d');
const STATION_MARK = { x:-95, z:-55 };
function drawMinimap(px, pz, pAngle){
  const w = mmCanvas.width, h = mmCanvas.height, cx = w/2, cy = h/2, sc = w/700;
  mmCtx.clearRect(0,0,w,h);
  mmCtx.save();
  mmCtx.beginPath(); mmCtx.arc(cx,cy,cx-1,0,Math.PI*2); mmCtx.clip();
  mmCtx.fillStyle = 'rgba(10,12,20,0.55)'; mmCtx.fillRect(0,0,w,h);
  mmCtx.translate(cx,cy);
  mmCtx.rotate(pAngle);
  const mx = x => -(x-px)*sc, mz = z => -(z-pz)*sc;
  mmCtx.fillStyle = '#8fd0ff';
  mmCtx.beginPath(); mmCtx.arc(mx(PAD_X), mz(0), 5, 0, Math.PI*2); mmCtx.fill();
  mmCtx.fillStyle = '#c9a6ff';
  mmCtx.beginPath(); mmCtx.arc(mx(STATION_MARK.x), mz(STATION_MARK.z), 4, 0, Math.PI*2); mmCtx.fill();
  if (!inVehicle){
    mmCtx.fillStyle = '#ffcc55';
    mmCtx.beginPath(); mmCtx.arc(mx(roverX), mz(roverZ), 4, 0, Math.PI*2); mmCtx.fill();
  }
  if (!inBigRig){
    mmCtx.fillStyle = '#8fffb0';
    mmCtx.beginPath(); mmCtx.arc(mx(bigRigX), mz(bigRigZ), 5, 0, Math.PI*2); mmCtx.fill();
  }
  mmCtx.fillStyle = '#c07bff';
  for (const c of crystals){
    if (c.collected) continue;
    mmCtx.beginPath(); mmCtx.arc(mx(c.x), mz(c.z), 3, 0, Math.PI*2); mmCtx.fill();
  }
  mmCtx.restore();
  mmCtx.save();
  mmCtx.translate(cx,cy);
  mmCtx.fillStyle = inVehicle ? '#ffcc55' : inBigRig ? '#8fffb0' : '#ffffff';
  mmCtx.beginPath(); mmCtx.moveTo(0,-7); mmCtx.lineTo(-5,6); mmCtx.lineTo(0,3); mmCtx.lineTo(5,6); mmCtx.closePath(); mmCtx.fill();
  mmCtx.restore();
}

/* ---------- astronaut animation (ported from dhl-city/character.html) ---------- */
let animT = 0, charYaw = 0;
let headYawTgt = 0;
const JWALK = { NONE:0, WINDUP:1, AIR:2, LAND:3 };
const WINDUP_DUR = 0.22, LAND_DUR = 0.30;
let jumpState = JWALK.NONE, jumpTimer = 0;
let stepSign = 0;

function animateAstronaut(dt, reachStone){
  const A = astro;
  const moving = (curInput.fwd > 0.02 || curInput.back > 0.02) && jumpState === JWALK.NONE;
  if (moving) animT += dt * 7.6;
  const s = Math.sin(animT);
  const eff = moving ? 1.0 : 0.0;
  const lLeg =  s * 0.68, rLeg = -s * 0.68;

  if (moving && onGround){
    const sign = s > 0.02 ? 1 : (s < -0.02 ? -1 : 0);
    if (sign !== 0 && stepSign !== 0 && sign !== stepSign) playStep();
    if (sign !== 0) stepSign = sign;
  } else {
    stepSign = 0;
  }

  // Only turns arms/head toward a stone within immediate pickup range --
  // reachStone is already null unless the player is that close.
  let stoneRelAngle = 0;
  const reaching = reachStone && onGround && jumpState === JWALK.NONE;
  if (reaching){
    const dx = reachStone.x - A.charRoot.position.x, dz = reachStone.z - A.charRoot.position.z;
    stoneRelAngle = Math.atan2(dx, dz) - charYaw;
    while (stoneRelAngle >  Math.PI) stoneRelAngle -= Math.PI*2;
    while (stoneRelAngle < -Math.PI) stoneRelAngle += Math.PI*2;
    stoneRelAngle = clamp(stoneRelAngle, -0.85, 0.85);
  }

  // On mobile, dragging to look also turns the head to visually match --
  // camYawOffset/camPitchOffset are 0 whenever there's no active drag, so
  // this is a no-op on desktop and whenever the player isn't looking around.
  headYawTgt = (reaching ? stoneRelAngle*0.7 : (curInput.left - curInput.right) * 0.38) + camYawOffset*0.6;
  A.headJoint.rotation.y = lerp(A.headJoint.rotation.y, clamp(headYawTgt, -1.1, 1.1), 0.06);

  if (jumpState === JWALK.WINDUP){
    const tt = Math.min(jumpTimer / WINDUP_DUR, 1.0);
    const sq = Math.sin(tt * Math.PI * 0.5);
    A.lHip.rotation.x = lerp(A.lHip.rotation.x, 0.52*sq, 0.32);
    A.rHip.rotation.x = lerp(A.rHip.rotation.x, 0.52*sq, 0.32);
    A.lKnee.rotation.x = lerp(A.lKnee.rotation.x, 0.78*sq, 0.32);
    A.rKnee.rotation.x = lerp(A.rKnee.rotation.x, 0.78*sq, 0.32);
    A.lAnkle.rotation.x = lerp(A.lAnkle.rotation.x, 0.20*sq, 0.32);
    A.rAnkle.rotation.x = lerp(A.rAnkle.rotation.x, 0.20*sq, 0.32);
    A.lShoulder.rotation.x = lerp(A.lShoulder.rotation.x, 0.32*sq, 0.25);
    A.rShoulder.rotation.x = lerp(A.rShoulder.rotation.x, 0.32*sq, 0.25);
    A.lElbow.rotation.x = lerp(A.lElbow.rotation.x, -0.55, 0.22);
    A.rElbow.rotation.x = lerp(A.rElbow.rotation.x, -0.55, 0.22);
    A.lShoulder.rotation.z = lerp(A.lShoulder.rotation.z, -0.10, 0.08);
    A.rShoulder.rotation.z = lerp(A.rShoulder.rotation.z,  0.10, 0.08);
    A.torso.position.y = lerp(A.torso.position.y, 1.26 - 0.14*sq, 0.32);
    A.torso.rotation.x = lerp(A.torso.rotation.x, -0.20*sq, 0.25);
    A.torso.rotation.y = 0;
    A.headJoint.rotation.x = lerp(A.headJoint.rotation.x, 0.10*sq, 0.20);
  } else if (jumpState === JWALK.AIR){
    A.lHip.rotation.x = lerp(A.lHip.rotation.x, -0.70, 0.17);
    A.rHip.rotation.x = lerp(A.rHip.rotation.x, -0.70, 0.17);
    A.lKnee.rotation.x = lerp(A.lKnee.rotation.x, 1.45, 0.17);
    A.rKnee.rotation.x = lerp(A.rKnee.rotation.x, 1.45, 0.17);
    A.lAnkle.rotation.x = lerp(A.lAnkle.rotation.x, -0.45, 0.17);
    A.rAnkle.rotation.x = lerp(A.rAnkle.rotation.x, -0.45, 0.17);
    A.lShoulder.rotation.x = lerp(A.lShoulder.rotation.x, -0.52, 0.14);
    A.rShoulder.rotation.x = lerp(A.rShoulder.rotation.x, -0.52, 0.14);
    A.lShoulder.rotation.z = lerp(A.lShoulder.rotation.z, -0.48, 0.10);
    A.rShoulder.rotation.z = lerp(A.rShoulder.rotation.z,  0.48, 0.10);
    A.lElbow.rotation.x = lerp(A.lElbow.rotation.x, -0.95, 0.15);
    A.rElbow.rotation.x = lerp(A.rElbow.rotation.x, -0.95, 0.15);
    A.torso.position.y = lerp(A.torso.position.y, 1.26, 0.15);
    A.torso.rotation.x = lerp(A.torso.rotation.x, 0.0, 0.10);
    A.torso.rotation.y = 0;
    A.headJoint.rotation.x = lerp(A.headJoint.rotation.x, 0.32, 0.14);
  } else if (jumpState === JWALK.LAND){
    const tt = Math.min(jumpTimer / LAND_DUR, 1.0);
    const sq = 1.0 - tt;
    A.lHip.rotation.x = lerp(A.lHip.rotation.x, 0.72*sq, 0.32);
    A.rHip.rotation.x = lerp(A.rHip.rotation.x, 0.72*sq, 0.32);
    A.lKnee.rotation.x = lerp(A.lKnee.rotation.x, 1.10*sq, 0.32);
    A.rKnee.rotation.x = lerp(A.rKnee.rotation.x, 1.10*sq, 0.32);
    A.lAnkle.rotation.x = lerp(A.lAnkle.rotation.x, 0.22*sq, 0.32);
    A.rAnkle.rotation.x = lerp(A.rAnkle.rotation.x, 0.22*sq, 0.32);
    A.lShoulder.rotation.x = lerp(A.lShoulder.rotation.x, 0.22*sq, 0.25);
    A.rShoulder.rotation.x = lerp(A.rShoulder.rotation.x, 0.22*sq, 0.25);
    A.lShoulder.rotation.z = lerp(A.lShoulder.rotation.z, -0.09, 0.08);
    A.rShoulder.rotation.z = lerp(A.rShoulder.rotation.z,  0.09, 0.08);
    A.lElbow.rotation.x = lerp(A.lElbow.rotation.x, -0.55*sq - 0.12, 0.25);
    A.rElbow.rotation.x = lerp(A.rElbow.rotation.x, -0.55*sq - 0.12, 0.25);
    A.torso.position.y = lerp(A.torso.position.y, 1.26 - 0.22*sq, 0.32);
    A.torso.rotation.x = lerp(A.torso.rotation.x, 0.0, 0.10);
    A.torso.rotation.y = 0;
    A.headJoint.rotation.x = lerp(A.headJoint.rotation.x, 0.0, 0.15);
  } else {
    if (heldRock){
      // Both hands are occupied cradling the carried stone -- hold a fixed
      // pose instead of the normal walk-swing, arms don't move while walking.
      A.rShoulder.rotation.x = lerp(A.rShoulder.rotation.x, -0.95, 0.20);
      A.rShoulder.rotation.z = lerp(A.rShoulder.rotation.z, 0.16, 0.15);
      A.rElbow.rotation.x = lerp(A.rElbow.rotation.x, -1.75, 0.20);
      A.lShoulder.rotation.x = lerp(A.lShoulder.rotation.x, -0.95, 0.20);
      A.lShoulder.rotation.z = lerp(A.lShoulder.rotation.z, -0.16, 0.15);
      A.lElbow.rotation.x = lerp(A.lElbow.rotation.x, -1.75, 0.20);
    } else if (reaching){
      // A liftable stone is within immediate pickup range -- reach both
      // arms toward it instead of swinging them through the walk cycle.
      A.rShoulder.rotation.x = lerp(A.rShoulder.rotation.x, -1.05, 0.18);
      A.rShoulder.rotation.z = lerp(A.rShoulder.rotation.z, 0.18 - stoneRelAngle*0.3, 0.15);
      A.rElbow.rotation.x = lerp(A.rElbow.rotation.x, -0.35, 0.18);
      A.lShoulder.rotation.x = lerp(A.lShoulder.rotation.x, -1.05, 0.18);
      A.lShoulder.rotation.z = lerp(A.lShoulder.rotation.z, -0.18 - stoneRelAngle*0.3, 0.15);
      A.lElbow.rotation.x = lerp(A.lElbow.rotation.x, -0.35, 0.18);
    } else {
      A.rShoulder.rotation.x = lerp(A.rShoulder.rotation.x, -rLeg*0.68*eff, 0.30);
      A.rShoulder.rotation.z = lerp(A.rShoulder.rotation.z,  0.09, 0.08);
      A.rElbow.rotation.x = lerp(A.rElbow.rotation.x, moving ? -1.22 : -0.12, 0.20);
      A.lShoulder.rotation.x = lerp(A.lShoulder.rotation.x, -lLeg*0.68*eff, 0.30);
      A.lShoulder.rotation.z = lerp(A.lShoulder.rotation.z, -0.09, 0.08);
      A.lElbow.rotation.x = lerp(A.lElbow.rotation.x, moving ? -1.22 : -0.12, 0.20);
    }
    const tc = 0.30;
    A.lHip.rotation.x = lerp(A.lHip.rotation.x, lLeg*0.88*eff, tc);
    A.rHip.rotation.x = lerp(A.rHip.rotation.x, rLeg*0.88*eff, tc);
    // Slightly more knee "give" (spring) than a straight-legged walk, without
    // touching the hip swing amplitude above (range of motion stays the same).
    const lKT = (Math.max(0, lLeg)*1.08 + Math.max(0,-lLeg)*0.78) * eff;
    const rKT = (Math.max(0, rLeg)*1.08 + Math.max(0,-rLeg)*0.78) * eff;
    A.lKnee.rotation.x = lerp(A.lKnee.rotation.x, lKT, tc);
    A.rKnee.rotation.x = lerp(A.rKnee.rotation.x, rKT, tc);
    A.lAnkle.rotation.x = lerp(A.lAnkle.rotation.x, -lLeg*0.38*eff, tc);
    A.rAnkle.rotation.x = lerp(A.rAnkle.rotation.x, -rLeg*0.38*eff, tc);
    A.torso.rotation.y = lerp(A.torso.rotation.y, reaching ? stoneRelAngle*0.5 : s*0.13*eff, 0.18);
    A.torso.rotation.x = lerp(A.torso.rotation.x, moving ? -0.10 : 0.0, 0.07);
    A.torso.rotation.z = lerp(A.torso.rotation.z, Math.cos(animT)*0.042*eff, 0.20);
    A.torso.position.y = lerp(A.torso.position.y, 1.26 + (moving ? Math.abs(s)*0.20 : 0), 0.28);
    A.headJoint.rotation.x = lerp(A.headJoint.rotation.x, (moving ? Math.abs(s)*(-0.07) : 0) - camPitchOffset*0.8, 0.18);
    A.headJoint.rotation.z = lerp(A.headJoint.rotation.z, 0, 0.10);
  }
}

/* ---------- action button: pick up / carry / drop a rock ---------- */
const PICKUP_RADIUS = 3.5;
let heldRock = null;

function dropHeldRock(){
  if (!heldRock) return;
  const fwdX = Math.sin(charYaw), fwdZ = Math.cos(charYaw);
  const dropDist = 1.6;
  const dx = astro.charRoot.position.x + fwdX*dropDist;
  const dz = astro.charRoot.position.z + fwdZ*dropDist;
  const gy = getMoonSurfaceY(dx,dz);
  heldRock.x = dx; heldRock.z = dz;
  heldRock.mesh.position.set(dx, gy+heldRock.embed, dz);
  heldRock.mesh.rotation.set(rand(0,6),rand(0,6),rand(0,6));
  heldRock.held = false;
  heldRock = null;
  actionEl.classList.remove('holding');
}
function nearestLiftableStone(px, pz, radius){
  radius = radius === undefined ? PICKUP_RADIUS : radius;
  let best = null, bestD = Infinity;
  for (const rk of pickupStones){
    if (rk.held || rk.popped) continue;
    const dd = Math.hypot(px-rk.x, pz-rk.z);
    if (dd < radius && dd < bestD){ bestD = dd; best = rk; }
  }
  return best;
}
function pickUpNearestRock(){
  if (heldRock) return;
  const best = nearestLiftableStone(astro.charRoot.position.x, astro.charRoot.position.z);
  if (best){ best.held = true; heldRock = best; actionEl.classList.add('holding'); }
}

// Driving over a small stone crushes it -- a burst of grey shard-like puffs
// plus a sharp crunch, then the stone is gone for good (same permanence as
// a collected crystal).
function popStonesNear(x, z, radius){
  for (const rk of pickupStones){
    if (rk.held || rk.popped) continue;
    if (Math.hypot(x-rk.x, z-rk.z) >= radius) continue;
    rk.popped = true;
    rk.mesh.visible = false;
    spawnPuff(new THREE.Vector3(rk.mesh.position.x, rk.mesh.position.y+0.2, rk.mesh.position.z), {
      color: 0x9a9a9a, opacity: 0.9,
      vel: new THREE.Vector3(rand(-3,3), rand(1,3), rand(-3,3)), growth: 4, maxLife: 0.4, scale0: 0.5,
      fadeFrom: 0.15, drag: 0.88, maxScale: 1.8,
    }, moonScene);
    playNoiseBurst(0.08, 0.22, 500);
  }
}

/* ---------- big rig cargo arm: hatch + claw deploy as soon as the driver
   gets in and stay out for the whole drive (not just during a grab), and
   stow again on exit. The action button drives a further reach-and-back
   "grab" motion layered on top of that deployed idle pose. ---------- */
const BIGRIG_ARM_GRAB_RADIUS = 7;
const BIGRIG_DEPLOY_DUR = 0.35;
const BIGRIG_ARM_DUR = 0.9;
const ARM_SHOULDER_STOWED = -2.3, ARM_SHOULDER_DEPLOYED = -1.2, ARM_SHOULDER_REACH = -0.5;
const ARM_ELBOW_STOWED = 1.9, ARM_ELBOW_DEPLOYED = 1.0, ARM_ELBOW_REACH = 0.3;
const HATCH_CLOSED = 0, HATCH_OPEN = -1.35;
let bigRigDeployT = 0;
let bigRigArmActive = false, bigRigArmT = 0, bigRigArmDir = 1, bigRigArmStone = null;
function bigRigArmPoint(){
  // World position of the hatch/claw's stowed anchor -- where the arm
  // reaches from and the grab/search radius is centered on.
  const local = new THREE.Vector3(4.6, 3.3, -8.5);
  bigRig.localToWorld(local);
  return local;
}
function triggerBigRigArm(){
  if (bigRigArmActive || bigRigDeployT < 0.999) return; // wait for the arm to finish deploying first
  if (heldRock){
    bigRigArmStone = heldRock;
    bigRigArmDir = -1; // release -> place back on the ground
  } else {
    const p = bigRigArmPoint();
    const target = nearestLiftableStone(p.x, p.z, BIGRIG_ARM_GRAB_RADIUS);
    if (!target) return; // nothing in reach -- silent no-op, matching on-foot pickup
    bigRigArmStone = target;
    bigRigArmDir = 1; // grab -> pull a stone in
  }
  bigRigArmActive = true;
  bigRigArmT = 0;
}
function updateBigRigArm(dt){
  const U = bigRig.userData;
  if (!U || !U.hatchPivot) return; // called every frame regardless of mode; no-op before the rig exists

  const deployTarget = inBigRig ? 1 : 0;
  bigRigDeployT = clamp(bigRigDeployT + Math.sign(deployTarget-bigRigDeployT)*dt/BIGRIG_DEPLOY_DUR, 0, 1);

  // Reach "bump" -- 0 at rest (deployed idle pose), peaks at 1 mid-grab,
  // back to 0 once the motion completes, instead of returning all the way
  // to fully stowed between grabs.
  let reachAmount = 0;
  if (bigRigArmActive){
    bigRigArmT += dt / BIGRIG_ARM_DUR;
    const t = Math.min(bigRigArmT, 1);
    reachAmount = Math.sin(Math.min(t,1) * Math.PI);

    if (bigRigArmStone){
      if (bigRigArmDir === 1 && t >= 0.5 && bigRigArmStone.mesh.parent !== U.clawGroup){
        // Snap to the claw's tip before attaching -- the stone's actual
        // ground spot rarely lines up exactly with the reach pose, and this
        // reads as the claw closing on it rather than an odd mid-air jump.
        const clawTip = new THREE.Vector3();
        U.clawGroup.getWorldPosition(clawTip);
        bigRigArmStone.mesh.position.copy(clawTip);
        U.clawGroup.attach(bigRigArmStone.mesh);
        bigRigArmStone.held = true;
        heldRock = bigRigArmStone;
        actionEl.classList.add('holding');
      } else if (bigRigArmDir === -1 && t < 0.5 && bigRigArmStone.mesh.parent !== U.clawGroup){
        U.clawGroup.attach(bigRigArmStone.mesh);
      } else if (bigRigArmDir === -1 && t >= 0.5 && bigRigArmStone.mesh.parent === U.clawGroup){
        moonScene.attach(bigRigArmStone.mesh);
        const gy = getMoonSurfaceY(bigRigArmStone.mesh.position.x, bigRigArmStone.mesh.position.z);
        bigRigArmStone.x = bigRigArmStone.mesh.position.x;
        bigRigArmStone.z = bigRigArmStone.mesh.position.z;
        bigRigArmStone.mesh.position.y = gy + bigRigArmStone.embed;
        bigRigArmStone.held = false;
        heldRock = null;
        actionEl.classList.remove('holding');
      }
    }

    if (bigRigArmT >= 1){
      bigRigArmActive = false;
      bigRigArmStone = null;
    }
  }

  U.hatchPivot.rotation.y = lerp(HATCH_CLOSED, HATCH_OPEN, bigRigDeployT);
  U.armShoulder.rotation.x = lerp(lerp(ARM_SHOULDER_STOWED, ARM_SHOULDER_DEPLOYED, bigRigDeployT), ARM_SHOULDER_REACH, reachAmount);
  U.armElbow.rotation.x = lerp(lerp(ARM_ELBOW_STOWED, ARM_ELBOW_DEPLOYED, bigRigDeployT), ARM_ELBOW_REACH, reachAmount);
}

function poseAstronautSeated(k){
  const A = astro;
  A.lHip.rotation.x = lerp(A.lHip.rotation.x, -1.35, k);
  A.rHip.rotation.x = lerp(A.rHip.rotation.x, -1.35, k);
  A.lKnee.rotation.x = lerp(A.lKnee.rotation.x, 1.6, k);
  A.rKnee.rotation.x = lerp(A.rKnee.rotation.x, 1.6, k);
  A.lAnkle.rotation.x = lerp(A.lAnkle.rotation.x, 0.35, k);
  A.rAnkle.rotation.x = lerp(A.rAnkle.rotation.x, 0.35, k);
  A.lShoulder.rotation.x = lerp(A.lShoulder.rotation.x, -0.35, k);
  A.lShoulder.rotation.z = lerp(A.lShoulder.rotation.z, 0.06, k);
  A.rShoulder.rotation.x = lerp(A.rShoulder.rotation.x, -0.35, k);
  A.rShoulder.rotation.z = lerp(A.rShoulder.rotation.z, -0.06, k);
  A.lElbow.rotation.x = lerp(A.lElbow.rotation.x, -1.05, k);
  A.rElbow.rotation.x = lerp(A.rElbow.rotation.x, -1.05, k);
  A.torso.rotation.x = lerp(A.torso.rotation.x, 0.05, k);
  A.torso.rotation.y = lerp(A.torso.rotation.y, 0, k);
  A.torso.rotation.z = lerp(A.torso.rotation.z, 0, k);
  A.torso.position.y = lerp(A.torso.position.y, 1.26, k);
  A.headJoint.rotation.x = lerp(A.headJoint.rotation.x, 0, k);
  A.headJoint.rotation.y = lerp(A.headJoint.rotation.y, 0, k);
  A.headJoint.rotation.z = lerp(A.headJoint.rotation.z, 0, k);
}

function enterVehicle(){
  inVehicle = true;
  jumpState = JWALK.NONE; jumpTimer = 0; velY = 0; onGround = true; moveSpeed = 0;
  jetBoosting = false; astro.jetFlame.grp.visible = false;
  enterHintEl.style.display = 'none';
  pickupHintEl.style.display = 'none';
  actionEl.style.display = 'none';
  dropHeldRock();
  vehicleCamPos.copy(camera.position);
  enterT = 0;
  enterFromPos.copy(astro.charRoot.position);
  enterFromYaw = charYaw;
  startEngineSound();
}
function exitVehicle(){
  inVehicle = false;
  const A = astro;
  const sideX = Math.cos(roverAngle), sideZ = -Math.sin(roverAngle);
  const exitDist = 3.2;
  const ex = roverX + sideX*exitDist, ez = roverZ + sideZ*exitDist;
  A.charRoot.position.set(ex, getMoonSurfaceY(ex,ez) + CHAR_BASE_Y, ez);
  charYaw = roverAngle;
  A.charRoot.rotation.y = charYaw;
  moveSpeed = 0; velY = 0; onGround = true; jumpState = JWALK.NONE;
  gameCamPos.copy(camera.position);
