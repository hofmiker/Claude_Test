}

function enterBigRig(){
  inBigRig = true;
  jumpState = JWALK.NONE; jumpTimer = 0; velY = 0; onGround = true; moveSpeed = 0;
  jetBoosting = false; astro.jetFlame.grp.visible = false;
  enterHintEl.style.display = 'none';
  pickupHintEl.style.display = 'none';
  // Stays visible (unlike in the rover) -- doubles as the cargo-arm control.
  actionEl.style.display = 'flex';
  dropHeldRock();
  bigRigArmActive = false; bigRigArmT = 0; bigRigArmStone = null;
  bigRigCamPos.copy(camera.position);
  bigRigEnterT = 0;
  bigRigEnterFromPos.copy(astro.charRoot.position);
  bigRigEnterFromYaw = charYaw;
  startEngineSound();
}
function exitBigRig(){
  inBigRig = false;
  // A stone gripped by the cargo arm is still parented under the rig's own
  // hierarchy -- leaving it there while on foot would move it in the rig's
  // local space instead of the world, so release it onto the ground first.
  if (heldRock && heldRock.mesh.parent !== moonScene){
    moonScene.attach(heldRock.mesh);
    const gy = getMoonSurfaceY(heldRock.mesh.position.x, heldRock.mesh.position.z);
    heldRock.x = heldRock.mesh.position.x;
    heldRock.z = heldRock.mesh.position.z;
    heldRock.mesh.position.y = gy + heldRock.embed;
    heldRock.held = false;
    heldRock = null;
    actionEl.classList.remove('holding');
  }
  bigRigArmActive = false; bigRigArmT = 0; bigRigArmStone = null;
  const A = astro;
  const sideX = Math.cos(bigRigAngle), sideZ = -Math.sin(bigRigAngle);
  const exitDist = 8;
  const ex = bigRigX + sideX*exitDist, ez = bigRigZ + sideZ*exitDist;
  A.charRoot.position.set(ex, getMoonSurfaceY(ex,ez) + CHAR_BASE_Y, ez);
  charYaw = bigRigAngle;
  A.charRoot.rotation.y = charYaw;
  moveSpeed = 0; velY = 0; onGround = true; jumpState = JWALK.NONE;
  gameCamPos.copy(camera.position);
  actionEl.style.display = 'flex';
  stopEngineSound();
}

function updateBigRigGameplay(dt){
  refreshInput();

  if (curInput.fwd > 0.02 || curInput.back > 0.02){
    camYawOffset = lerp(camYawOffset, 0, dt*3); camPitchOffset = lerp(camPitchOffset, 0, dt*3);
  }
  const onRoad = distToRoad(bigRigX, bigRigZ) < ROAD_HALF_WIDTH;
  const roadMaxSpd = BIGRIG_MAX_SPD * (onRoad ? 1.4 : 1);
  const gasIn = curInput.fwd, brakeIn = curInput.back;
  if (gasIn > brakeIn)        bigRigSpd = Math.min(bigRigSpd + BIGRIG_ACCEL*dt, roadMaxSpd*gasIn);
  else if (brakeIn > gasIn)   bigRigSpd = bigRigSpd > 0.05 ? Math.max(bigRigSpd - BIGRIG_BRAKE*dt, 0) : Math.max(bigRigSpd - BIGRIG_ACCEL*0.9*dt, -roadMaxSpd*BIGRIG_REVERSE_FRAC*brakeIn);
  else { const f = BIGRIG_FRICTION*dt; bigRigSpd = Math.abs(bigRigSpd) < f ? 0 : bigRigSpd - Math.sign(bigRigSpd)*f; }

  let steerTgt = 0;
  if (Math.abs(bigRigSpd) > 0.05){
    // Turning always follows the input direction, matching on-foot turning --
    // no forward/reverse flip, since that real-car behavior read as swapped
    // left/right to players used to the on-foot mapping.
    const turn = curInput.left - curInput.right;
    const sr = BIGRIG_STEER_RATE * (Math.abs(bigRigSpd)/BIGRIG_MAX_SPD);
    bigRigAngle += sr*dt*turn;
    steerTgt = turn*0.4;
  }
  bigRigSteerAng = lerp(bigRigSteerAng, steerTgt, 0.12);
  if (bigRig.userData.frontWheels) bigRig.userData.frontWheels.forEach(w => w.rotation.y = bigRigSteerAng);
  // Visual steering: the whole front half articulates at the middle joint
  // (like a bendy bus), not just the front wheels turning. Unlike the wheel
  // turn itself, the bend direction DOES flip in reverse -- pushing the
  // front half backward with the wheels turned a given way swings it the
  // opposite way from pulling it forward, same as a real trailer joint.
  const bendDir = bigRigSpd < 0 ? -1 : 1;
  if (bigRig.userData.frontPivot) bigRig.userData.frontPivot.rotation.y = clamp(bigRigSteerAng*1.6*bendDir, -0.6, 0.6);

  const fwdX = Math.sin(bigRigAngle), fwdZ = Math.cos(bigRigAngle);
  const nx = bigRigX + fwdX*bigRigSpd*dt, nz = bigRigZ + fwdZ*bigRigSpd*dt;
  let resolved = resolveSlide(bigRigX, bigRigZ, nx, nz, BIGRIG_COLLIDE_R, moonCollidables);
  resolved = resolveSlide(bigRigX, bigRigZ, resolved.x, resolved.z, BIGRIG_COLLIDE_R, [{ x:roverX, z:roverZ, r:ROVER_COLLIDE_R }]);
  resolved = resolveSlide(bigRigX, bigRigZ, resolved.x, resolved.z, BIGRIG_COLLIDE_R, vehicleOnlyCollidables);
  if (Math.hypot(resolved.x-nx, resolved.z-nz) > 0.01) bigRigSpd *= 0.35;
  bigRigX = resolved.x; bigRigZ = resolved.z;
  const groundY = getMoonSurfaceY(bigRigX, bigRigZ);
  bigRig.position.set(bigRigX, groundY, bigRigZ);
  popStonesNear(bigRigX, bigRigZ, BIGRIG_POP_RADIUS);

  const rightX = Math.cos(bigRigAngle), rightZ = -Math.sin(bigRigAngle);
  const yAhead  = getMoonSurfaceY(bigRigX+fwdX*BIGRIG_HALF_LEN,   bigRigZ+fwdZ*BIGRIG_HALF_LEN);
  const yBehind = getMoonSurfaceY(bigRigX-fwdX*BIGRIG_HALF_LEN,   bigRigZ-fwdZ*BIGRIG_HALF_LEN);
  const yRight  = getMoonSurfaceY(bigRigX+rightX*BIGRIG_HALF_WID, bigRigZ+rightZ*BIGRIG_HALF_WID);
  const yLeft   = getMoonSurfaceY(bigRigX-rightX*BIGRIG_HALF_WID, bigRigZ-rightZ*BIGRIG_HALF_WID);
  const pitchTarget = Math.atan2(yBehind-yAhead, BIGRIG_HALF_LEN*2);
  const rollTarget  = Math.atan2(yRight-yLeft, BIGRIG_HALF_WID*2);
  bigRigPitch = lerp(bigRigPitch, pitchTarget, 0.12);
  bigRigRoll  = lerp(bigRigRoll, rollTarget, 0.12);
  bigRig.rotation.set(bigRigPitch, bigRigAngle, bigRigRoll);
  bigRig.updateMatrixWorld(true);

  spawnGroundDust(dt, bigRigX - fwdX*4, bigRigZ - fwdZ*4, groundY, Math.min(1, Math.abs(bigRigSpd)/BIGRIG_MAX_SPD), true);
  updateEngineSound(dt, bigRigSpd/BIGRIG_MAX_SPD);

  if (actionBuf){ actionBuf = false; triggerBigRigArm(); }

  // The cockpit/seat now lives inside frontPivot, which articulates
  // relative to the rest of the rig while turning -- transform through it
  // (not bigRig directly) so the seat stays put under the dome mid-turn.
  tmpSeat.copy(BIGRIG_SEAT_LOCAL);
  bigRig.updateMatrixWorld(true);
  bigRig.userData.frontPivot.localToWorld(tmpSeat);
  bigRigEnterT = Math.min(bigRigEnterT + dt/BIGRIG_ENTER_ANIM_DUR, 1);
  const easeT = smoothstep(0, 1, bigRigEnterT);
  astro.charRoot.position.set(
    lerp(bigRigEnterFromPos.x, tmpSeat.x, easeT),
    lerp(bigRigEnterFromPos.y, tmpSeat.y, easeT),
    lerp(bigRigEnterFromPos.z, tmpSeat.z, easeT)
  );
  let bigYawDiff = bigRigAngle - bigRigEnterFromYaw;
  while (bigYawDiff > Math.PI) bigYawDiff -= Math.PI*2;
  while (bigYawDiff < -Math.PI) bigYawDiff += Math.PI*2;
  astro.charRoot.rotation.y = bigRigEnterFromYaw + bigYawDiff*easeT;
  poseAstronautSeated(easeT);

  if (jumpBuf){ jumpBuf = false; exitBigRig(); return; }

  const baseBBack = 26.0 * (isMobile ? MOBILE_CAM_MULT : 1);
  const baseBHeight = 13.0;
  bigRigCamDist = lerp(bigRigCamDist, baseBBack, dt*2.5);
  bigRigCamHeight = lerp(bigRigCamHeight, baseBHeight, dt*2.5);
  const camFwdXB = Math.sin(bigRigAngle+camYawOffset), camFwdZB = Math.cos(bigRigAngle+camYawOffset);
  const bCam = new THREE.Vector3(
    bigRigX - camFwdXB*bigRigCamDist,
    groundY + bigRigCamHeight + camPitchOffset*6,
    bigRigZ - camFwdZB*bigRigCamDist
  );
  bigRigCamPos.lerp(bCam, 0.08);
  camera.position.copy(bigRigCamPos);
  camera.lookAt(bigRigX, groundY + 5.0 - camPitchOffset*4, bigRigZ);
}

function updateRoverGameplay(dt){
  refreshInput();

  if (curInput.fwd > 0.02 || curInput.back > 0.02){
    camYawOffset = lerp(camYawOffset, 0, dt*3); camPitchOffset = lerp(camPitchOffset, 0, dt*3);
  }
  const onRoad = distToRoad(roverX, roverZ) < ROAD_HALF_WIDTH;
  const roadMaxSpd = ROVER_MAX_SPD * (onRoad ? 1.4 : 1);
  const gasIn = curInput.fwd, brakeIn = curInput.back;
  if (gasIn > brakeIn)        roverSpd = Math.min(roverSpd + ROVER_ACCEL*dt, roadMaxSpd*gasIn);
  else if (brakeIn > gasIn)   roverSpd = roverSpd > 0.05 ? Math.max(roverSpd - ROVER_BRAKE*dt, 0) : Math.max(roverSpd - ROVER_ACCEL*0.9*dt, -roadMaxSpd*ROVER_REVERSE_FRAC*brakeIn);
  else { const f = ROVER_FRICTION*dt; roverSpd = Math.abs(roverSpd) < f ? 0 : roverSpd - Math.sign(roverSpd)*f; }

  let steerTgt = 0;
  if (Math.abs(roverSpd) > 0.05){
    // Turning always follows the input direction, matching on-foot turning --
    // no forward/reverse flip, since that real-car behavior read as swapped
    // left/right to players used to the on-foot mapping.
    const turn = curInput.left - curInput.right;
    const sr = ROVER_STEER_RATE * (Math.abs(roverSpd)/ROVER_MAX_SPD);
    roverAngle += sr*dt*turn;
    steerTgt = turn*0.5;
  }
  roverSteerAng = lerp(roverSteerAng, steerTgt, 0.15);
  if (rover.userData.frontWheels) rover.userData.frontWheels.forEach(w => w.rotation.y = roverSteerAng);

  const fwdX = Math.sin(roverAngle), fwdZ = Math.cos(roverAngle);
  const nx = roverX + fwdX*roverSpd*dt, nz = roverZ + fwdZ*roverSpd*dt;
  let resolved = resolveSlide(roverX, roverZ, nx, nz, ROVER_COLLIDE_R, moonCollidables);
  resolved = resolveSlide(roverX, roverZ, resolved.x, resolved.z, ROVER_COLLIDE_R, [{ x:bigRigX, z:bigRigZ, r:BIGRIG_COLLIDE_R }]);
  resolved = resolveSlide(roverX, roverZ, resolved.x, resolved.z, ROVER_COLLIDE_R, vehicleOnlyCollidables);
  if (Math.hypot(resolved.x-nx, resolved.z-nz) > 0.01) roverSpd *= 0.4;
  roverX = resolved.x; roverZ = resolved.z;
  const groundY = getMoonSurfaceY(roverX, roverZ);
  rover.position.set(roverX, groundY, roverZ);
  popStonesNear(roverX, roverZ, ROVER_POP_RADIUS);

  // Tilt with the slope: sample ground height at the front/back/left/right
  // of the footprint and lean the chassis to match, instead of always
  // sitting perfectly level regardless of terrain.
  const rightX = Math.cos(roverAngle), rightZ = -Math.sin(roverAngle);
  const yAhead  = getMoonSurfaceY(roverX+fwdX*ROVER_HALF_LEN,   roverZ+fwdZ*ROVER_HALF_LEN);
  const yBehind = getMoonSurfaceY(roverX-fwdX*ROVER_HALF_LEN,   roverZ-fwdZ*ROVER_HALF_LEN);
  const yRight  = getMoonSurfaceY(roverX+rightX*ROVER_HALF_WID, roverZ+rightZ*ROVER_HALF_WID);
  const yLeft   = getMoonSurfaceY(roverX-rightX*ROVER_HALF_WID, roverZ-rightZ*ROVER_HALF_WID);
  const pitchTarget = Math.atan2(yBehind-yAhead, ROVER_HALF_LEN*2);
  const rollTarget  = Math.atan2(yRight-yLeft, ROVER_HALF_WID*2);
  roverPitch = lerp(roverPitch, pitchTarget, 0.15);
  roverRoll  = lerp(roverRoll, rollTarget, 0.15);
  rover.rotation.set(roverPitch, roverAngle, roverRoll);
  rover.updateMatrixWorld(true);

  spawnGroundDust(dt, roverX - fwdX*2, roverZ - fwdZ*2, groundY, Math.min(1, Math.abs(roverSpd)/ROVER_MAX_SPD), true);
  updateEngineSound(dt, roverSpd/ROVER_MAX_SPD);

  tmpSeat.copy(SEAT_LOCAL);
  rover.localToWorld(tmpSeat);
  const seatY = tmpSeat.y - SEAT_SIT_DROP;
  enterT = Math.min(enterT + dt/ENTER_ANIM_DUR, 1);
  const easeT = smoothstep(0, 1, enterT);
  astro.charRoot.position.set(
    lerp(enterFromPos.x, tmpSeat.x, easeT),
    lerp(enterFromPos.y, seatY, easeT),
    lerp(enterFromPos.z, tmpSeat.z, easeT)
  );
  let yawDiff = roverAngle - enterFromYaw;
  while (yawDiff > Math.PI) yawDiff -= Math.PI*2;
  while (yawDiff < -Math.PI) yawDiff += Math.PI*2;
  astro.charRoot.rotation.y = enterFromYaw + yawDiff*easeT;
  poseAstronautSeated(easeT);

  if (jumpBuf){ jumpBuf = false; exitVehicle(); return; }

  const baseVBack = 11.5 * (isMobile ? MOBILE_CAM_MULT : 1);
  const baseVHeight = 5.5;
  vehicleCamDist = lerp(vehicleCamDist, baseVBack, dt*2.5);
  vehicleCamHeight = lerp(vehicleCamHeight, baseVHeight, dt*2.5);
  const camFwdXV = Math.sin(roverAngle+camYawOffset), camFwdZV = Math.cos(roverAngle+camYawOffset);
  const tCam = new THREE.Vector3(
    roverX - camFwdXV*vehicleCamDist,
    groundY + vehicleCamHeight + camPitchOffset*6,
    roverZ - camFwdZV*vehicleCamDist
  );
  vehicleCamPos.lerp(tCam, 0.08);
  camera.position.copy(vehicleCamPos);
  camera.lookAt(roverX, groundY + 2.0 - camPitchOffset*4, roverZ);
}

function updateAstronautGameplay(dt){
  const A = astro;
  refreshInput();

  charYaw += TURN_RATE * dt * (curInput.left - curInput.right);
  A.charRoot.rotation.y = charYaw;

  const fwdX = Math.sin(charYaw), fwdZ = Math.cos(charYaw);
  const mag = Math.max(curInput.fwd, curInput.back);
  if (mag > 0.02) moveSpeed = Math.min(moveSpeed + ACCEL_RATE*dt, SPEED_MAX*mag);
  else            moveSpeed = Math.max(moveSpeed - DECEL_RATE*dt, 0);
  const oldX = A.charRoot.position.x, oldZ = A.charRoot.position.z;
  let nx = oldX, nz = oldZ;
  if (curInput.fwd  > curInput.back) { nx += fwdX*moveSpeed*dt; nz += fwdZ*moveSpeed*dt; }
  if (curInput.back > curInput.fwd)  { nx -= fwdX*moveSpeed*dt; nz -= fwdZ*moveSpeed*dt; }
  let resolvedPos = resolveSlide(oldX, oldZ, nx, nz, CHAR_RADIUS, moonCollidables);
  resolvedPos = resolveSlide(oldX, oldZ, resolvedPos.x, resolvedPos.z, CHAR_RADIUS, [{ x:roverX, z:roverZ, r:ROVER_COLLIDE_R }]);
  resolvedPos = resolveSlide(oldX, oldZ, resolvedPos.x, resolvedPos.z, CHAR_RADIUS, [{ x:bigRigX, z:bigRigZ, r:BIGRIG_COLLIDE_R }]);
  A.charRoot.position.x = resolvedPos.x;
  A.charRoot.position.z = resolvedPos.z;

  const distToRover = Math.hypot(A.charRoot.position.x - roverX, A.charRoot.position.z - roverZ);
  const distToBigRig = Math.hypot(A.charRoot.position.x - bigRigX, A.charRoot.position.z - bigRigZ);
  const nearRover = distToRover < VEHICLE_ENTER_RADIUS;
  const nearBigRig = distToBigRig < BIGRIG_ENTER_RADIUS;
  enterHintEl.style.display = ((nearRover || nearBigRig) && onGround) ? 'block' : 'none';
  if (jumpBuf && onGround && (nearRover || nearBigRig)){
    jumpBuf = false;
    // If both are in range (unlikely given their separation), enter whichever is closer.
    if (nearBigRig && (!nearRover || distToBigRig < distToRover)) enterBigRig();
    else enterVehicle();
    return;
  }

  if (actionBuf){
    actionBuf = false;
    if (heldRock) dropHeldRock(); else pickUpNearestRock();
  }
  let nearStone = null;
  if (heldRock){
    heldRock.mesh.position.set(
      A.charRoot.position.x + fwdX*1.1,
      A.charRoot.position.y + 1.15,
      A.charRoot.position.z + fwdZ*1.1
    );
    pickupHintEl.style.display = 'none';
  } else {
    nearStone = nearestLiftableStone(A.charRoot.position.x, A.charRoot.position.z);
    pickupHintEl.style.display = (nearStone && onGround) ? 'block' : 'none';
  }

  // Rocket boost: pressing jump again while airborne fires the backpack
  // thruster for a higher, farther kick -- chainable, so repeated presses
  // during ascent let you keep climbing instead of only getting one boost
  // per jump.
  if (jumpBuf && jumpState === JWALK.AIR){
    jumpBuf = false;
    jetBoosting = true;
    jetPulseT = 0;
    velY = JUMP_BOOST_VEL;
    moveSpeed = Math.min(moveSpeed * JUMP_BOOST_SPEED_MULT, SPEED_MAX * JUMP_BOOST_SPEED_MULT);
    A.jetFlame.grp.visible = true;
    playJetBoost();
    spawnPuff(new THREE.Vector3(A.charRoot.position.x, A.charRoot.position.y+0.9, A.charRoot.position.z), {
      color: 0xffa93c, opacity: 0.85, emissive: 0xff7a1a, emissiveIntensity: 1.4,
      vel: new THREE.Vector3(rand(-1,1), -3, rand(-1,1)), growth: 5, maxLife: 0.4, scale0: 0.4,
      fadeFrom: 0.15, drag: 0.9, maxScale: 2.2,
    }, moonScene);
  }

  if (jumpBuf && onGround && jumpState !== JWALK.WINDUP && jumpState !== JWALK.AIR){
    jumpState = JWALK.WINDUP; jumpTimer = 0; jumpBuf = false;
  }
  if (jumpState === JWALK.WINDUP){
    jumpTimer += dt;
    if (jumpTimer >= WINDUP_DUR){ velY = JUMP_VEL; onGround = false; jumpState = JWALK.AIR; jumpTimer = 0; playJump(); }
  }
  if (jumpState === JWALK.LAND){
    jumpTimer += dt;
    if (jumpTimer >= LAND_DUR) jumpState = JWALK.NONE;
  }

  if (jetBoosting){
    jetPulseT += dt;
    pulseEngine(A.jetFlame.grp, jetPulseT, 55);
  }

  velY += GRAVITY * dt;
  A.charRoot.position.y += velY * dt;
  const surfY = getMoonSurfaceY(A.charRoot.position.x, A.charRoot.position.z) + CHAR_BASE_Y;
  if (A.charRoot.position.y <= surfY){
    if (velY < -1.5 && jumpState === JWALK.AIR){ jumpState = JWALK.LAND; jumpTimer = 0; playLand(); }
    else if (jumpState === JWALK.AIR){ jumpState = JWALK.NONE; }
    A.charRoot.position.y = surfY;
    velY = 0; onGround = true;
    jetBoosting = false; A.jetFlame.grp.visible = false;
  } else {
    onGround = false;
    if (jumpState === JWALK.NONE) jumpState = JWALK.AIR;
  }

  animateAstronaut(dt, !heldRock ? nearStone : null);

  const moving = curInput.fwd > 0.02 || curInput.back > 0.02;
  if (onGround && moving) spawnGroundDust(dt, A.charRoot.position.x, A.charRoot.position.z, surfY, 1, false);
  // Look-drag offset auto-recenters once the player actually moves in a
  // direction -- otherwise a stale look angle from an earlier drag would
  // keep the camera awkwardly off-axis from where you're now heading.
  if (moving){ camYawOffset = lerp(camYawOffset, 0, dt*3); camPitchOffset = lerp(camPitchOffset, 0, dt*3); }
  const baseBack = (jetBoosting ? 13.0 : moving ? 7.0 : 4.0) * (isMobile ? MOBILE_CAM_MULT : 1);
  const baseHeight = jetBoosting ? 5.0 : 2.6;
  gameCamDist = lerp(gameCamDist, baseBack, dt*2.5);
  gameCamHeight = lerp(gameCamHeight, baseHeight, dt*2.5);
  const camFwdXA = Math.sin(charYaw+camYawOffset), camFwdZA = Math.cos(charYaw+camYawOffset);
  const tCam = new THREE.Vector3(
    A.charRoot.position.x - camFwdXA*gameCamDist,
    A.charRoot.position.y + gameCamHeight + camPitchOffset*6,
    A.charRoot.position.z - camFwdZA*gameCamDist
  );
  gameCamPos.lerp(tCam, 0.08);
  camera.position.copy(gameCamPos);
  camera.lookAt(A.charRoot.position.x, A.charRoot.position.y + 1.1 - camPitchOffset*4, A.charRoot.position.z);
}

/* ---------- post-landing cutscene: ramp out, hatch opens, astronaut exits ---------- */
let walkPath = null;
let astroRevealed = false;

function computeWalkPath(){
  const su = shipPart.userData;
  const rampRise = su.hatchY + PLATFORM_H;
  const p0 = shipPart.localToWorld(new THREE.Vector3(su.hatchR-0.5, su.hatchY-3.0+CHAR_BASE_Y, 0));
  const p1 = shipPart.localToWorld(new THREE.Vector3(su.hatchR+su.rampRun, su.hatchY-rampRise+CHAR_BASE_Y, 0));
  const p2 = p1.clone().add(new THREE.Vector3(9,0,5));
  return [p0,p1,p2];
}
function scriptedWalk(wp){
  const [a,b,c] = walkPath;
  let from,to,localT;
  if (wp < 0.65){ from=a; to=b; localT=wp/0.65; }
  else { from=b; to=c; localT=(wp-0.65)/0.35; }
  const e = smoothstep(0,1,localT);
  astro.charRoot.position.lerpVectors(from, to, e);
  const dir = new THREE.Vector3().subVectors(to, from);
  if (dir.lengthSq() > 0.0001){
    charYaw = Math.atan2(dir.x, dir.z);
    astro.charRoot.rotation.y = charYaw;
  }
}
function hatchShotPos(hatchWorld){
  return new THREE.Vector3(hatchWorld.x+26, hatchWorld.y+9, hatchWorld.z+22);
}
function cameraCloseupOnHatch(){
  const su = shipPart.userData;
  const hatchWorld = shipPart.localToWorld(new THREE.Vector3(su.hatchR, su.hatchY, 0));
  const pos = hatchShotPos(hatchWorld);
  camera.position.copy(pos);
  camera.lookAt(hatchWorld.x, hatchWorld.y-0.5, hatchWorld.z);
}
function cameraSwingToGameplay(tt){
  const p = smoothstep(T_WALK_START, T_HANDOFF, tt);
  const su = shipPart.userData;
  const hatchWorld = shipPart.localToWorld(new THREE.Vector3(su.hatchR, su.hatchY, 0));
  const fromPos = hatchShotPos(hatchWorld);
  const A = astro;
  const behindPos = new THREE.Vector3(
    A.charRoot.position.x - Math.sin(charYaw)*7,
    A.charRoot.position.y + 2.6,
    A.charRoot.position.z - Math.cos(charYaw)*7
  );
  const pos = fromPos.clone().lerp(behindPos, p);
  camera.position.copy(pos);
  const lookTo = new THREE.Vector3(A.charRoot.position.x, A.charRoot.position.y+1.1, A.charRoot.position.z);
  const look = hatchWorld.clone().lerp(lookTo, p);
  camera.lookAt(look);
  if (p >= 1) gameCamPos.copy(pos);
}

const rampHatchWorld = new THREE.Vector3();
const rampStartWorld = new THREE.Vector3();
function updateCutscene(dt){
  const su = shipPart.userData;
  shipPart.position.y = PLATFORM_H;
  su.engineGlow.visible = false;

  // Ramp rig drives in from outside and docks at the hatch (not a panel
  // hinged to the hull unfolding away from the ship).
  const rampP = smoothstep(T_RAMP_START, T_RAMP_END, t);
  if (rampP > 0) rampRig.visible = true;
  rampHatchWorld.set(PAD_X + su.hatchR, PLATFORM_H + su.hatchY, 0);
  rampStartWorld.set(rampHatchWorld.x + 46, rampHatchWorld.y, rampHatchWorld.z);
  rampRig.position.lerpVectors(rampStartWorld, rampHatchWorld, rampP);

  const hatchP = smoothstep(T_HATCH_OPEN_START, T_HATCH_OPEN_END, t);
  su.hatchPivot.rotation.y = lerp(0, -1.9, hatchP);

  if (!astroRevealed && t >= T_HATCH_OPEN_START + 0.5){
    astroRevealed = true;
    walkPath = computeWalkPath();
    astro.charRoot.visible = true;
    astro.charRoot.position.copy(walkPath[0]);
    const dir = new THREE.Vector3().subVectors(walkPath[1], walkPath[0]);
    charYaw = Math.atan2(dir.x, dir.z);
    astro.charRoot.rotation.y = charYaw;
  }

  if (t < T_HATCH_CUT){
    updateCameraMoon(PLATFORM_H);
  } else if (t < T_WALK_START){
    cameraCloseupOnHatch();
  } else if (t < T_HANDOFF){
    // Start tracking as soon as the astronaut starts moving (not only after
    // they finish walking) so they stay in frame all the way down the ramp
    // instead of walking out of a camera that's still fixed on the hatch.
    cameraSwingToGameplay(t);
  }

  if (astroRevealed){
    if (t >= T_WALK_START && t < T_WALK_END){
      scriptedWalk(clamp((t-T_WALK_START)/(T_WALK_END-T_WALK_START),0,1));
      // animateAstronaut reads curInput (not the raw keys map) for its walk
      // cycle since the joystick input port -- drive it directly here so the
      // scripted walk actually plays the leg/arm animation instead of a
      // static slide.
      curInput.fwd = 1; curInput.back = 0; curInput.left = 0; curInput.right = 0;
      animateAstronaut(dt);
    } else {
      curInput.fwd = 0; curInput.back = 0;
      animateAstronaut(dt);
    }
  }

  if (t >= T_HANDOFF && !gameMode) enterGameMode();
}

function overlayOpacity(tt){
  if (tt < 1.2) return 1 - smoothstep(0,1.2,tt);
  // Fade-to-black is anchored to T_BLACK (the actual scene-cut moment) rather
  // than T_ASCENT_END, since the ascent now keeps climbing well past the cut
  // instead of finishing just before it.
  const fadeStart = T_BLACK - 1.2;
  if (tt >= fadeStart && tt < T_MOON_IN){
    if (tt < T_BLACK) return smoothstep(fadeStart,T_BLACK,tt);
    return 1 - smoothstep(T_BLACK,T_MOON_IN,tt);
  }
  return 0;
}

function buildCockpitScreenTex(){
  const size = 128;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#03222b'; ctx.fillRect(0,0,size,size);
  ctx.strokeStyle = '#4be0ff'; ctx.lineWidth = 2;
  ctx.beginPath();
  for(let i=0;i<7;i++){ ctx.moveTo(0, 8+i*17); ctx.lineTo(size, 2+i*18); }
  ctx.stroke();
  ctx.fillStyle = '#8ff2ff';
  for(let i=0;i<9;i++) ctx.fillRect(6+i*13, size-28+Math.sin(i*1.3)*10, 7,7);
  return new THREE.CanvasTexture(c);
}

function cockpitIntroOpacity(tt){
  if (tt < 0.7) return 1 - smoothstep(0,0.7,tt);
  if (tt > T_COCKPIT_INTRO - 0.7) return smoothstep(T_COCKPIT_INTRO-0.7, T_COCKPIT_INTRO, tt);
  return 0;
}

function updateCockpitIntro(tt){
  fadeEl.style.opacity = cockpitIntroOpacity(tt);

  // Slow pan across the console over the course of the intro, ending near
  // the lever so its pull is actually in frame instead of off to the side.
  const panX = lerp(-0.6, 1.1, clamp(tt/T_COCKPIT_INTRO, 0, 1));
  const swayX = Math.sin(tt*0.55)*0.05;
  const swayY = Math.sin(tt*0.8+1)*0.025;
  camera.position.set(panX+swayX, COCKPIT_Y+1.55+swayY, 0.35);
  camera.lookAt(panX+swayX*0.5, COCKPIT_Y+0.45, -1.0);

  // Right hand roams across the button row, with a quick tap-bounce.
  const tapCycle = (tt*1.6) % 1;
  const tapBounce = tapCycle < 0.2 ? Math.sin(tapCycle/0.2*Math.PI)*0.06 : 0;
  cockpitRightHand.position.set(Math.sin(tt*0.85)*0.8, 0.24-tapBounce, 0.32);
  cockpitRightHand.rotation.z = Math.sin(tt*0.85)*0.15;

  // Left hand idles near the screens for the first half, then reaches for
  // the lever and pulls it down through the back half of the intro.
  const leverT = clamp((tt - T_COCKPIT_INTRO*0.5) / (T_COCKPIT_INTRO*0.35), 0, 1);
  cockpitLeverPivot.rotation.x = -leverT*0.85;
  if (leverT > 0.05){
    cockpitLeftHand.position.set(1.35, 0.42 - leverT*0.28, 0.15 + leverT*0.12);
    cockpitLeftHand.rotation.x = -leverT*0.85;
  } else {
    cockpitLeftHand.position.set(-0.6+Math.sin(tt*0.5)*0.2, 0.22+Math.sin(tt*2.2)*0.02, -0.05);
    cockpitLeftHand.rotation.x = 0;
  }
}

function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastNow)/1000, 0.05);
  lastNow = now;

  if (gameMode){
    updatePuffs(dt);
    // Runs every frame regardless of mode so the hatch/arm can finish
    // stowing after the player exits, not just while actively driving it.
    updateBigRigArm(dt);
    if (inVehicle) updateRoverGameplay(dt);
    else if (inBigRig) updateBigRigGameplay(dt);
    else updateAstronautGameplay(dt);
    const curX = inVehicle ? roverX : inBigRig ? bigRigX : astro.charRoot.position.x;
    const curZ = inVehicle ? roverZ : inBigRig ? bigRigZ : astro.charRoot.position.z;
    const curAngle = inVehicle ? roverAngle : inBigRig ? bigRigAngle : charYaw;
    updateCrystals(dt, now/1000, curX, curZ);
    drawMinimap(curX, curZ, curAngle);
    renderer.render(scene, camera);
    return;
  }

  const rawT = (now - missionStart)/1000;
  if (rawT < T_COCKPIT_INTRO){
    updateCockpitIntro(rawT);
    renderer.render(scene, camera);
    return;
  }
  t = rawT - T_COCKPIT_INTRO;

  updateCountdown(t);

  if (!state.moonSwapped){
    updateSky(t);
    const altitude = currentAltitude(t);

    const armProg = smoothstep(T_IGNITE-0.6, T_LIFTOFF-0.2, t);
    tower.userData.armPivot.rotation.z = -1.05*armProg;

    if (!state.separated){
      rocketStack.position.y = PAD_TOP + altitude;

      const bg = boosterPart.userData.engineGlow;
      if (t > T_IGNITE) bg.visible = true;
      if (t > T_IGNITE && !state.rumbleStarted){
        state.rumbleStarted = true;
        startLaunchRumble();
        playIgnitionCrack();
      }
      if (bg.visible){
        pulseEngine(bg, t, 38);
        bg.getWorldPosition(tmpV);
        spawnEngineTrail(dt, tmpV, 1.15);
      }

      if (altitude < LOW_ALT_THRESHOLD){
        spawnLaunchSmoke(dt, rocketStack.position.x);
      }

      if (altitude > SEPARATION_ALT){
        state.separated = true;
        state.sepTime = t;
        state.sepVelY = altitudeVelocity(t);
        boosterPart.getWorldPosition(tmpV);
        state.sepX0 = tmpV.x; state.sepY0 = tmpV.y; state.sepZ0 = tmpV.z;
        launchScene.add(boosterPart);
        boosterPart.position.copy(tmpV);
        shipPart.getWorldPosition(tmpV);
        launchScene.add(shipPart);
        shipPart.position.copy(tmpV);
        bg.visible = false;
        shipPart.userData.engineGlow.visible = true;
      }
    } else {
      shipPart.position.y = PAD_TOP + altitude + SHIP_LOCAL_Y;

      const sg = shipPart.userData.engineGlow;
      if (t > T_ASCENT_END - 1) sg.visible = altitude < ASCENT_DIST*0.55;
      if (sg.visible){
        pulseEngine(sg, t, 38);
        sg.getWorldPosition(tmpV);
        spawnEngineTrail(dt, tmpV, 0.85);
      }

      const dtSep = t - state.sepTime;
      boosterPart.position.y = state.sepY0 + state.sepVelY*dtSep - 0.5*FALL_G*dtSep*dtSep;
      boosterPart.position.x = state.sepX0 + dtSep*18;
      boosterPart.position.z = state.sepZ0 + dtSep*7;
      boosterPart.rotation.x += dt*1.4;
      boosterPart.rotation.z += dt*0.8;
      if (boosterPart.position.y < -60) boosterPart.visible = false;
    }

    updatePuffs(dt);
    updateCameraLaunch(altitude, t);
    if (state.rumbleStarted){
      const rumbleIntensity = smoothstep(T_IGNITE-0.3, T_IGNITE+0.5, t) * (1 - smoothstep(T_ASCENT_END-4, T_ASCENT_END, t));
      updateLaunchRumble(rumbleIntensity);
    }

    const activeGlow = state.separated ? shipPart.userData.engineGlow : boosterPart.userData.engineGlow;
    activeGlow.getWorldPosition(tmpV);
    const glowStrength = activeGlow.visible ? clamp(1 - altitude/260, 0.2, 1) : 0;
    updateGlow(tmpV, glowStrength*0.95);

    if (t >= T_BLACK && !state.moonSwapped){
      state.moonSwapped = true;
      stopLaunchRumble();
      launchScene.visible = false;
      moonScene.visible = false;
      launchScene.remove(shipPart);
      moonScene.add(shipPart);
      shipPart.position.set(PAD_X, MOON_START_Y, 0);
      shipPart.rotation.set(0,0,0);
      camState.y = 90 + MOON_START_Y*0.55 + 40;
    }
  } else {
    if (t >= T_MOON_IN && !moonScene.visible) moonScene.visible = true;

    const q = clamp((t - T_MOON_IN)/(T_MOON_TOUCHDOWN - T_MOON_IN), 0, 1);
    const y = MOON_START_Y * (1-q)*(1-q) + PLATFORM_H;
    shipPart.position.y = y;

    const sg = shipPart.userData.engineGlow;
    sg.visible = q > 0.02 && q < 1.0;
    if (sg.visible){
      pulseEngine(sg, t, 40);
    }

    const closeness = clamp(1 - (y-PLATFORM_H)/70, 0, 1);
    if (closeness > 0) spawnMoonDust(dt, shipPart.position, closeness);
    if (q > 0.04 && q < 0.94) spawnRCS(dt);
    updatePuffs(dt);

    if (q >= 1 && t >= T_RAMP_START){
      updateCutscene(dt);
    } else {
      updateCameraMoon(y);
    }

    sg.getWorldPosition(tmpV);
    // Noticeably less orange screen-space glow on landing than the 0.9 used
    // during launch -- the touchdown engine burn shouldn't wash out the moon
    // view the way the liftoff fireball does.
    updateGlow(tmpV, sg.visible ? 0.4 : 0);

    stars.material.opacity = 1;
    skyEl.style.background = "linear-gradient(#03040c,#0a0c1c)";
  }

  fadeEl.style.opacity = overlayOpacity(t);

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
